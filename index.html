<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#6c5ce7">
<title>iMath — репетитор по математике</title>
<meta name="description" content="iMath: онлайн-занятия по математике, тренажёры, домашние задания и разбор ОГЭ, ЕГЭ, ВПР.">
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
/* ===== A1. ПЕРЕМЕННЫЕ ===== */
:root{
  --brand:#6c5ce7; --brand-2:#8b7cf6; --brand-dark:#4b3fc0;
  --ok:#00b894; --warn:#fdcb6e; --err:#e17055; --info:#0984e3; --pink:#e84393;
  --bg:#f4f5fb; --surface:#fff; --surface-2:#fafbff;
  --text:#1c1f33; --muted:#6b7192; --line:#e6e8f5;
  --r-sm:10px; --r:16px; --r-lg:24px; --r-full:999px;
  --sh-1:0 1px 2px rgba(28,31,51,.06),0 2px 8px rgba(28,31,51,.05);
  --sh-2:0 4px 14px rgba(28,31,51,.09);
  --sh-3:0 14px 40px rgba(76,63,192,.18);
  --grad:linear-gradient(135deg,#6c5ce7,#8b7cf6 55%,#a78bfa);
  --grad-warm:linear-gradient(135deg,#fdcb6e,#e17055);
  --ease:cubic-bezier(.4,0,.2,1);
  --nav-h:64px; --safe-b:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#12141f; --surface:#1b1e2d; --surface-2:#222639;
    --text:#eef0fa; --muted:#9aa0c0; --line:#2b3049;
    --sh-1:0 1px 2px rgba(0,0,0,.4); --sh-2:0 4px 16px rgba(0,0,0,.45);
  }
}
/* ===== A2. БАЗА ===== */
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;font:400 16px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,sans-serif;
  background:var(--bg);color:var(--text);
  -webkit-font-smoothing:antialiased;overscroll-behavior-y:none;
}
h1,h2,h3,h4{margin:0 0 .4em;line-height:1.22;font-weight:700;letter-spacing:-.01em}
h1{font-size:clamp(28px,5vw,44px)} h2{font-size:clamp(22px,3.4vw,30px)} h3{font-size:19px}
p{margin:0 0 .8em}
a{color:var(--brand);text-decoration:none}
a:hover{text-decoration:underline}
img{max-width:100%;display:block}
button,input,textarea,select{font:inherit;color:inherit}
:focus-visible{outline:2.5px solid var(--brand);outline-offset:2px;border-radius:6px}
.mq-wrap{width:100%;max-width:1120px;margin:0 auto;padding:0 16px}
.mq-hide{display:none!important}
.mq-muted{color:var(--muted)}
.mq-center{text-align:center}
.mq-row{display:flex;align-items:center;gap:10px}
.mq-row--wrap{flex-wrap:wrap}
.mq-spacer{flex:1}
.mq-stack{display:flex;flex-direction:column;gap:12px}
.mq-grid{display:grid;gap:16px}
.mq-grid--2{grid-template-columns:repeat(auto-fit,minmax(280px,1fr))}
.mq-grid--3{grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.mq-grid--4{grid-template-columns:repeat(auto-fill,minmax(170px,1fr))}
/* ===== A3. ИКОНКИ ===== */
.mq-ic{flex:0 0 auto;vertical-align:-.18em}
.mq-ic-wrap{display:inline-flex;align-items:center}
.mq-ic-badge{
  width:44px;height:44px;border-radius:14px;display:grid;place-items:center;
  background:color-mix(in srgb,var(--brand) 14%,transparent);color:var(--brand);flex:0 0 auto;
}
.mq-ic-badge--ok{background:color-mix(in srgb,var(--ok) 15%,transparent);color:var(--ok)}
.mq-ic-badge--warn{background:color-mix(in srgb,var(--warn) 22%,transparent);color:#b8860b}
.mq-ic-badge--err{background:color-mix(in srgb,var(--err) 15%,transparent);color:var(--err)}
.mq-ic-badge--info{background:color-mix(in srgb,var(--info) 14%,transparent);color:var(--info)}
/* ===== A4. КНОПКИ ===== */
.mq-btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  padding:11px 18px;border:1px solid transparent;border-radius:var(--r-full);
  background:var(--surface-2);color:var(--text);font-weight:600;font-size:15px;
  cursor:pointer;transition:transform .16s var(--ease),box-shadow .16s var(--ease),background .16s;
  -webkit-tap-highlight-color:transparent;user-select:none;
}
.mq-btn:hover{transform:translateY(-1px);box-shadow:var(--sh-2);text-decoration:none}
.mq-btn:active{transform:translateY(0) scale(.985)}
.mq-btn:disabled{opacity:.5;cursor:not-allowed;transform:none;box-shadow:none}
.mq-btn--primary{background:var(--grad);color:#fff;box-shadow:0 6px 18px rgba(108,92,231,.32)}
.mq-btn--primary:hover{box-shadow:0 10px 26px rgba(108,92,231,.42)}
.mq-btn--ok{background:var(--ok);color:#fff}
.mq-btn--danger{background:var(--err);color:#fff}
.mq-btn--ghost{background:transparent;border-color:var(--line);color:var(--muted)}
.mq-btn--ghost:hover{border-color:var(--brand);color:var(--brand)}
.mq-btn--lg{padding:15px 30px;font-size:17px}
.mq-btn--sm{padding:7px 13px;font-size:13.5px}
.mq-btn--icon{padding:9px;border-radius:12px}
.mq-btn--block{width:100%}
/* ===== A5. КАРТОЧКИ ===== */
.mq-card{
  background:var(--surface);border:1px solid var(--line);border-radius:var(--r);
  padding:18px;box-shadow:var(--sh-1);transition:box-shadow .2s var(--ease),transform .2s var(--ease);
}
.mq-card--hover:hover{transform:translateY(-3px);box-shadow:var(--sh-2)}
.mq-card--pad-lg{padding:26px}
.mq-card__head{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.mq-card__title{font-size:17px;font-weight:700;margin:0}
.mq-card__sub{font-size:13.5px;color:var(--muted);margin:2px 0 0}
.mq-chip{
  display:inline-flex;align-items:center;gap:6px;padding:5px 11px;border-radius:var(--r-full);
  background:var(--surface-2);border:1px solid var(--line);font-size:13px;font-weight:600;color:var(--muted);
}
.mq-chip--brand{background:color-mix(in srgb,var(--brand) 12%,transparent);color:var(--brand);border-color:transparent}
.mq-chip--ok{background:color-mix(in srgb,var(--ok) 14%,transparent);color:var(--ok);border-color:transparent}
.mq-chip--warn{background:color-mix(in srgb,var(--warn) 24%,transparent);color:#9a6b00;border-color:transparent}
.mq-chip--err{background:color-mix(in srgb,var(--err) 14%,transparent);color:var(--err);border-color:transparent}
.mq-badge-dot{
  min-width:20px;height:20px;padding:0 6px;border-radius:var(--r-full);background:var(--err);
  color:#fff;font-size:12px;font-weight:700;display:inline-grid;place-items:center;
}
/* ===== A6. ФОРМЫ ===== */
.mq-field{display:flex;flex-direction:column;gap:6px}
.mq-label{font-size:13.5px;font-weight:600;color:var(--muted)}
.mq-input,.mq-textarea,.mq-select{
  width:100%;padding:12px 14px;border:1.5px solid var(--line);border-radius:var(--r-sm);
  background:var(--surface);transition:border-color .16s,box-shadow .16s;font-size:16px;
}
.mq-input:focus,.mq-textarea:focus,.mq-select:focus{
  outline:none;border-color:var(--brand);box-shadow:0 0 0 4px color-mix(in srgb,var(--brand) 15%,transparent);
}
.mq-textarea{min-height:96px;resize:vertical}
.mq-hint{font-size:12.5px;color:var(--muted)}
/* ===== A7. СКЕЛЕТОНЫ ===== */
.mq-skel{
  border-radius:var(--r-sm);
  background:linear-gradient(90deg,var(--line) 25%,var(--surface-2) 50%,var(--line) 75%);
  background-size:200% 100%;animation:mq-shine 1.3s infinite linear;
}
.mq-skel--line{height:14px;margin:8px 0}
.mq-skel--card{height:96px}
@keyframes mq-shine{0%{background-position:200% 0}100%{background-position:-200% 0}}
.mq-empty{padding:36px 20px;text-align:center;color:var(--muted)}
.mq-empty .mq-ic{opacity:.45;margin-bottom:10px}
/* ===== A8. ШАПКА ===== */
.mq-header{
  position:sticky;top:0;z-index:40;
  background:color-mix(in srgb,var(--surface) 88%,transparent);
  backdrop-filter:saturate(180%) blur(14px);
  -webkit-backdrop-filter:saturate(180%) blur(14px);
  border-bottom:1px solid var(--line);
}
.mq-header__in{display:flex;align-items:center;gap:12px;height:var(--nav-h);max-width:1120px;margin:0 auto;padding:0 16px}
.mq-logo{display:flex;align-items:center;gap:9px;font-weight:800;font-size:19px;letter-spacing:-.02em;color:var(--text)}
.mq-logo:hover{text-decoration:none}
.mq-logo__mark{
  width:34px;height:34px;border-radius:11px;background:var(--grad);color:#fff;
  display:grid;place-items:center;box-shadow:0 4px 12px rgba(108,92,231,.4);flex:0 0 auto;
}
.mq-logo__mark span{font-size:17px;font-weight:800;line-height:1}
.mq-logo b{color:var(--brand)}
.mq-header__pts{
  display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:var(--r-full);
  background:var(--grad-warm);color:#4a2e00;font-weight:700;font-size:14px;
}
.mq-avatar{
  width:36px;height:36px;border-radius:50%;object-fit:cover;flex:0 0 auto;
  background:var(--grad);color:#fff;display:grid;place-items:center;font-weight:700;font-size:14px;
  border:2px solid var(--surface);box-shadow:var(--sh-1);cursor:pointer;
}
/* ===== A9. НАВИГАЦИЯ ===== */
.mq-nav{
  position:fixed;left:0;right:0;bottom:0;z-index:45;
  display:grid;grid-auto-flow:column;grid-auto-columns:1fr;
  background:color-mix(in srgb,var(--surface) 94%,transparent);
  backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  border-top:1px solid var(--line);padding-bottom:var(--safe-b);
}
.mq-nav__item{
  position:relative;display:flex;flex-direction:column;align-items:center;gap:3px;
  padding:9px 4px 8px;border:0;background:none;color:var(--muted);
  font-size:11px;font-weight:600;cursor:pointer;transition:color .18s var(--ease);
}
.mq-nav__item.is-active{color:var(--brand)}
.mq-nav__item.is-active .mq-ic{transform:translateY(-2px) scale(1.08)}
.mq-nav__item .mq-ic{transition:transform .22s var(--ease)}
.mq-nav__item::after{
  content:'';position:absolute;top:0;left:50%;transform:translateX(-50%) scaleX(0);
  width:26px;height:3px;border-radius:0 0 4px 4px;background:var(--brand);
  transition:transform .22s var(--ease);
}
.mq-nav__item.is-active::after{transform:translateX(-50%) scaleX(1)}
.mq-nav__dot{position:absolute;top:5px;right:calc(50% - 20px)}
.mq-main{padding:20px 0 calc(var(--nav-h) + 26px + var(--safe-b))}
@media(min-width:860px){
  .mq-nav{
    position:sticky;top:var(--nav-h);bottom:auto;
    border-top:0;border-bottom:1px solid var(--line);
    max-width:1120px;margin:0 auto;grid-auto-flow:column;padding:0;
  }
  .mq-nav__item{flex-direction:row;gap:8px;font-size:14px;padding:13px 8px}
  .mq-main{padding-bottom:48px}
}
/* ===== A10. ТОСТЫ ===== */
.mq-toasts{
  position:fixed;z-index:90;left:50%;transform:translateX(-50%);
  bottom:calc(var(--nav-h) + 18px + var(--safe-b));
  display:flex;flex-direction:column-reverse;gap:9px;
  width:min(420px,calc(100vw - 28px));pointer-events:none;
}
@media(min-width:860px){.mq-toasts{bottom:22px;left:auto;right:22px;transform:none}}
.mq-toast{
  display:flex;align-items:center;gap:10px;padding:12px 16px;border-radius:14px;
  background:var(--surface);border:1px solid var(--line);box-shadow:var(--sh-3);
  font-size:14.5px;font-weight:600;
  opacity:0;transform:translateY(14px) scale(.96);
  transition:opacity .24s var(--ease),transform .24s var(--ease);
}
.mq-toast.is-in{opacity:1;transform:none}
.mq-toast--ok{border-left:4px solid var(--ok);color:var(--ok)}
.mq-toast--err{border-left:4px solid var(--err);color:var(--err)}
.mq-toast--warn{border-left:4px solid var(--warn);color:#9a6b00}
.mq-toast--info{border-left:4px solid var(--info);color:var(--info)}
.mq-toast span{color:var(--text);font-weight:500}
/* ===== A11. МОДАЛКИ ===== */
.mq-modal-back{
  position:fixed;inset:0;z-index:95;display:grid;place-items:center;padding:18px;
  background:rgba(18,20,31,.5);backdrop-filter:blur(5px);
  opacity:0;transition:opacity .22s var(--ease);overflow-y:auto;
}
.mq-modal-back.is-in{opacity:1}
.mq-modal{
  position:relative;width:min(440px,100%);background:var(--surface);
  border-radius:var(--r-lg);padding:26px 24px 22px;box-shadow:var(--sh-3);
  transform:translateY(18px) scale(.97);transition:transform .26s var(--ease);
  max-height:calc(100vh - 36px);overflow-y:auto;
}
.mq-modal-back.is-in .mq-modal{transform:none}
.mq-modal__x{
  position:absolute;top:12px;right:12px;width:34px;height:34px;border:0;border-radius:11px;
  background:var(--surface-2);color:var(--muted);cursor:pointer;display:grid;place-items:center;
}
.mq-modal__x:hover{background:var(--line);color:var(--text)}
.mq-modal__t{margin:0 30px .5em 0;font-size:20px}
.mq-modal__p{color:var(--muted);margin:0 0 16px;font-size:15px}
.mq-modal__in{
  width:100%;padding:12px 14px;border:1.5px solid var(--line);border-radius:var(--r-sm);
  background:var(--surface-2);margin-bottom:16px;font-size:16px;
}
.mq-modal__in:focus{outline:none;border-color:var(--brand)}
.mq-modal__row{display:flex;gap:10px;justify-content:flex-end;margin-top:16px}
.mq-modal__row .mq-btn{flex:1}
@media(min-width:520px){.mq-modal__row .mq-btn{flex:0 0 auto;min-width:118px}}
/* ===== A12. КОНФЕТТИ И БАЛЛЫ ===== */
.mq-confetti{position:fixed;inset:0;z-index:98;pointer-events:none;overflow:hidden}
.mq-confetti i{
  position:absolute;top:-14px;left:var(--x);width:9px;height:9px;border-radius:2px;
  animation:mq-fall calc(1.1s + var(--d)) var(--ease) forwards;
}
@keyframes mq-fall{
  0%{opacity:1;transform:translateY(0) rotate(0)}
  100%{opacity:0;transform:translateY(105vh) rotate(var(--r))}
}
.mq-points-pop{
  position:absolute;z-index:97;pointer-events:none;
  display:inline-flex;align-items:center;gap:5px;padding:6px 13px;border-radius:var(--r-full);
  background:var(--grad-warm);color:#4a2e00;font-weight:800;font-size:15px;
  box-shadow:var(--sh-2);animation:mq-rise 1.4s var(--ease) forwards;
}
@keyframes mq-rise{
  0%{opacity:0;transform:translate(-50%,0) scale(.7)}
  22%{opacity:1;transform:translate(-50%,-14px) scale(1.1)}
  70%{opacity:1;transform:translate(-50%,-42px) scale(1)}
  100%{opacity:0;transform:translate(-50%,-64px) scale(.92)}
}
/* ===== A13. ОБЩИЕ АНИМАЦИИ ===== */
@keyframes mq-in{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes mq-pop{0%{transform:scale(.9)}55%{transform:scale(1.04)}100%{transform:scale(1)}}
@keyframes mq-spin{to{transform:rotate(360deg)}}
.mq-anim-in{animation:mq-in .34s var(--ease) both}
.mq-pop{animation:mq-pop .3s var(--ease)}
.mq-spin{animation:mq-spin .9s linear infinite}
@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
}
/* ===== A14. ЦЕЛЬ НА ДЕНЬ ===== */
.mq-goal{display:flex;align-items:center;gap:16px}
.mq-goal__ring{
  --p:0;width:76px;height:76px;border-radius:50%;flex:0 0 auto;display:grid;place-items:center;
  background:conic-gradient(var(--brand) calc(var(--p)*1%),var(--line) 0);
  transition:background .6s var(--ease);
}
.mq-goal__ring::before{
  content:'';position:absolute;width:60px;height:60px;border-radius:50%;background:var(--surface);
}
.mq-goal__ring>b{position:relative;font-size:17px;font-weight:800}
.mq-goal__ring.is-done{background:conic-gradient(var(--ok) 100%,var(--ok) 0)}
/* ===== A15. ЧАТ ===== */
.mq-chat{display:grid;gap:0;height:calc(100vh - var(--nav-h) - 90px);min-height:420px}
@media(min-width:860px){
  .mq-chat{grid-template-columns:290px 1fr;border:1px solid var(--line);border-radius:var(--r-lg);overflow:hidden;background:var(--surface)}
}
.mq-chat__list{border-right:1px solid var(--line);overflow-y:auto;background:var(--surface)}
.mq-chat__peer{
  display:flex;align-items:center;gap:11px;padding:12px 14px;border:0;width:100%;
  background:none;cursor:pointer;text-align:left;border-bottom:1px solid var(--line);
  transition:background .16s;
}
.mq-chat__peer:hover{background:var(--surface-2)}
.mq-chat__peer.is-active{background:color-mix(in srgb,var(--brand) 9%,transparent)}
.mq-chat__peer-body{flex:1;min-width:0}
.mq-chat__peer-name{display:block;font-weight:700;font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mq-chat__peer-last{display:block;font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mq-chat__pane{display:flex;flex-direction:column;min-width:0;background:var(--surface-2)}
.mq-chat__head{
  display:flex;align-items:center;gap:11px;padding:11px 14px;
  border-bottom:1px solid var(--line);background:var(--surface);flex:0 0 auto;
}
.mq-chat__body{flex:1;overflow-y:auto;padding:16px 14px;display:flex;flex-direction:column;gap:9px}
.mq-msg{max-width:76%;padding:10px 14px;border-radius:18px;font-size:15px;line-height:1.45;animation:mq-in .24s var(--ease) both;word-wrap:break-word}
.mq-msg--in{align-self:flex-start;background:var(--surface);border:1px solid var(--line);border-bottom-left-radius:6px}
.mq-msg--out{align-self:flex-end;background:var(--grad);color:#fff;border-bottom-right-radius:6px}
.mq-msg__meta{display:flex;align-items:center;gap:5px;justify-content:flex-end;margin-top:4px;font-size:11.5px;opacity:.75}
.mq-msg--out .mq-msg__meta .mq-ic{color:#fff}
.mq-msg__read .mq-ic{color:#7ee7c7!important}
.mq-msg__files{display:flex;flex-direction:column;gap:5px;margin-top:7px}
.mq-msg__file{
  display:flex;align-items:center;gap:7px;padding:7px 10px;border-radius:10px;border:0;
  background:rgba(255,255,255,.18);font-size:13px;font-weight:600;color:inherit;cursor:pointer;text-align:left;
}
.mq-msg--in .mq-msg__file{background:var(--surface-2);color:var(--brand)}
.mq-chat__day{align-self:center;font-size:12px;color:var(--muted);padding:3px 12px;border-radius:var(--r-full);background:var(--surface)}
.mq-chat__foot{
  display:flex;align-items:flex-end;gap:8px;padding:10px 12px calc(10px + var(--safe-b));
  border-top:1px solid var(--line);background:var(--surface);flex:0 0 auto;
}
.mq-chat__input{
  flex:1;min-height:44px;max-height:130px;padding:11px 15px;border:1.5px solid var(--line);
  border-radius:22px;background:var(--surface-2);resize:none;font-size:16px;
}
.mq-chat__input:focus{outline:none;border-color:var(--brand)}
.mq-chat__send{width:44px;height:44px;border-radius:50%;border:0;background:var(--grad);color:#fff;display:grid;place-items:center;cursor:pointer;flex:0 0 auto}
.mq-chat__send:disabled{opacity:.45;cursor:not-allowed}
/* ===== A16. ДОМАШНИЕ ЗАДАНИЯ ===== */
.mq-hw{border-left:4px solid var(--line)}
.mq-hw--open{border-left-color:var(--warn)}
.mq-hw--submitted{border-left-color:var(--info)}
.mq-hw--graded{border-left-color:var(--ok)}
.mq-hw__due{display:inline-flex;align-items:center;gap:5px;font-size:13px;color:var(--muted)}
.mq-hw__due.is-late{color:var(--err);font-weight:700}
.mq-drop{
  border:2px dashed var(--line);border-radius:var(--r);padding:22px 16px;text-align:center;
  color:var(--muted);cursor:pointer;transition:border-color .18s,background .18s;
}
.mq-drop:hover,.mq-drop.is-over{border-color:var(--brand);background:color-mix(in srgb,var(--brand) 6%,transparent);color:var(--brand)}
.mq-drop input{display:none}
.mq-files{display:flex;flex-direction:column;gap:7px;margin-top:11px}
.mq-file{
  display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:var(--r-sm);
  background:var(--surface-2);border:1px solid var(--line);font-size:14px;
  animation:mq-in .22s var(--ease) both;
}
.mq-file__name{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600}
.mq-file__size{font-size:12px;color:var(--muted);flex:0 0 auto}
.mq-file__x{border:0;background:none;color:var(--muted);cursor:pointer;padding:4px;border-radius:8px;display:grid;place-items:center}
.mq-file__x:hover{background:color-mix(in srgb,var(--err) 14%,transparent);color:var(--err)}
/* ===== A17. ИГРЫ ===== */
.mq-game{
  position:relative;overflow:hidden;padding:18px;border-radius:var(--r);cursor:pointer;
  background:var(--surface);border:1px solid var(--line);box-shadow:var(--sh-1);
  transition:transform .2s var(--ease),box-shadow .2s var(--ease);
}
.mq-game:hover{transform:translateY(-4px);box-shadow:var(--sh-2)}
.mq-game::before{content:'';position:absolute;inset:0 0 auto;height:4px;background:var(--grad)}
.mq-game--geometry::before{background:linear-gradient(90deg,#0984e3,#74b9ff)}
.mq-game--algebra::before{background:linear-gradient(90deg,#00b894,#55efc4)}
.mq-game--logic::before{background:linear-gradient(90deg,#e84393,#fd79a8)}
.mq-game--vpr::before{background:var(--grad-warm)}
.mq-game__title{font-weight:700;font-size:15.5px;margin:10px 0 3px}
.mq-game__meta{display:flex;align-items:center;gap:9px;font-size:12.5px;color:var(--muted);margin-top:9px}
.mq-game__free{color:var(--ok);font-weight:700}
.mq-drill{max-width:620px;margin:0 auto}
.mq-drill__q{font-size:clamp(24px,6vw,38px);font-weight:800;text-align:center;padding:26px 12px;letter-spacing:-.02em}
.mq-drill__opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:11px}
.mq-drill__opt{
  padding:17px 12px;border-radius:var(--r);border:2px solid var(--line);background:var(--surface);
  font-size:19px;font-weight:700;cursor:pointer;transition:all .16s var(--ease);
}
.mq-drill__opt:hover{border-color:var(--brand);transform:translateY(-2px)}
.mq-drill__opt.is-right{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 13%,transparent);color:var(--ok)}
.mq-drill__opt.is-wrong{border-color:var(--err);background:color-mix(in srgb,var(--err) 13%,transparent);color:var(--err)}
.mq-progress{height:8px;border-radius:4px;background:var(--line);overflow:hidden}
.mq-progress>i{display:block;height:100%;background:var(--grad);width:0;transition:width .35s var(--ease)}
/* ===== A18. ЛЕНДИНГ ===== */
.mq-hero{position:relative;overflow:hidden;padding:64px 0 56px;text-align:center}
.mq-hero::before{
  content:'';position:absolute;inset:-40% -20% auto;height:560px;border-radius:50%;
  background:radial-gradient(circle,color-mix(in srgb,var(--brand) 20%,transparent),transparent 68%);
  filter:blur(12px);z-index:-1;
}
.mq-hero h1{max-width:760px;margin:0 auto .5em}
.mq-hero__lead{font-size:clamp(16px,2.2vw,19px);color:var(--muted);max-width:600px;margin:0 auto 28px}
.mq-hero__cta{display:flex;flex-wrap:wrap;gap:12px;justify-content:center}
.mq-hero__stats{display:flex;flex-wrap:wrap;gap:26px;justify-content:center;margin-top:42px}
.mq-hero__stat b{display:block;font-size:28px;font-weight:800;color:var(--brand)}
.mq-hero__stat span{font-size:13.5px;color:var(--muted)}
.mq-section{padding:54px 0}
.mq-section__head{text-align:center;max-width:620px;margin:0 auto 34px}
.mq-section__head p{color:var(--muted)}
.mq-review{display:flex;flex-direction:column;gap:12px;height:100%}
.mq-review__stars{color:var(--warn);display:flex;gap:2px}
.mq-review__text{flex:1;font-size:15px;line-height:1.6}
.mq-review__who{display:flex;align-items:center;gap:10px;font-size:13.5px}
.mq-review__who b{display:block;font-size:14.5px}
.mq-faq{border:1px solid var(--line);border-radius:var(--r);background:var(--surface);overflow:hidden}
.mq-faq+.mq-faq{margin-top:10px}
.mq-faq summary{
  padding:16px 18px;cursor:pointer;font-weight:700;font-size:15.5px;
  display:flex;align-items:center;justify-content:space-between;gap:12px;list-style:none;
}
.mq-faq summary::-webkit-details-marker{display:none}
.mq-faq summary::after{content:'+';font-size:22px;color:var(--brand);font-weight:400;transition:transform .22s var(--ease)}
.mq-faq[open] summary::after{transform:rotate(45deg)}
.mq-faq__body{padding:0 18px 18px;color:var(--muted);font-size:14.5px;animation:mq-in .26s var(--ease) both}
.mq-cta-band{
  border-radius:var(--r-lg);padding:42px 26px;text-align:center;color:#fff;background:var(--grad);
  box-shadow:var(--sh-3);
}
.mq-cta-band h2{color:#fff}
.mq-cta-band p{color:rgba(255,255,255,.88);max-width:480px;margin:0 auto 22px}
.mq-cta-band .mq-btn{background:#fff;color:var(--brand-dark)}
.mq-contacts{display:flex;flex-wrap:wrap;gap:12px;justify-content:center}
.mq-contact{
  display:inline-flex;align-items:center;gap:9px;padding:13px 20px;border-radius:var(--r-full);
  background:var(--surface);border:1px solid var(--line);font-weight:600;box-shadow:var(--sh-1);
  transition:transform .18s var(--ease),box-shadow .18s var(--ease);
}
.mq-contact:hover{transform:translateY(-2px);box-shadow:var(--sh-2);text-decoration:none}
.mq-contact--wa{color:#25d366}
.mq-contact--tg{color:#229ed9}
.mq-contact--max{color:#7c4dff}
.mq-contact--tel{color:var(--brand)}
.mq-footer{padding:34px 0;border-top:1px solid var(--line);color:var(--muted);font-size:13.5px;text-align:center}

<script>
/* =====================================================================
   B0 — КОНФИГ И ЗАГРУЗЧИК
   ===================================================================== */
window.MQ = window.MQ || {};
MQ.CFG = {
  SUPABASE_URL: 'https://wwyxvfpqhptsryaaaefo.supabase.co',
  SUPABASE_KEY: 'sb_publishable_2yTQm5JjVI4S0cM59eZg6w_o6mKOont',
  BRAND: 'iMath',
  BUCKETS: { hw:'homework', chat:'chat', avatars:'avatars' }
};

MQ.sb = null;
MQ.user = null;
MQ.profile = null;
MQ.route = 'home';
MQ.params = {};

MQ.initSupabase = function(){
  if (MQ.sb) return MQ.sb;
  const ok = MQ.CFG.SUPABASE_URL.startsWith('https://') && MQ.CFG.SUPABASE_KEY.length > 20;
  if (!ok){ MQ.sbError = 'Не заданы SUPABASE_URL / SUPABASE_KEY'; return null; }
  MQ.sb = window.supabase.createClient(MQ.CFG.SUPABASE_URL, MQ.CFG.SUPABASE_KEY, {
    auth: { persistSession:true, autoRefreshToken:true, detectSessionInUrl:true }
  });
  return MQ.sb;
};

MQ.$  = (s, r) => (r || document).querySelector(s);
MQ.$$ = (s, r) => Array.from((r || document).querySelectorAll(s));
MQ.el = function(tag, cls, html){
  const e = document.createElement(tag);
  if (cls)  e.className = cls;
  if (html != null) e.innerHTML = html;
  return e;
};
MQ.esc = s => String(s == null ? '' : s)
  .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
  .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
MQ.human = b => {
  if (b == null) return '';
  const u = ['Б','КБ','МБ','ГБ']; let i = 0, n = Number(b);
  while (n >= 1024 && i < u.length - 1){ n /= 1024; i++; }
  return (i ? n.toFixed(1) : n) + ' ' + u[i];
};
MQ.debounce = (fn, ms) => { let t; return function(){ const a = arguments; clearTimeout(t); t = setTimeout(() => fn.apply(null,a), ms || 300); }; };

MQ.math = function(root){
  if (!window.renderMathInElement) return;
  try{
    window.renderMathInElement(root || document.getElementById('mqView'), {
      delimiters:[
        {left:'\\(', right:'\\)', display:false},
        {left:'\\[', right:'\\]', display:true},
        {left:'$$', right:'$$',  display:true}
      ],
      throwOnError:false
    });
  }catch(e){}
};

MQ.empty = function(text, iconName){
  const t = document.getElementById('tplEmpty').content.cloneNode(true);
  t.querySelector('[data-text]').textContent = text || 'Пока пусто';
  t.querySelector('[data-icon]').innerHTML = MQ.icon(iconName || 'sparkle', {size:40, w:1.4});
  const box = MQ.el('div');
  box.appendChild(t);
  return box;
};

MQ.skeleton = function(n){
  const box = MQ.el('div','mq-stack');
  for (let i = 0; i < (n || 3); i++){
    box.appendChild(MQ.el('div','mq-card',
      '<div class="mq-skel mq-skel--line" style="width:38%"></div>' +
      '<div class="mq-skel mq-skel--line" style="width:80%"></div>' +
      '<div class="mq-skel mq-skel--line" style="width:56%"></div>'));
  }
  return box;
};

MQ.rpc = async function(name, args){
  if (!MQ.sb) return { data:null, error:{ message:'Supabase не инициализирован' } };
  const res = await MQ.sb.rpc(name, args || {});
  if (res.error) console.warn('[rpc:' + name + ']', res.error.message);
  return res;
};

MQ.boot = [];
MQ.onReady = fn => MQ.boot.push(fn);
MQ.start = async function(){
  MQ.initSupabase();
  for (const fn of MQ.boot){
    try{ await fn(); }catch(e){ console.error('[boot]', e); }
  }
};
document.addEventListener('DOMContentLoaded', () => {
  if (MQ.sbError) console.warn('[iMath]', MQ.sbError);
  MQ.start();
});
</script>

function iconBadge(name, kind, size){
  return '<span class="mq-ic-badge' + (kind ? ' mq-ic-badge--' + kind : '') + '">' +
         icon(name, {size: size || 22}) + '</span>';
}

let toastBox = null;
function toast(text, type, ms){
  if (!toastBox || !document.body.contains(toastBox)){
    toastBox = MQ.el('div','mq-toasts');
    document.body.appendChild(toastBox);
  }
  const kind = type || 'info';
  const ic = kind === 'ok' ? 'check' : kind === 'err' ? 'close' : kind === 'warn' ? 'bell' : 'sparkle';
  const t = MQ.el('div','mq-toast mq-toast--' + kind,
    icon(ic,{size:18}) + '<span>' + MQ.esc(text) + '</span>');
  toastBox.appendChild(t);
  requestAnimationFrame(() => t.classList.add('is-in'));
  setTimeout(() => { t.classList.remove('is-in'); setTimeout(() => t.remove(), 280); }, ms || 3200);
  return t;
}

function modal(cfg){
  const c = cfg || {};
  return new Promise(resolve => {
    const isPrompt  = c.type === 'prompt';
    const isConfirm = c.type === 'confirm' || isPrompt;
    const back = MQ.el('div','mq-modal-back');
    back.innerHTML =
      '<div class="mq-modal" role="dialog" aria-modal="true">' +
        '<button class="mq-modal__x" type="button" aria-label="Закрыть">' + icon('close',{size:18}) + '</button>' +
        (c.title ? '<h3 class="mq-modal__t">' + MQ.esc(c.title) + '</h3>' : '') +
        (c.text ? '<p class="mq-modal__p">' + MQ.esc(c.text) + '</p>' : '') +
        (isPrompt ? '<input class="mq-modal__in" type="' + (c.inputType || 'text') +
                    '" value="' + MQ.esc(c.value || '') +
                    '" placeholder="' + MQ.esc(c.placeholder || '') + '">' : '') +
        '<div class="mq-modal__row">' +
          (isConfirm ? '<button class="mq-btn mq-btn--ghost" type="button" data-no>' +
                        MQ.esc(c.cancelText || 'Отмена') + '</button>' : '') +
          '<button class="mq-btn mq-btn--primary" type="button" data-yes>' +
            MQ.esc(c.okText || 'Ок') + '</button>' +
        '</div>' +
      '</div>';
    document.body.appendChild(back);
    requestAnimationFrame(() => back.classList.add('is-in'));

    const input = back.querySelector('.mq-modal__in');
    if (input) setTimeout(() => input.focus(), 70);

    function done(v){
      back.classList.remove('is-in');
      document.removeEventListener('keydown', onKey);
      setTimeout(() => back.remove(), 240);
      resolve(v);
    }
    const no = isPrompt ? null : false;
    function onKey(e){
      if (e.key === 'Escape') done(no);
      if (e.key === 'Enter' && input){ e.preventDefault(); done(input.value.trim()); }
    }
    back.querySelector('[data-yes]').onclick = () => done(isPrompt ? input.value.trim() : true);
    const cancel = back.querySelector('[data-no]');
    if (cancel) cancel.onclick = () => done(no);
    back.querySelector('.mq-modal__x').onclick = () => done(no);
    back.onclick = e => { if (e.target === back) done(no); };
    document.addEventListener('keydown', onKey);
  });
}

function confetti(n){
  const colors = ['#6c5ce7','#00b894','#fdcb6e','#e17055','#0984e3','#e84393'];
  const box = MQ.el('div','mq-confetti');
  let html = '';
  for (let i = 0; i < (n || 44); i++){
    html += '<i style="--x:' + (Math.random()*100).toFixed(1) + '%;--d:' +
            (0.5 + Math.random()*0.8).toFixed(2) + 's;--r:' + Math.round(Math.random()*720) +
            'deg;background:' + colors[i % colors.length] + '"></i>';
  }
  box.innerHTML = html;
  document.body.appendChild(box);
  setTimeout(() => box.remove(), 2300);
}
function pointsPop(amount, anchor){
  const el = MQ.el('div','mq-points-pop', icon('coin',{size:16}) + '<b>+' + amount + '</b>');
  const r = anchor && anchor.getBoundingClientRect
    ? anchor.getBoundingClientRect()
    : { left: innerWidth/2, top: innerHeight/2, width:0 };
  el.style.left = (r.left + r.width/2) + 'px';
  el.style.top  = (r.top + window.scrollY) + 'px';
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 1450);
}

const fmtDate = d => { try{ return new Date(d).toLocaleDateString('ru-RU',{day:'numeric',month:'long'}); }catch(e){ return ''; } };
const fmtTime = d => { try{ return new Date(d).toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'}); }catch(e){ return ''; } };
const dayKey  = d => { const x = new Date(d); return x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0')+'-'+String(x.getDate()).padStart(2,'0'); };
function dayLabel(d){
  const k = dayKey(d), today = dayKey(new Date());
  const y = new Date(); y.setDate(y.getDate()-1);
  if (k === today) return 'Сегодня';
  if (k === dayKey(y)) return 'Вчера';
  return fmtDate(d);
}

<script>
/* =====================================================================
   B2 — СЕССИЯ, ПРОФИЛЬ, ШАПКА, НАВИГАЦИЯ, РОУТЕР
   ===================================================================== */
(function(){
'use strict';
const MQ = window.MQ;

MQ.views = MQ.views || {};
MQ.badges = { chat:0, hw:0 };

const NAV = {
  guest:  [{k:'home',t:'Главная',i:'home'},{k:'auth',t:'Войти',i:'user'}],
  student:[{k:'hw',t:'Домашка',i:'note'},{k:'games',t:'Тренажёры',i:'game'},
           {k:'chat',t:'Чат',i:'chat'},{k:'stats',t:'Прогресс',i:'chart'},
           {k:'settings',t:'Профиль',i:'user'}],
  teacher:[{k:'students',t:'Ученики',i:'users'},{k:'hw',t:'Домашка',i:'note'},
           {k:'games',t:'Тренажёры',i:'game'},{k:'chat',t:'Чат',i:'chat'},
           {k:'settings',t:'Профиль',i:'settings'}],
  parent: [{k:'kids',t:'Дети',i:'family'},{k:'stats',t:'Прогресс',i:'chart'},
           {k:'chat',t:'Чат',i:'chat'},{k:'settings',t:'Профиль',i:'user'}]
};
NAV.admin = NAV.teacher;
const ROLE_RU = { student:'Ученик', teacher:'Преподаватель', parent:'Родитель', admin:'Админ' };

MQ.loadSession = async function(){
  if (!MQ.sb){ MQ.user = null; MQ.profile = null; return null; }
  const { data } = await MQ.sb.auth.getSession();
  MQ.user = data && data.session ? data.session.user : null;
  MQ.profile = MQ.user ? await MQ.loadProfile() : null;
  return MQ.user;
};
MQ.loadProfile = async function(){
  if (!MQ.sb || !MQ.user) return null;
  const { data, error } = await MQ.sb.from('profiles').select('*').eq('id', MQ.user.id).maybeSingle();
  if (error){ console.warn('[profile]', error.message); return null; }
  return data;
};
MQ.role = () => (MQ.profile && MQ.profile.role) || 'guest';
MQ.isAuthed = () => !!MQ.user;

MQ.signIn = async function(email, password){
  const { error } = await MQ.sb.auth.signInWithPassword({ email, password });
  if (error) throw error;
  await MQ.loadSession();
  MQ.dressHeader(); MQ.dressNav();
  MQ.go(MQ.role() === 'teacher' ? 'students' : MQ.role() === 'parent' ? 'kids' : 'hw');
  MQ.toast('С возвращением!', 'ok');
};
MQ.signUp = async function(email, password, fullName, role){
  const { error } = await MQ.sb.auth.signUp({
    email, password,
    options:{ data:{ full_name: fullName, role: role || 'student' } }
  });
  if (error) throw error;
  await MQ.loadSession();
  if (MQ.isAuthed()){
    MQ.dressHeader(); MQ.dressNav(); MQ.go('hw');
    MQ.confetti(30);
    MQ.toast('Аккаунт создан', 'ok');
  } else {
    MQ.alertBox('Мы отправили письмо для подтверждения. Проверьте почту и войдите.', 'Почти готово');
  }
};
MQ.signOut = async function(){
  const ok = await MQ.confirmBox('Выйти из аккаунта?');
  if (!ok) return;
  await MQ.sb.auth.signOut();
  MQ.user = null; MQ.profile = null;
  MQ.dressHeader(); MQ.dressNav(); MQ.go('home');
  MQ.toast('Вы вышли', 'info');
};

MQ.dressHeader = function(){
  const box = MQ.$('#mqHeaderRight');
  if (!box) return;
  box.innerHTML = '';
  if (!MQ.isAuthed()){
    const b = MQ.el('button','mq-btn mq-btn--primary mq-btn--sm', MQ.icon('user',{size:16}) + 'Войти');
    b.onclick = () => MQ.go('auth');
    box.appendChild(b);
    return;
  }
  const p = MQ.profile || {};
  box.appendChild(MQ.el('span','mq-header__pts',
    MQ.icon('coin',{size:15}) + '<b id="mqPts">' + (p.points || 0) + '</b>'));
  if (p.streak > 0){
    box.appendChild(MQ.el('span','mq-chip mq-chip--warn', MQ.icon('fire',{size:14}) + p.streak));
  }
  const av = MQ.el('div','mq-avatar', (p.full_name || 'i').trim().charAt(0).toUpperCase());
  av.title = (p.full_name || '') + ' · ' + (ROLE_RU[p.role] || '');
  av.onclick = () => MQ.go('settings');
  box.appendChild(av);
};
MQ.bumpPoints = function(delta, anchor){
  if (MQ.profile) MQ.profile.points = (MQ.profile.points || 0) + delta;
  const n = MQ.$('#mqPts');
  if (n){
    n.textContent = (MQ.profile && MQ.profile.points) || 0;
    n.parentElement.classList.remove('mq-pop'); void n.offsetWidth;
    n.parentElement.classList.add('mq-pop');
  }
  MQ.pointsPop(delta, anchor || MQ.$('#mqPts'));
};

MQ.dressNav = function(){
  const nav = MQ.$('#mqNav');
  if (!nav) return;
  if (!MQ.isAuthed()){ nav.classList.add('mq-hide'); nav.innerHTML = ''; return; }
  const items = NAV[MQ.role()] || NAV.guest;
  nav.classList.remove('mq-hide');
  nav.innerHTML = '';
  items.forEach(it => {
    const b = MQ.el('button','mq-nav__item' + (MQ.route === it.k ? ' is-active' : ''));
    b.type = 'button';
    b.dataset.k = it.k;
    const n = MQ.badges[it.k] || 0;
    b.innerHTML = MQ.icon(it.i,{size:22}) + '<span>' + it.t + '</span>' +
      (n ? '<span class="mq-badge-dot mq-nav__dot">' + (n > 99 ? '99+' : n) + '</span>' : '');
    b.onclick = () => MQ.go(it.k);
    nav.appendChild(b);
  });
};
MQ.setBadge = function(key, n){ MQ.badges[key] = n || 0; MQ.dressNav(); };

const PUBLIC = { home:1, auth:1 };
MQ.go = function(route, params){
  const r = route || 'home';
  MQ.route = (!PUBLIC[r] && !MQ.isAuthed()) ? 'auth' : r;
  MQ.params = params || {};
  if (location.hash.slice(1) !== MQ.route) history.replaceState(null,'','#' + MQ.route);
  MQ.render();
  MQ.dressNav();
  window.scrollTo({ top:0, behavior:'smooth' });
};
MQ.render = async function(){
  const view = MQ.$('#mqView');
  if (!view) return;
  const fn = MQ.views[MQ.route];
  if (!fn){
    view.innerHTML = '';
    view.appendChild(MQ.empty('Раздел ещё не готов', 'lightbulb'));
    return;
  }
  view.innerHTML = '';
  view.appendChild(MQ.skeleton(2));
  try{
    const node = await fn(MQ.params);
    view.innerHTML = '';
    if (node) view.appendChild(node);
    MQ.math(view);
  }catch(e){
    console.error('[view:' + MQ.route + ']', e);
    view.innerHTML = '';
    view.appendChild(MQ.empty('Не удалось загрузить раздел', 'close'));
    MQ.toast(e.message || 'Ошибка загрузки', 'err');
  }
};

MQ.views.auth = function(){
  const box = MQ.el('div','mq-card mq-card--pad-lg mq-anim-in');
  box.style.maxWidth = '440px';
  box.style.margin = '18px auto';
  let mode = 'in';

  function paint(){
    box.innerHTML =
      '<div class="mq-center" style="margin-bottom:20px">' +
        MQ.iconBadge(mode === 'in' ? 'user' : 'sparkle', null, 24) +
        '<h2 style="margin-top:12px">' + (mode === 'in' ? 'Вход в iMath' : 'Регистрация') + '</h2>' +
        '<p class="mq-muted" style="font-size:14.5px">' +
          (mode === 'in' ? 'Продолжим занятия' : 'Первый шаг к пятёрке по математике') + '</p>' +
      '</div>' +
      '<div class="mq-stack">' +
        (mode === 'up' ?
          '<label class="mq-field"><span class="mq-label">Имя и фамилия</span>' +
          '<input class="mq-input" id="aName" autocomplete="name" placeholder="Иван Петров"></label>' +
          '<label class="mq-field"><span class="mq-label">Кто вы</span>' +
          '<select class="mq-select" id="aRole">' +
            '<option value="student">Ученик</option>' +
            '<option value="parent">Родитель</option>' +
            '<option value="teacher">Преподаватель</option>' +
          '</select></label>' : '') +
        '<label class="mq-field"><span class="mq-label">E-mail</span>' +
        '<input class="mq-input" id="aMail" type="email" autocomplete="email" placeholder="mail@example.com"></label>' +
        '<label class="mq-field"><span class="mq-label">Пароль</span>' +
        '<input class="mq-input" id="aPass" type="password" autocomplete="' +
          (mode === 'in' ? 'current-password' : 'new-password') + '" placeholder="Минимум 6 символов"></label>' +
        '<button class="mq-btn mq-btn--primary mq-btn--block mq-btn--lg" id="aGo">' +
          (mode === 'in' ? 'Войти' : 'Создать аккаунт') + '</button>' +
        '<button class="mq-btn mq-btn--ghost mq-btn--block" id="aSwap">' +
          (mode === 'in' ? 'Нет аккаунта? Зарегистрироваться' : 'Уже есть аккаунт? Войти') + '</button>' +
      '</div>';

    MQ.$('#aSwap', box).onclick = () => { mode = mode === 'in' ? 'up' : 'in'; paint(); };
    const go = MQ.$('#aGo', box);
    go.onclick = async () => {
      const mail = MQ.$('#aMail', box).value.trim();
      const pass = MQ.$('#aPass', box).value;
      if (!mail || pass.length < 6){ MQ.toast('Проверьте e-mail и пароль (6+ символов)','warn'); return; }
      if (!MQ.sb){ MQ.alertBox('Supabase не настроен','Настройка'); return; }
      go.disabled = true;
      go.innerHTML = MQ.icon('refresh',{size:18,cls:'mq-spin'}) + 'Секунду...';
      try{
        if (mode === 'in') await MQ.signIn(mail, pass);
        else await MQ.signUp(mail, pass, (MQ.$('#aName', box).value || '').trim(), MQ.$('#aRole', box).value);
      }catch(e){
        MQ.toast(e.message || 'Не удалось войти', 'err', 4200);
        go.disabled = false;
        go.innerHTML = mode === 'in' ? 'Войти' : 'Создать аккаунт';
      }
    };
  }
  paint();
  return box;
};

MQ.views.settings = async function(){
  const p = MQ.profile || {};
  const wrap = MQ.el('div','mq-stack mq-anim-in');
  const card = MQ.el('div','mq-card mq-card--pad-lg');
  card.innerHTML =
    '<div class="mq-card__head">' + MQ.iconBadge('user') +
      '<div><h3 class="mq-card__title">Профиль</h3>' +
      '<p class="mq-card__sub">' + MQ.esc(ROLE_RU[p.role] || '') + ' · ' +
      MQ.esc((MQ.user && MQ.user.email) || '') + '</p></div>' +
    '</div>' +
    '<div class="mq-stack">' +
      '<label class="mq-field"><span class="mq-label">Имя</span>' +
      '<input class="mq-input" id="sName" value="' + MQ.esc(p.full_name || '') + '"></label>' +
      '<label class="mq-field"><span class="mq-label">Цель на день (задач)</span>' +
      '<input class="mq-input" id="sGoal" type="number" min="1" max="200" value="' + (p.daily_goal || 10) + '"></label>' +
      '<button class="mq-btn mq-btn--primary" id="sSave">' + MQ.icon('check',{size:17}) + 'Сохранить</button>' +
    '</div>';
  MQ.$('#sSave', card).onclick = async () => {
    const full_name = MQ.$('#sName', card).value.trim();
    const daily_goal = Math.max(1, Math.min(200, parseInt(MQ.$('#sGoal', card).value, 10) || 10));
    const { error } = await MQ.sb.from('profiles').update({ full_name, daily_goal }).eq('id', MQ.user.id);
    if (error){ MQ.toast(error.message, 'err'); return; }
    MQ.profile.full_name = full_name;
    MQ.profile.daily_goal = daily_goal;
    MQ.dressHeader();
    MQ.toast('Сохранено', 'ok');
  };
  wrap.appendChild(card);

  const out = MQ.el('div','mq-card');
  const btn = MQ.el('button','mq-btn mq-btn--ghost mq-btn--block', MQ.icon('logout',{size:17}) + 'Выйти из аккаунта');
  btn.onclick = MQ.signOut;
  out.appendChild(btn);
  wrap.appendChild(out);
  return wrap;
};

MQ.onReady(async function(){
  await MQ.loadSession();
  if (MQ.sb){
    MQ.sb.auth.onAuthStateChange(evt => {
      if (evt === 'SIGNED_OUT'){ MQ.user = null; MQ.profile = null; MQ.dressHeader(); MQ.dressNav(); }
    });
  }
  MQ.dressHeader();
  const hash = location.hash.slice(1);
  const first = hash || (MQ.isAuthed()
    ? (MQ.role() === 'teacher' ? 'students' : MQ.role() === 'parent' ? 'kids' : 'hw')
    : 'home');
  MQ.go(first);
  document.addEventListener('click', e => {
    const a = e.target.closest('[data-go]');
    if (a){ e.preventDefault(); MQ.go(a.dataset.go); }
  });
  window.addEventListener('hashchange', () => {
    const r = location.hash.slice(1);
    if (r && r !== MQ.route) MQ.go(r);
  });
});
})();
</script>

<script>
/* =====================================================================
   B3 — ЧАТ: обычный текст, вложения, «прочитано», realtime
   ===================================================================== */
(function(){
'use strict';
const MQ = window.MQ;
let state = { peer:null, partners:[], msgs:[], chan:null, files:[] };

async function loadPartners(){
  const { data, error } = await MQ.rpc('chat_partners');
  if (error) return [];
  return data || [];
}
async function findPeople(q){
  let sel = MQ.sb.from('profiles').select('id,full_name,role,avatar_url').neq('id', MQ.user.id).limit(20);
  if (q) sel = sel.ilike('full_name', '%' + q + '%');
  const { data } = await sel;
  return data || [];
}
async function loadMsgs(peerId){
  const { data, error } = await MQ.sb.from('messages')
    .select('*')
    .or('and(sender_id.eq.' + MQ.user.id + ',recipient_id.eq.' + peerId + '),' +
        'and(sender_id.eq.' + peerId + ',recipient_id.eq.' + MQ.user.id + ')')
    .order('created_at', { ascending:true })
    .limit(300);
  if (error){ MQ.toast('Не удалось загрузить переписку','err'); return []; }
  return data || [];
}
async function uploadChatFiles(files){
  const out = [];
  for (const f of files){
    const path = MQ.user.id + '/' + Date.now() + '-' + f.name.replace(/[^\w.\-]/g,'_');
    const { error } = await MQ.sb.storage.from(MQ.CFG.BUCKETS.chat).upload(path, f);
    if (error){ MQ.toast('Файл ' + f.name + ': ' + error.message, 'err'); continue; }
    out.push({ path, name:f.name, size:f.size, type:f.type });
  }
  return out;
}
MQ.fileUrl = async function(bucket, path){
  const { data, error } = await MQ.sb.storage.from(bucket).createSignedUrl(path, 3600);
  if (error){ MQ.toast('Ссылка недоступна','err'); return null; }
  return data.signedUrl;
};

function msgNode(m){
  const out = m.sender_id === MQ.user.id;
  const n = MQ.el('div','mq-msg ' + (out ? 'mq-msg--out' : 'mq-msg--in'));
  let html = m.body ? '<div>' + MQ.esc(m.body).replace(/\n/g,'<br>') + '</div>' : '';
  const files = Array.isArray(m.attachments) ? m.attachments : [];
  if (files.length){
    html += '<div class="mq-msg__files">' + files.map((f,i) =>
      '<button class="mq-msg__file" type="button" data-f="' + i + '">' +
      MQ.icon((f.type||'').startsWith('image') ? 'image' : 'file',{size:15}) +
      MQ.esc(f.name || 'файл') + '</button>').join('') + '</div>';
  }
  html += '<div class="mq-msg__meta">' + MQ.fmtTime(m.created_at) +
    (out ? (m.read_at
      ? '<span class="mq-msg__read">' + MQ.icon('checkDouble',{size:14}) + '</span>'
      : MQ.icon('check',{size:14})) : '') + '</div>';
  n.innerHTML = html;
  MQ.$$('[data-f]', n).forEach(b => {
    b.onclick = async () => {
      const f = files[+b.dataset.f];
      const url = await MQ.fileUrl(MQ.CFG.BUCKETS.chat, f.path);
      if (url) window.open(url, '_blank', 'noopener');
    };
  });
  return n;
}
function paintMsgs(body){
  if (!body) return;
  body.innerHTML = '';
  if (!state.msgs.length){
    body.appendChild(MQ.empty('Сообщений пока нет. Напишите первым.', 'chat'));
    return;
  }
  let last = '';
  state.msgs.forEach(m => {
    const k = MQ.dayKey(m.created_at);
    if (k !== last){ last = k; body.appendChild(MQ.el('div','mq-chat__day', MQ.dayLabel(m.created_at))); }
    body.appendChild(msgNode(m));
  });
  requestAnimationFrame(() => { body.scrollTop = body.scrollHeight; });
}

function subscribe(onMsg){
  if (state.chan){ MQ.sb.removeChannel(state.chan); state.chan = null; }
  state.chan = MQ.sb.channel('msg-' + MQ.user.id)
    .on('postgres_changes', { event:'INSERT', schema:'public', table:'messages' }, p => onMsg('ins', p.new))
    .on('postgres_changes', { event:'UPDATE', schema:'public', table:'messages' }, p => onMsg('upd', p.new))
    .subscribe();
}

MQ.views.chat = async function(){
  state.files = [];
  state.partners = await loadPartners();
  MQ.setBadge('chat', state.partners.reduce((s,p) => s + (p.unread || 0), 0));

  const root = MQ.el('div','mq-chat mq-anim-in');
  const list = MQ.el('div','mq-chat__list');
  const pane = MQ.el('div','mq-chat__pane');
  root.appendChild(list); root.appendChild(pane);

  function paintList(items, isSearch){
    list.innerHTML = '';
    const top = MQ.el('div','','<input class="mq-input" id="cSearch" placeholder="Поиск людей...">');
    top.style.padding = '10px 12px';
    list.appendChild(top);
    const search = MQ.$('#cSearch', top);
    search.oninput = MQ.debounce(async () => {
      const q = search.value.trim();
      if (!q){ paintList(state.partners, false); return; }
      paintList(await findPeople(q), true);
    }, 320);

    if (!items.length){
      list.appendChild(MQ.empty(isSearch ? 'Никого не нашли' : 'Нет переписок', 'users'));
      return;
    }
    items.forEach(p => {
      const b = MQ.el('button','mq-chat__peer' + (state.peer && state.peer.id === p.id ? ' is-active' : ''));
      b.type = 'button';
      b.innerHTML =
        '<span class="mq-avatar">' + MQ.esc((p.full_name || '?').charAt(0).toUpperCase()) + '</span>' +
        '<span class="mq-chat__peer-body">' +
          '<span class="mq-chat__peer-name">' + MQ.esc(p.full_name || 'Без имени') + '</span>' +
          '<span class="mq-chat__peer-last">' + MQ.esc(p.last_body || 'Начните диалог') + '</span>' +
        '</span>' +
        (p.unread ? '<span class="mq-badge-dot">' + p.unread + '</span>' : '');
      b.onclick = () => openPeer(p);
      list.appendChild(b);
    });
  }

  async function openPeer(p){
    state.peer = p;
    paintList(state.partners, false);
    pane.innerHTML =
      '<div class="mq-chat__head">' +
        '<span class="mq-avatar">' + MQ.esc((p.full_name || '?').charAt(0).toUpperCase()) + '</span>' +
        '<div><div style="font-weight:700">' + MQ.esc(p.full_name || 'Без имени') + '</div>' +
        '<div class="mq-muted" style="font-size:12.5px">' + MQ.esc(p.role || '') + '</div></div>' +
      '</div>' +
      '<div class="mq-chat__body" id="cBody"></div>' +
      '<div class="mq-files" id="cFiles" style="padding:0 12px"></div>' +
      '<div class="mq-chat__foot">' +
        '<button class="mq-btn mq-btn--ghost mq-btn--icon" id="cClip" title="Прикрепить">' +
          MQ.icon('paperclip',{size:19}) + '</button>' +
        '<input type="file" id="cFile" multiple hidden>' +
        '<textarea class="mq-chat__input" id="cIn" rows="1" placeholder="Сообщение..."></textarea>' +
        '<button class="mq-chat__send" id="cSend" disabled>' + MQ.icon('send',{size:19}) + '</button>' +
      '</div>';

    const body = MQ.$('#cBody', pane);
    body.appendChild(MQ.skeleton(2));
    state.msgs = await loadMsgs(p.id);
    paintMsgs(body);

    await MQ.rpc('mark_read', { p_partner: p.id });
    p.unread = 0;
    MQ.setBadge('chat', state.partners.reduce((s,x) => s + (x.unread || 0), 0));
    paintList(state.partners, false);

    const input = MQ.$('#cIn', pane);
    const send  = MQ.$('#cSend', pane);
    const filesBox = MQ.$('#cFiles', pane);
    const fileIn = MQ.$('#cFile', pane);

    function refreshFiles(){
      filesBox.innerHTML = '';
      state.files.forEach((f,i) => {
        const row = MQ.el('div','mq-file',
          MQ.icon((f.type||'').startsWith('image') ? 'image' : 'file',{size:16}) +
          '<span class="mq-file__name">' + MQ.esc(f.name) + '</span>' +
          '<span class="mq-file__size">' + MQ.human(f.size) + '</span>' +
          '<button class="mq-file__x" type="button">' + MQ.icon('close',{size:15}) + '</button>');
        row.querySelector('.mq-file__x').onclick = () => { state.files.splice(i,1); refreshFiles(); toggleSend(); };
        filesBox.appendChild(row);
      });
    }
    function toggleSend(){ send.disabled = !input.value.trim() && !state.files.length; }

    MQ.$('#cClip', pane).onclick = () => fileIn.click();
    fileIn.onchange = () => {
      Array.from(fileIn.files).forEach(f => {
        if (f.size > 25 * 1024 * 1024){ MQ.toast(f.name + ': больше 25 МБ','warn'); return; }
        state.files.push(f);
      });
      fileIn.value = '';
      refreshFiles(); toggleSend();
    };
    input.oninput = () => {
      input.style.height = 'auto';
      input.style.height = Math.min(input.scrollHeight, 130) + 'px';
      toggleSend();
    };
    input.onkeydown = e => {
      if (e.key === 'Enter' && !e.shiftKey && innerWidth > 860){ e.preventDefault(); send.click(); }
    };
    send.onclick = async () => {
      const text = input.value.trim();
      if (!text && !state.files.length) return;
      send.disabled = true;
      const pending = state.files.slice();
      state.files = []; refreshFiles();
      input.value = ''; input.style.height = 'auto';
      const attachments = pending.length ? await uploadChatFiles(pending) : [];
      const { data, error } = await MQ.sb.from('messages').insert({
        sender_id: MQ.user.id, recipient_id: p.id, body: text || null, attachments
      }).select().single();
      if (error){ MQ.toast(error.message,'err'); send.disabled = false; return; }
      state.msgs.push(data);
      paintMsgs(MQ.$('#cBody', pane));
      toggleSend();
    };
    toggleSend();
  }

  paintList(state.partners, false);
  pane.appendChild(MQ.empty('Выберите собеседника слева', 'chat'));
  if (state.partners.length && innerWidth > 860) openPeer(state.partners[0]);

  subscribe(async (kind, m) => {
    if (m.sender_id !== MQ.user.id && m.recipient_id !== MQ.user.id) return;
    const peerId = state.peer && state.peer.id;
    const inThread = peerId && (m.sender_id === peerId || m.recipient_id === peerId);
    if (kind === 'ins'){
      if (inThread){
        state.msgs.push(m);
        paintMsgs(MQ.$('#cBody', pane));
        if (m.recipient_id === MQ.user.id) await MQ.rpc('mark_read', { p_partner: peerId });
      } else if (m.recipient_id === MQ.user.id){
        MQ.setBadge('chat', (MQ.badges.chat || 0) + 1);
        MQ.toast('Новое сообщение', 'info');
      }
    } else if (kind === 'upd' && inThread){
      const i = state.msgs.findIndex(x => x.id === m.id);
      if (i > -1){ state.msgs[i] = m; paintMsgs(MQ.$('#cBody', pane)); }
    }
  });
  return root;
};

MQ.onReady(async function(){
  if (!MQ.isAuthed()) return;
  const list = await loadPartners();
  MQ.setBadge('chat', list.reduce((s,p) => s + (p.unread || 0), 0));
});
})();
</script>

<script>
/* =====================================================================
   B4 — ДОМАШНИЕ ЗАДАНИЯ: мультизагрузка файлов
   ===================================================================== */
(function(){
'use strict';
const MQ = window.MQ;
const BK = () => MQ.CFG.BUCKETS.hw;

MQ.dropzone = function(opt){
  const o = opt || {};
  const files = [];
  const root = MQ.el('div');
  root.innerHTML =
    '<div class="mq-drop" tabindex="0" role="button">' +
      MQ.icon('upload',{size:26}) +
      '<div style="font-weight:700;margin-top:8px">' + (o.title || 'Перетащите файлы или нажмите') + '</div>' +
      '<div class="mq-hint">' + (o.hint || 'PDF, фото, документы · до 25 МБ каждый') + '</div>' +
      '<input type="file" multiple>' +
    '</div>' +
    '<div class="mq-files"></div>';
  const drop = root.querySelector('.mq-drop');
  const input = root.querySelector('input');
  const listBox = root.querySelector('.mq-files');

  function paint(){
    listBox.innerHTML = '';
    files.forEach((f,i) => {
      const row = MQ.el('div','mq-file',
        MQ.icon((f.type||'').startsWith('image') ? 'image' : 'file',{size:17}) +
        '<span class="mq-file__name">' + MQ.esc(f.name) + '</span>' +
        '<span class="mq-file__size">' + MQ.human(f.size) + '</span>' +
        '<button class="mq-file__x" type="button" aria-label="Убрать">' + MQ.icon('close',{size:15}) + '</button>');
      row.querySelector('.mq-file__x').onclick = () => { files.splice(i,1); paint(); };
      listBox.appendChild(row);
    });
  }
  function add(fs){
    Array.from(fs).forEach(f => {
      if (f.size > 25 * 1024 * 1024){ MQ.toast(f.name + ': больше 25 МБ','warn'); return; }
      if (files.length >= (o.max || 10)){ MQ.toast('Максимум ' + (o.max || 10) + ' файлов','warn'); return; }
      files.push(f);
    });
    paint();
  }
  drop.onclick = () => input.click();
  drop.onkeydown = e => { if (e.key === 'Enter' || e.key === ' '){ e.preventDefault(); input.click(); } };
  input.onchange = () => { add(input.files); input.value = ''; };
  ['dragenter','dragover'].forEach(ev => drop.addEventListener(ev, e => {
    e.preventDefault(); drop.classList.add('is-over');
  }));
  ['dragleave','drop'].forEach(ev => drop.addEventListener(ev, e => {
    e.preventDefault(); drop.classList.remove('is-over');
    if (ev === 'drop' && e.dataTransfer) add(e.dataTransfer.files);
  }));

  return {
    node: root,
    files,
    clear(){ files.length = 0; paint(); },
    async upload(prefix){
      const out = [];
      for (const f of files){
        const path = (prefix || MQ.user.id) + '/' + Date.now() + '-' + f.name.replace(/[^\w.\-]/g,'_');
        const { error } = await MQ.sb.storage.from(BK()).upload(path, f);
        if (error){ MQ.toast(f.name + ': ' + error.message,'err'); continue; }
        out.push({ path, name:f.name, size:f.size, type:f.type });
      }
      return out;
    }
  };
};

function attachList(arr, bucket){
  const files = Array.isArray(arr) ? arr : [];
  if (!files.length) return MQ.el('div');
  const box = MQ.el('div','mq-files');
  files.forEach(f => {
    const row = MQ.el('div','mq-file',
      MQ.icon((f.type||'').startsWith('image') ? 'image' : 'file',{size:17}) +
      '<span class="mq-file__name">' + MQ.esc(f.name || 'файл') + '</span>' +
      '<button class="mq-btn mq-btn--ghost mq-btn--sm" type="button">' +
        MQ.icon('download',{size:15}) + 'Открыть</button>');
    row.querySelector('button').onclick = async () => {
      const url = await MQ.fileUrl(bucket || BK(), f.path);
      if (url) window.open(url, '_blank', 'noopener');
    };
    box.appendChild(row);
  });
  return box;
}

function hwCard(hw, subs, asTeacher){
  const mine = (subs || []).filter(s => s.homework_id === hw.id);
  const graded = mine.find(s => s.grade != null);
  const status = graded ? 'graded' : mine.length ? 'submitted' : 'open';
  const late = hw.due_at && status === 'open' && new Date(hw.due_at) < new Date();

  const card = MQ.el('div','mq-card mq-card--hover mq-hw mq-hw--' + status + ' mq-anim-in');
  card.innerHTML =
    '<div class="mq-card__head">' +
      MQ.iconBadge('note', status === 'graded' ? 'ok' : status === 'submitted' ? 'info' : 'warn') +
      '<div style="flex:1;min-width:0">' +
        '<h3 class="mq-card__title">' + MQ.esc(hw.title) + '</h3>' +
        '<p class="mq-card__sub">' + (hw.due_at
          ? '<span class="mq-hw__due' + (late ? ' is-late' : '') + '">' +
            MQ.icon('clock',{size:14}) + ' до ' + MQ.fmtDate(hw.due_at) + '</span>'
          : 'без дедлайна') + '</p>' +
      '</div>' +
      '<span class="mq-chip mq-chip--' + (status === 'graded' ? 'ok' : status === 'submitted' ? 'brand' : 'warn') + '">' +
        (status === 'graded' ? 'Оценка ' + graded.grade : status === 'submitted' ? 'Сдано' : 'Открыто') + '</span>' +
    '</div>' +
    (hw.description ? '<p>' + MQ.esc(hw.description).replace(/\n/g,'<br>') + '</p>' : '');

  card.appendChild(attachList(hw.attachments));

  if (graded && graded.feedback){
    card.appendChild(MQ.el('div','mq-card',
      '<div class="mq-row">' + MQ.icon('lightbulb',{size:17}) +
      '<b>Комментарий преподавателя</b></div><p style="margin:8px 0 0">' +
      MQ.esc(graded.feedback) + '</p>'));
  }
  if (!asTeacher && status === 'open'){
    const btn = MQ.el('button','mq-btn mq-btn--primary', MQ.icon('upload',{size:17}) + 'Сдать работу');
    btn.style.marginTop = '12px';
    btn.onclick = () => submitDialog(hw);
    card.appendChild(btn);
  }
  mine.forEach(s => {
    const box = MQ.el('div','mq-card');
    box.style.marginTop = '12px';
    box.innerHTML = '<div class="mq-row mq-muted" style="font-size:13px">' +
      MQ.icon('check',{size:15}) + 'Отправлено ' + MQ.fmtDate(s.created_at) + '</div>' +
      (s.comment ? '<p style="margin:8px 0 0">' + MQ.esc(s.comment) + '</p>' : '');
    box.appendChild(attachList(s.attachments));
    if (asTeacher && s.grade == null){
      const g = MQ.el('button','mq-btn mq-btn--ok mq-btn--sm', MQ.icon('star',{size:15}) + 'Оценить');
      g.style.marginTop = '10px';
      g.onclick = () => gradeDialog(s);
      box.appendChild(g);
    }
    card.appendChild(box);
  });
  return card;
}

function customModal(title, contentNode, okText, onOk){
  const back = MQ.el('div','mq-modal-back');
  back.innerHTML = '<div class="mq-modal"><button class="mq-modal__x" type="button">' +
    MQ.icon('close',{size:18}) + '</button><h3 class="mq-modal__t">' + MQ.esc(title) + '</h3>' +
    '<div data-slot></div><div class="mq-modal__row">' +
    '<button class="mq-btn mq-btn--ghost" data-no>Отмена</button>' +
    '<button class="mq-btn mq-btn--primary" data-yes>' + MQ.esc(okText) + '</button></div></div>';
  back.querySelector('[data-slot]').appendChild(contentNode);
  document.body.appendChild(back);
  requestAnimationFrame(() => back.classList.add('is-in'));
  const close = () => { back.classList.remove('is-in'); setTimeout(() => back.remove(), 240); };
  back.querySelector('[data-no]').onclick = close;
  back.querySelector('.mq-modal__x').onclick = close;
  const go = back.querySelector('[data-yes]');
  go.onclick = () => onOk(go, close);
  return close;
}

async function submitDialog(hw){
  const dz = MQ.dropzone({ title:'Прикрепите решение', max:10 });
  const wrap = MQ.el('div','mq-stack',
    '<label class="mq-field"><span class="mq-label">Комментарий (необязательно)</span>' +
    '<textarea class="mq-textarea" id="sbCom" placeholder="Что было сложно?"></textarea></label>');
  wrap.appendChild(dz.node);

  customModal('Сдать: ' + hw.title, wrap, 'Отправить', async (go, close) => {
    if (!dz.files.length){ MQ.toast('Прикрепите хотя бы один файл','warn'); return; }
    go.disabled = true;
    go.innerHTML = MQ.icon('refresh',{size:17,cls:'mq-spin'}) + 'Загрузка...';
    const attachments = await dz.upload(MQ.user.id + '/hw' + hw.id);
    const { error } = await MQ.sb.from('homework_submissions').insert({
      homework_id: hw.id, student_id: MQ.user.id,
      comment: (MQ.$('#sbCom', wrap).value || '').trim() || null, attachments
    });
    if (error){ MQ.toast(error.message,'err'); go.disabled = false; go.textContent = 'Отправить'; return; }
    await MQ.sb.from('homework').update({ status:'submitted' }).eq('id', hw.id);
    close();
    MQ.confetti(28);
    MQ.toast('Работа отправлена', 'ok');
    MQ.render();
  });
}

async function gradeDialog(sub){
  const grade = await MQ.promptBox('Оценка от 2 до 5', '5', 'Проверка работы');
  if (grade == null) return;
  const g = Math.max(2, Math.min(5, parseInt(grade, 10) || 5));
  const fb = await MQ.promptBox('Комментарий ученику (можно пропустить)', '', 'Обратная связь');
  const { error } = await MQ.sb.from('homework_submissions')
    .update({ grade:g, feedback: fb || null }).eq('id', sub.id);
  if (error){ MQ.toast(error.message,'err'); return; }
  await MQ.sb.from('homework').update({ status:'graded' }).eq('id', sub.homework_id);
  MQ.toast('Оценка выставлена', 'ok');
  MQ.render();
}

async function createDialog(){
  const { data: students } = await MQ.sb.from('profiles')
    .select('id,full_name').eq('role','student').order('full_name');
  if (!students || !students.length){ MQ.alertBox('Пока нет учеников в системе'); return; }

  const dz = MQ.dropzone({ title:'Материалы к заданию', max:10 });
  const form = MQ.el('div','mq-stack',
    '<label class="mq-field"><span class="mq-label">Ученик</span><select class="mq-select" id="hStu">' +
      students.map(s => '<option value="' + s.id + '">' + MQ.esc(s.full_name || s.id) + '</option>').join('') +
    '</select></label>' +
    '<label class="mq-field"><span class="mq-label">Название</span>' +
      '<input class="mq-input" id="hTitle" placeholder="Квадратные уравнения, §12"></label>' +
    '<label class="mq-field"><span class="mq-label">Описание</span>' +
      '<textarea class="mq-textarea" id="hDesc" placeholder="Номера, пояснения, что повторить"></textarea></label>' +
    '<label class="mq-field"><span class="mq-label">Срок сдачи</span>' +
      '<input class="mq-input" id="hDue" type="date"></label>');
  form.appendChild(dz.node);

  customModal('Новое задание', form, 'Создать', async (go, close) => {
    const title = MQ.$('#hTitle', form).value.trim();
    if (!title){ MQ.toast('Укажите название','warn'); return; }
    go.disabled = true;
    go.innerHTML = MQ.icon('refresh',{size:17,cls:'mq-spin'}) + 'Создаём...';
    const attachments = dz.files.length ? await dz.upload(MQ.user.id + '/tasks') : [];
    const due = MQ.$('#hDue', form).value;
    const { error } = await MQ.sb.from('homework').insert({
      teacher_id: MQ.user.id, student_id: MQ.$('#hStu', form).value, title,
      description: MQ.$('#hDesc', form).value.trim() || null,
      attachments, due_at: due ? new Date(due).toISOString() : null
    });
    if (error){ MQ.toast(error.message,'err'); go.disabled = false; go.textContent = 'Создать'; return; }
    close();
    MQ.toast('Задание создано', 'ok');
    MQ.render();
  });
}

MQ.views.hw = async function(){
  const asTeacher = MQ.role() === 'teacher' || MQ.role() === 'admin';
  const wrap = MQ.el('div','mq-stack');

  const head = MQ.el('div','mq-row mq-row--wrap',
    '<h2 style="margin:0">Домашние задания</h2><div class="mq-spacer"></div>');
  if (asTeacher){
    const add = MQ.el('button','mq-btn mq-btn--primary', MQ.icon('plus',{size:17}) + 'Новое задание');
    add.onclick = createDialog;
    head.appendChild(add);
  }
  wrap.appendChild(head);

  let q = MQ.sb.from('homework').select('*').order('created_at',{ ascending:false }).limit(60);
  q = asTeacher ? q.eq('teacher_id', MQ.user.id) : q.eq('student_id', MQ.user.id);
  const { data: hws, error } = await q;
  if (error) throw error;

  const ids = (hws || []).map(h => h.id);
  let subs = [];
  if (ids.length){
    const { data } = await MQ.sb.from('homework_submissions').select('*').in('homework_id', ids);
    subs = data || [];
  }
  if (!asTeacher){
    MQ.setBadge('hw', (hws || []).filter(h => !subs.some(s => s.homework_id === h.id)).length);
  }
  if (!hws || !hws.length){
    wrap.appendChild(MQ.empty(asTeacher ? 'Заданий пока нет — создайте первое' : 'Заданий нет. Отдыхайте!', 'note'));
    return wrap;
  }
  hws.forEach(h => wrap.appendChild(hwCard(h, subs, asTeacher)));
  return wrap;
};
})();
</script>

<script>
/* =====================================================================
   B5 — ТРЕНАЖЁРЫ: все бесплатные
   ===================================================================== */
(function(){
'use strict';
const MQ = window.MQ;
const ri = (a,b) => a + Math.floor(Math.random() * (b - a + 1));
const pick = a => a[Math.floor(Math.random() * a.length)];
const shuffle = a => a.map(v => [Math.random(), v]).sort((x,y) => x[0]-y[0]).map(p => p[1]);

const GEN = {
  add: lvl => { const m = 10 * lvl; const a = ri(1,m), b = ri(1,m); return { q: a + ' + ' + b, a: a + b }; },
  sub: lvl => { const m = 10 * lvl; let a = ri(1,m), b = ri(1,m); if (b > a){ const t=a; a=b; b=t; } return { q: a + ' − ' + b, a: a - b }; },
  mul: lvl => { const a = ri(2, 4 + 3*lvl), b = ri(2, 4 + 3*lvl); return { q: a + ' × ' + b, a: a * b }; },
  div: lvl => { const b = ri(2, 3 + 2*lvl), r = ri(2, 4 + 3*lvl); return { q: (b*r) + ' ÷ ' + b, a: r }; },
  pow: lvl => { const a = ri(2, 6 + lvl), n = lvl > 2 ? 3 : 2; return { q: '\\(' + a + '^' + n + '\\)', a: Math.pow(a,n) }; },
  percent: lvl => { const p = pick([10,20,25,50]), n = ri(2, 10*lvl) * 4; return { q: p + '% от ' + n, a: Math.round(n * p / 100) }; },
  linear: lvl => { const k = ri(2, 3 + lvl), x = ri(1, 5 + 2*lvl), b = ri(1, 10*lvl);
    return { q: '\\(' + k + 'x + ' + b + ' = ' + (k*x + b) + '\\), найдите \\(x\\)', a: x }; },
  linear2: lvl => { const x = ri(2, 6 + lvl), k = ri(2,5), b = ri(1,9);
    return { q: '\\(' + k + 'x - ' + b + ' = ' + (k*x - b) + '\\)', a: x }; },
  quad: () => { const x1 = ri(1,7), x2 = ri(1,7);
    return { q: '\\(x^2 - ' + (x1+x2) + 'x + ' + (x1*x2) + ' = 0\\), больший корень', a: Math.max(x1,x2) }; },
  square: lvl => { const a = ri(2, 8 + lvl); return { q: 'Площадь квадрата со стороной ' + a, a: a*a }; },
  rect: lvl => { const a = ri(2, 9 + lvl), b = ri(2, 9 + lvl); return { q: 'Площадь прямоугольника ' + a + ' × ' + b, a: a*b }; },
  perim: lvl => { const a = ri(2, 9 + lvl), b = ri(2, 9 + lvl); return { q: 'Периметр прямоугольника ' + a + ' × ' + b, a: 2*(a+b) }; },
  triangle: lvl => { const a = ri(2, 10 + lvl) * 2, h = ri(2, 8 + lvl);
    return { q: 'Площадь треугольника: основание ' + a + ', высота ' + h, a: a*h/2 }; },
  angles: () => { const a = ri(20,80), b = ri(20, 150 - a);
    return { q: 'Два угла треугольника: ' + a + '° и ' + b + '°. Третий?', a: 180 - a - b }; },
  seq: lvl => { const s = ri(1,9), d = ri(2, 3 + lvl);
    return { q: s + ', ' + (s+d) + ', ' + (s+2*d) + ', ' + (s+3*d) + ', ...  следующее?', a: s + 4*d }; },
  logic: () => { const a = ri(2,9), b = ri(2,9);
    return { q: 'У ' + a + ' коробок по ' + b + ' карандашей. Сколько карандашей?', a: a*b }; },
  speed: lvl => { const v = ri(3, 8 + lvl) * 10, t = ri(2, 5);
    return { q: 'Скорость ' + v + ' км/ч, время ' + t + ' ч. Путь?', a: v*t }; }
};
GEN.vpr = lvl => pick([GEN.percent, GEN.rect, GEN.speed, GEN.seq, GEN.add])(lvl);

const SECTIONS = [
  { key:'arithmetic', title:'Арифметика', icon:'sigma',
    kinds:[['add','Сложение'],['sub','Вычитание'],['mul','Умножение'],['div','Деление'],
           ['pow','Степени'],['percent','Проценты']] },
  { key:'algebra', title:'Алгебра', icon:'chart',
    kinds:[['linear','Линейные уравнения'],['linear2','Уравнения со сдвигом'],
           ['quad','Квадратные уравнения'],['seq','Последовательности']] },
  { key:'geometry', title:'Геометрия', icon:'ruler',
    kinds:[['square','Площадь квадрата'],['rect','Площадь прямоугольника'],
           ['perim','Периметр'],['triangle','Площадь треугольника'],['angles','Углы']] },
  { key:'logic', title:'Логика и задачи', icon:'lightbulb',
    kinds:[['logic','Текстовые задачи'],['speed','Движение']] },
  { key:'vpr', title:'Подготовка к ВПР', icon:'target',
    kinds:[['vpr','Смешанный вариант']] }
];
const LEVELS = [[1,'Легко'],[2,'Средне'],[3,'Сложно']];

const CATALOG = (function(){
  const out = [];
  SECTIONS.forEach(s => s.kinds.forEach(pair => LEVELS.forEach(l => {
    out.push({
      slug: s.key + '-' + pair[0] + '-' + l[0],
      section: s.key, sectionTitle: s.title, icon: s.icon,
      kind: pair[0], lvl: l[0], title: pair[1], sub: l[1], reward: 3 + l[0] * 2
    });
  })));
  return out;
})();

function makeQuestion(kind, lvl){
  const g = GEN[kind] || GEN.add;
  const item = g(lvl);
  const right = item.a;
  const opts = new Set([right]);
  let guard = 0;
  while (opts.size < 4 && guard++ < 40){
    const delta = ri(1, Math.max(3, Math.round(Math.abs(right) * 0.25) + lvl * 2));
    const cand = Math.random() < .5 ? right + delta : right - delta;
    if (cand !== right && cand >= 0) opts.add(cand);
  }
  while (opts.size < 4) opts.add(right + opts.size);
  return { q: item.q, a: right, opts: shuffle(Array.from(opts)) };
}

MQ.runDrill = function(game){
  const TOTAL = 10;
  let idx = 0, correct = 0, locked = false;
  const started = Date.now();
  const view = MQ.$('#mqView');
  const root = MQ.el('div','mq-drill mq-anim-in');

  async function saveResult(corr, total, earned, ms){
    if (!MQ.isAuthed()) return;
    await MQ.sb.from('game_results').insert({
      user_id: MQ.user.id, game_slug: game.slug,
      score: earned, correct: corr, total, duration_ms: ms
    });
    if (earned > 0){
      const { data } = await MQ.rpc('add_points', { p_amount: earned });
      if (data && data[0]){
        MQ.profile.points = data[0].points;
        MQ.profile.streak = data[0].streak;
        MQ.dressHeader();
      }
      MQ.pointsPop(earned, MQ.$('#mqPts'));
    }
    await MQ.rpc('bump_daily', { p_solved: corr });
    const { data: codes } = await MQ.rpc('grant_achievements');
    if (codes && codes.length){ MQ.confetti(40); MQ.toast('Новое достижение!', 'ok', 4000); }
  }

  function finish(){
    const spent = Date.now() - started;
    const earned = correct * game.reward;
    root.innerHTML =
      '<div class="mq-card mq-card--pad-lg mq-center">' +
        MQ.iconBadge(correct >= 8 ? 'trophy' : correct >= 5 ? 'medal' : 'target',
                     correct >= 8 ? 'ok' : correct >= 5 ? 'info' : 'warn', 26) +
        '<h2 style="margin-top:14px">' + correct + ' из ' + TOTAL + '</h2>' +
        '<p class="mq-muted">' + (correct >= 8 ? 'Отличный результат!' :
          correct >= 5 ? 'Хорошо, продолжаем' : 'Потренируемся ещё') + '</p>' +
        '<div class="mq-row" style="justify-content:center;gap:16px;margin:18px 0">' +
          '<span class="mq-chip mq-chip--ok">' + MQ.icon('coin',{size:15}) + '+' + earned + '</span>' +
          '<span class="mq-chip">' + MQ.icon('clock',{size:15}) + Math.round(spent/1000) + ' с</span>' +
        '</div>' +
        '<div class="mq-row" style="justify-content:center;gap:10px">' +
          '<button class="mq-btn mq-btn--primary" id="dAgain">' + MQ.icon('refresh',{size:17}) + 'Ещё раз</button>' +
          '<button class="mq-btn mq-btn--ghost" id="dBack">К списку</button>' +
        '</div>' +
      '</div>';
    MQ.$('#dAgain', root).onclick = () => MQ.runDrill(game);
    MQ.$('#dBack', root).onclick = () => MQ.go('games');
    if (correct >= 8) MQ.confetti(50);
    saveResult(correct, TOTAL, earned, spent);
  }

  function step(){
    if (idx >= TOTAL){ finish(); return; }
    const item = makeQuestion(game.kind, game.lvl);
    locked = false;
    root.innerHTML =
      '<div class="mq-card mq-card--pad-lg">' +
        '<div class="mq-row" style="margin-bottom:14px">' +
          '<span class="mq-chip mq-chip--brand">' + MQ.esc(game.title) + '</span>' +
          '<div class="mq-spacer"></div>' +
          '<span class="mq-chip">' + (idx + 1) + ' / ' + TOTAL + '</span>' +
        '</div>' +
        '<div class="mq-progress"><i style="width:' + (idx / TOTAL * 100) + '%"></i></div>' +
        '<div class="mq-drill__q">' + item.q + '</div>' +
        '<div class="mq-drill__opts">' +
          item.opts.map(o => '<button class="mq-drill__opt" type="button" data-v="' + o + '">' + o + '</button>').join('') +
        '</div>' +
      '</div>';
    MQ.math(root);
    MQ.$$('.mq-drill__opt', root).forEach(b => {
      b.onclick = () => {
        if (locked) return;
        locked = true;
        const ok = Number(b.dataset.v) === item.a;
        if (ok){ correct++; b.classList.add('is-right'); }
        else {
          b.classList.add('is-wrong');
          const right = MQ.$$('.mq-drill__opt', root).filter(x => Number(x.dataset.v) === item.a)[0];
          if (right) right.classList.add('is-right');
        }
        idx++;
        setTimeout(step, ok ? 380 : 900);
      };
    });
  }
  view.innerHTML = '';
  view.appendChild(root);
  step();
};

MQ.views.games = async function(){
  const wrap = MQ.el('div','mq-stack',
    '<div class="mq-row mq-row--wrap">' +
      '<div><h2 style="margin:0">Тренажёры</h2>' +
      '<p class="mq-muted" style="margin:2px 0 0;font-size:14px">' + CATALOG.length +
      ' режимов · все бесплатно</p></div>' +
      '<div class="mq-spacer"></div>' +
      '<input class="mq-input" id="gQ" placeholder="Поиск..." style="max-width:220px">' +
    '</div>');
  const listBox = MQ.el('div','mq-stack');
  wrap.appendChild(listBox);

  let custom = [];
  const { data: cg } = await MQ.sb.from('games').select('*').eq('is_active', true).limit(40);
  if (cg && cg.length){
    custom = cg.map(g => ({
      slug: g.slug, section: g.section, sectionTitle:'От преподавателя', icon:'user',
      kind: (g.config && g.config.kind) || 'add',
      lvl: (g.config && g.config.lvl) || 1,
      title: g.title, sub:'авторский', reward: g.reward || 5
    }));
  }
  const all = custom.concat(CATALOG);

  function card(g){
    const c = MQ.el('div','mq-game mq-game--' + g.section,
      MQ.iconBadge(g.icon, g.section === 'geometry' ? 'info' : g.section === 'algebra' ? 'ok' :
                            g.section === 'vpr' ? 'warn' : null) +
      '<div class="mq-game__title">' + MQ.esc(g.title) + '</div>' +
      '<div class="mq-muted" style="font-size:13px">' + MQ.esc(g.sub) + '</div>' +
      '<div class="mq-game__meta">' +
        '<span class="mq-game__free">' + MQ.icon('check',{size:14}) + ' бесплатно</span>' +
        '<span>' + MQ.icon('coin',{size:14}) + ' +' + g.reward + '</span>' +
      '</div>');
    c.onclick = () => MQ.runDrill(g);
    return c;
  }
  function paint(filter){
    listBox.innerHTML = '';
    const f = (filter || '').toLowerCase();
    const groups = {};
    all.filter(g => !f || g.title.toLowerCase().indexOf(f) > -1 || g.sectionTitle.toLowerCase().indexOf(f) > -1)
       .forEach(g => { (groups[g.sectionTitle] = groups[g.sectionTitle] || []).push(g); });
    const keys = Object.keys(groups);
    if (!keys.length){ listBox.appendChild(MQ.empty('Ничего не нашли','search')); return; }
    keys.forEach(k => {
      const sec = MQ.el('div','mq-stack');
      sec.appendChild(MQ.el('h3','', MQ.esc(k) +
        ' <span class="mq-muted" style="font-weight:500;font-size:14px">· ' + groups[k].length + '</span>'));
      const grid = MQ.el('div','mq-grid mq-grid--4');
      groups[k].forEach(g => grid.appendChild(card(g)));
      sec.appendChild(grid);
      listBox.appendChild(sec);
    });
  }
  paint('');
  MQ.$('#gQ', wrap).oninput = MQ.debounce(e => paint(e.target.value), 220);
  return wrap;
};
})();
</script>

<script>
/* =====================================================================
   B6 — ПРОГРЕСС, ЦЕЛЬ ДНЯ, ДОСТИЖЕНИЯ, ДЕТИ, УЧЕНИКИ
   ===================================================================== */
(function(){
'use strict';
const MQ = window.MQ;

MQ.goalRing = function(solved, goal){
  const g = Math.max(1, goal || 10);
  const pct = Math.min(100, Math.round(solved / g * 100));
  return MQ.el('div','mq-card mq-card--pad-lg',
    '<div class="mq-goal">' +
      '<div class="mq-goal__ring' + (pct >= 100 ? ' is-done' : '') +
        '" style="--p:' + pct + ';position:relative"><b>' + pct + '%</b></div>' +
      '<div>' +
        '<h3 style="margin:0 0 4px">Цель на день</h3>' +
        '<p class="mq-muted" style="margin:0">' + solved + ' из ' + g + ' задач' +
        (pct >= 100 ? ' · выполнено' : '') + '</p>' +
        (pct < 100 ? '<button class="mq-btn mq-btn--primary mq-btn--sm" style="margin-top:10px" data-go="games">' +
          MQ.icon('play',{size:15}) + 'Тренироваться</button>' : '') +
      '</div>' +
    '</div>');
};

async function progressFor(userId){
  const today = MQ.dayKey(new Date());
  const res = await Promise.all([
    MQ.sb.from('daily_progress').select('*').eq('user_id', userId).eq('day', today).maybeSingle(),
    MQ.sb.from('game_results').select('correct,total,score,created_at')
      .eq('user_id', userId).order('created_at',{ascending:false}).limit(120),
    MQ.sb.from('user_achievements').select('code,earned_at').eq('user_id', userId)
  ]);
  const dp = res[0], runs = res[1].data || [], ua = res[2].data || [];
  const correct = runs.reduce((s,r) => s + (r.correct || 0), 0);
  const total   = runs.reduce((s,r) => s + (r.total || 0), 0);
  return {
    solved: dp.data ? dp.data.solved : 0,
    goal:   dp.data ? dp.data.goal : (MQ.profile && MQ.profile.daily_goal) || 10,
    runs, correct, total,
    accuracy: total ? Math.round(correct / total * 100) : 0,
    codes: ua.map(x => x.code)
  };
}

MQ.views.stats = async function(){

  const cards = MQ.el('div','mq-grid mq-grid--3');
  [['Решено верно', st.correct, 'check', 'ok'],
   ['Точность', st.accuracy + '%', 'target', 'info'],
   ['Серия дней', (MQ.profile && MQ.profile.streak) || 0, 'fire', 'warn'],
   ['Баллы', (MQ.profile && MQ.profile.points) || 0, 'coin', null]
  ].forEach(r => {
    cards.appendChild(MQ.el('div','mq-card mq-card--hover',

      '<div class="mq-muted" style="font-size:13.5px">' + r[0] + '</div>'));
  });
  wrap.appendChild(cards);

  const days = {};
  st.runs.forEach(r => { const k = MQ.dayKey(r.created_at); days[k] = (days[k] || 0) + (r.correct || 0); });
  let barsHtml = '<div class="mq-card__head">' + MQ.iconBadge('calendar','info') +
    '<div><h3 class="mq-card__title">Последняя неделя</h3></div></div>' +
    '<div class="mq-row" style="align-items:flex-end;height:110px;gap:8px">';
  const vals = Object.keys(days).map(k => days[k]);
  const maxV = Math.max.apply(null, [1].concat(vals));
  for (let i = 6; i >= 0; i--){
    const d = new Date(); d.setDate(d.getDate() - i);
    const v = days[MQ.dayKey(d)] || 0;
    barsHtml += '<div style="flex:1;text-align:center">' +
      '<div style="height:' + Math.max(4, v / maxV * 84) + 'px;border-radius:6px;background:var(--grad)"></div>' +
      '<div class="mq-muted" style="font-size:11px;margin-top:6px">' +
        d.toLocaleDateString('ru-RU',{weekday:'short'}) + '</div>' +
      '<div style="font-size:12px;font-weight:700">' + v + '</div></div>';
  }
  wrap.appendChild(MQ.el('div','mq-card', barsHtml + '</div>'));

  const ach = MQ.el('div','mq-card',
    '<div class="mq-card__head">' + MQ.iconBadge('trophy','warn') +
    '<div><h3 class="mq-card__title">Достижения</h3>' +
    '<p class="mq-card__sub">' + st.codes.length + ' из ' + ((achs || []).length) + '</p></div></div>');
  const grid = MQ.el('div','mq-grid mq-grid--4');
  (achs || []).forEach(a => {
    const got = st.codes.indexOf(a.code) > -1;
    const c = MQ.el('div','mq-card' + (got ? ' mq-card--hover' : ''),
      MQ.iconBadge(got ? a.icon : 'lock', got ? 'ok' : null) +

      '<div class="mq-muted" style="font-size:12.5px">' + MQ.esc(a.description || '') + '</div>');
    c.style.opacity = got ? '1' : '.45';

  ach.appendChild(grid);
  wrap.appendChild(ach);
  return wrap;
};
