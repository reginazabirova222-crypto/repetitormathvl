    ===================================================================== -->
    <script>
        (function() {
            'use strict';
            const MQ = window.MQ;

            const THEMES_DATA = {
                'pythagoras': {
                    title: 'Теорема Пифагора',
                    icon: 'ruler',
                    iconClass: 'pythagoras',
                    grade: 8,
                    theory: `**Теорема Пифагора**: В прямоугольном треугольнике квадрат гипотенузы равен сумме квадратов катетов.

        \\(c^2 = a^2 + b^2\\)

        где \\(c\\) — гипотенуза, \\(a\\) и \\(b\\) — катеты.

        **Обратная теорема**: Если квадрат одной стороны треугольника равен сумме квадратов двух других сторон, то этот треугольник прямоугольный.

        **Египетский треугольник** — стороны 3, 4, 5.

        **Формулы:**
        - \\(c = \\sqrt{a^2 + b^2}\\)
        - \\(a = \\sqrt{c^2 - b^2}\\)
        - \\(b = \\sqrt{c^2 - a^2}\\)`
                }
            };

            function getAllThemes() {
                const stored = JSON.parse(localStorage.getItem('imath_themes') || '{}');
                const all = { ...THEMES_DATA };
                Object.keys(stored).forEach(k => {
                    all[k] = { ...all[k], ...stored[k] };
                });
                return all;
            }

            async function getTasksForTheme(themeKey) {
                const { data, error } = await MQ.sb.from('tasks')
                    .select('*')
                    .eq('section', themeKey)
                    .order('created_at', { ascending: true })
                    .limit(100);
                if (error) { console.warn('[themes]', error); return []; }
                return data || [];
            }

            async function getSolvedTaskIds() {
                if (!MQ.isAuthed()) return [];
                const { data } = await MQ.sb.from('task_solutions')
                    .select('task_id').eq('user_id', MQ.user.id).eq('correct', true);
                return data ? data.map(s => s.task_id) : [];
            }

            function taskListItem(task, solvedIds) {
                const div = MQ.el('div', 'mq-card');
                const row = MQ.el('div', 'mq-row');
                row.innerHTML = '<div style="flex:1"><b>' + MQ.esc(task.title) + '</b>' +
                    (task.grade ? ' <span class="mq-chip">' + task.grade + ' кл</span>' : '') +
                    (task.exam ? ' <span class="mq-chip">' + task.exam.toUpperCase() + '</span>' : '') +
                    '</div>';
                const solved = solvedIds.includes(task.id);
                if (!MQ.isTeacher() && MQ.isAuthed()) {
                    const btn = MQ.el('button', 'mq-btn ' + (solved ? 'mq-btn--ghost' : 'mq-btn--primary mq-btn--sm'),
                        solved ? MQ.icon('check', { size: 15 }) + 'Решено' : 'Решить');
                    if (!solved) {
                        btn.onclick = () => MQ.taskDialog ? MQ.taskDialog(task) : null;
                    }
                    row.appendChild(btn);
                }
                div.appendChild(row);
                if (task.statement_html) {
                    const st = MQ.el('div', '', task.statement_html);
                    st.style.marginTop = '6px';
                    div.appendChild(st);
                }
                if (task.image_path) {
                    const img = MQ.el('img', '', '');
                    img.src = MQ.pubUrl('tasks', task.image_path);
                    img.style.maxHeight = '120px';
                    img.style.borderRadius = '8px';
                    img.style.marginTop = '6px';
                    div.appendChild(img);
                }
                return div;
            }

            async function themeDialog(themeKey) {
                const data = themeKey ? THEMES_DATA[themeKey] : null;
                const form = MQ.el('div', 'mq-stack',
                    '<label class="mq-field"><span class="mq-label">Ключ темы (уникальный)</span>' +
                    '<input class="mq-input" id="thKey" value="' + MQ.esc(themeKey || '') +
                    '" placeholder="pythagoras" ' + (themeKey ? 'readonly' : '') + '></label>' +
                    '<label class="mq-field"><span class="mq-label">Название</span>' +
                    '<input class="mq-input" id="thTitle" value="' + MQ.esc(data ? data.title : '') +
                    '" placeholder="Теорема Пифагора"></label>' +
                    '<label class="mq-field"><span class="mq-label">Класс</span><select class="mq-select" id="thGrade">' +
                    [5, 6, 7, 8, 9, 10, 11].map(g => '<option value="' + g + '"' + (data && data.grade == g ?
                        ' selected' : '') + '>' + g + ' класс</option>').join('') +
                    '</select></label>' +
                    '<label class="mq-field"><span class="mq-label">Иконка (ruler, book, target, ...)</span>' +
                    '<input class="mq-input" id="thIcon" value="' + MQ.esc(data ? data.icon : 'ruler') +
                    '" placeholder="ruler"></label>' +
                    '<label class="mq-field"><span class="mq-label">Теория (LaTeX поддерживается)</span>' +
                    '<textarea class="mq-textarea" id="thTheory" rows="10" placeholder="Теория по теме...">' +
                    MQ.esc(data ? data.theory : '') + '</textarea></label>');

                MQ.modalNode(themeKey ? 'Изменить тему' : 'Новая тема', form,
                    themeKey ? 'Сохранить' : 'Создать', async (go, close) => {
                        const key = MQ.$('#thKey', form).value.trim();
                        const title = MQ.$('#thTitle', form).value.trim();
                        const theory = MQ.$('#thTheory', form).value.trim();
                        const icon = MQ.$('#thIcon', form).value.trim() || 'ruler';
                        const grade = parseInt(MQ.$('#thGrade', form).value, 10) || 5;
                        if (!key || !title) { MQ.toast('Заполните ключ и название', 'warn'); return; }
                        if (!theory) { MQ.toast('Добавьте теорию', 'warn'); return; }
                        const stored = JSON.parse(localStorage.getItem('imath_themes') || '{}');
                        stored[key] = { title, theory, icon, iconClass: key, grade };
                        localStorage.setItem('imath_themes', JSON.stringify(stored));
                        THEMES_DATA[key] = { title, theory, icon, iconClass: key, grade };
                        close();
                        MQ.toast('Тема сохранена', 'ok');
                        MQ.render();
                    });
            }

            MQ.views.themes = async function() {
                const params = MQ.params || {};
                const selectedTheme = params.theme || null;
                const action = params.action || null;
                const isT = MQ.isTeacher();

                if (selectedTheme) {
                    const themes = getAllThemes();
                    const theme = themes[selectedTheme];
                    if (!theme) {
                        return MQ.el('div', 'mq-stack mq-anim-in',
                            MQ.el('p', '', 'Тема не найдена') +
                            MQ.el('button', 'mq-btn mq-btn--ghost', 'Назад', { onclick: () => MQ.go('themes') }));
                    }
                    if (action === 'manage' && isT) {
                        themeDialog(selectedTheme);
                        return MQ.el('div', 'mq-stack mq-anim-in',
                            MQ.el('p', '', 'Редактирование темы...') +
                            MQ.el('button', 'mq-btn mq-btn--ghost', 'Назад', { onclick: () => MQ.go('themes') }));
                    }
                    const tasks = await getTasksForTheme(selectedTheme);
                    const solvedIds = await getSolvedTaskIds();

                    const wrap = MQ.el('div', 'mq-stack mq-anim-in');
                    const back = MQ.el('button', 'mq-btn mq-btn--ghost mq-btn--sm', MQ.icon('arrow-left', { size: 16 }) +
                        ' Назад к темам');
                    back.onclick = () => MQ.go('themes');
                    wrap.appendChild(back);

                    const head = MQ.el('div', 'mq-row mq-row--wrap',
                        '<div class="mq-row"><span class="mq-theme-icon ' + (theme.iconClass || '') + '">' +
                        MQ.icon(theme.icon || 'ruler', { size: 28 }) + '</span>' +
                        '<div><h2 style="margin:0">' + MQ.esc(theme.title) + '</h2>' +
                        '<p class="mq-muted" style="margin:2px 0 0;font-size:14px">' + tasks.length +
                        ' задач · ' + (theme.grade ? theme.grade + ' класс' : '') + '</p></div></div>');
                    if (isT) {
                        const addTask = MQ.el('button', 'mq-btn mq-btn--primary mq-btn--sm', MQ.icon('plus', { size: 16 }) +
                            'Добавить задачу');
                        addTask.onclick = () => {
                            const t = { section: selectedTheme, grade: theme.grade || null };
                            MQ.taskDialog(t);
                        };
                        head.appendChild(addTask);
                        const manageTheory = MQ.el('button', 'mq-btn mq-btn--ghost mq-btn--sm', MQ.icon('edit', { size: 16 }) +
                            'Редактировать теорию');
                        manageTheory.onclick = () => MQ.go('themes', { theme: selectedTheme, action: 'manage' });
                        head.appendChild(manageTheory);
                    }
                    wrap.appendChild(head);

                    if (theme.theory) {
                        const theoryBlock = MQ.el('div', 'mq-theory-block',
                            '<h3>📖 Теоретический материал</h3>' +
                            '<div class="mq-theory-body">' + theme.theory.replace(/\n/g, '<br>') + '</div>');
                        wrap.appendChild(theoryBlock);
                        setTimeout(() => MQ.math(theoryBlock), 100);
                    } else {
                        wrap.appendChild(MQ.el('div', 'mq-card mq-muted', 'Теория ещё не добавлена.'));
                    }

                    if (tasks.length) {
                        const listHeader = MQ.el('div', 'mq-row mq-row--wrap',
                            '<h3 style="margin:0">📝 Задачи по теме</h3>' +
                            '<span class="mq-chip">' + tasks.length + ' задач</span>');
                        wrap.appendChild(listHeader);
                        const list = MQ.el('div', 'mq-stack');
                        tasks.forEach(t => {
                            list.appendChild(taskListItem(t, solvedIds));
                        });
                        wrap.appendChild(list);
                    } else {
                        wrap.appendChild(MQ.empty('Задач по этой теме пока нет', 'book'));
                        if (isT) {
                            const addHint = MQ.el('button', 'mq-btn mq-btn--primary mq-btn--sm',
                                MQ.icon('plus', { size: 16 }) + 'Добавить первую задачу');
                            addHint.onclick = () => MQ.taskDialog({ section: selectedTheme, grade: theme
                                    .grade || null });
                            wrap.appendChild(addHint);
                        }
                    }
                    return wrap;
                }

                const themes = getAllThemes();
                const themeKeys = Object.keys(themes);
                const activeGrade = String(params.grade || '5');
                const wrap = MQ.el('div', 'mq-stack mq-anim-in');

                const head = MQ.el('div', 'mq-row mq-row--wrap',
                    '<div><h2 style="margin:0">📚 Темы и задачи</h2>' +
                    '<p class="mq-muted" style="margin:2px 0 0;font-size:14px">темы распределены по классам</p></div>');
                if (isT) {
                    const add = MQ.el('button', 'mq-btn mq-btn--primary', MQ.icon('plus', { size: 17 }) + 'Создать тему');
                    add.onclick = () => themeDialog(null);
                    head.appendChild(add);
                }
                wrap.appendChild(head);

                const gradeTabs = MQ.el('div', 'mq-row mq-row--wrap');
                [5, 6, 7, 8, 9, 10, 11].forEach(g => {
                    const b = MQ.el('button', 'mq-btn mq-btn--sm ' + (activeGrade == g ? 'mq-btn--primary' :
                        'mq-btn--ghost'), g + ' класс');
                    b.onclick = () => MQ.go('themes', { grade: String(g) });
                    gradeTabs.appendChild(b);
                });
                wrap.appendChild(gradeTabs);

                const visibleThemeKeys = themeKeys.filter(k => String(themes[k].grade || 5) === activeGrade);
                if (!visibleThemeKeys.length) {
                    wrap.appendChild(MQ.empty(isT ? 'Тем для этого класса нет — создайте первую' : 'Тем для этого класса нет',
                        'theme'));
                    return wrap;
                }

                const counts = {};
                for (const k of visibleThemeKeys) {
                    const t = await getTasksForTheme(k);
                    counts[k] = t.length;
                }

                const grid = MQ.el('div', 'mq-grid mq-grid--3');
                visibleThemeKeys.forEach(k => {
                    const theme = themes[k];
                    const count = counts[k] || 0;
                    const c = MQ.el('div', 'mq-card mq-card--hover mq-theme-card',
                        '<div class="mq-row"><span class="mq-theme-icon ' + (theme.iconClass || '') + '">' +
                        MQ.icon(theme.icon || 'ruler', { size: 28 }) + '</span>' +
                        '<div style="flex:1"><h3 style="margin:0;font-size:16.5px">' + MQ.esc(theme.title) +
                        '</h3>' +
                        '<p class="mq-muted" style="margin:2px 0 0;font-size:13px">' + count +
                        ' задач</p></div></div>' +
                        (theme.theory ? '<div class="mq-hint" style="margin-top:8px">' +
                            MQ.icon('lightbulb', { size: 14 }) + ' Есть теория</div>' : ''));
                    c.onclick = () => MQ.go('themes', { theme: k });
                    if (isT) {
                        const row = MQ.el('div', 'mq-row mq-row--wrap');
                        row.style.marginTop = '10px';
                        const del = MQ.el('button', 'mq-btn mq-btn--ghost mq-btn--sm', MQ.icon('trash', { size: 14 }));
                        del.onclick = async (e) => {
                            e.stopPropagation();
                            if (!await MQ.confirmBox('Удалить тему "' + theme.title + '" и все её задачи?'))
                                return;
                            const { data: tasks } = await MQ.sb.from('tasks').select('id').eq('section', k);
                            if (tasks && tasks.length) {
                                const ids = tasks.map(t => t.id);
                                await MQ.sb.from('tasks').delete().in('id', ids);
                            }
                            const stored = JSON.parse(localStorage.getItem('imath_themes') || '{}');
                            delete stored[k];
                            localStorage.setItem('imath_themes', JSON.stringify(stored));
                            delete THEMES_DATA[k];
                            MQ.toast('Тема удалена', 'ok');
                            MQ.render();
                        };
                        row.appendChild(del);
                        c.appendChild(row);
                    }
                    grid.appendChild(c);
                });
                wrap.appendChild(grid);
                return wrap;
            };

        })();
    </script>

                    '</h2>' +
                    '<p class="mq-card__sub">' + MQ.esc(C.role) + '</p></div></div>' +
                    '<p>Работаю с учениками 5–11 классов: от «ничего не понимаю» до подготовки к экзаменам. ' +
                    'Объясняю без заученных формулировок, добиваюсь, чтобы ученик сам мог рассказать решение.</p>' +
                    '<div class="mq-row mq-row--wrap" style="margin-top:14px">' +
                    '<span class="mq-chip mq-chip--ok">' + MQ.icon('check', { size: 14 }) + 'Индивидуально</span>' +
                    '<span class="mq-chip mq-chip--ok">' + MQ.icon('check', { size: 14 }) + 'Журнал для родителей</span>' +
                    '<span class="mq-chip mq-chip--ok">' + MQ.icon('check', { size: 14 }) + 'Домашка с проверкой</span>' +
                    '</div></div>'));

                // БЛОК МАКСИМА
                wrap.appendChild(MQ.el('section', 'mq-section',
                    '<div class="mq-card mq-card--pad-lg">' +
                    '<div class="mq-card__head"><span class="mq-avatar max" style="width:64px;height:64px;font-size:24px;background:linear-gradient(135deg,#0984e3,#74b9ff)">' +
                    MQ.esc(M.name.charAt(0)) + '</span><div><h2 style="margin:0 0 2px">' + MQ.esc(M.name) +
                    '</h2>' +
                    '<p class="mq-card__sub">' + MQ.esc(M.role) + '</p></div></div>' +
                    '<p>Помогаю ученикам 5–11 классов разобраться в математике раз и навсегда. ' +
                    'Специализируюсь на подготовке к ОГЭ и ЕГЭ (профиль), а также на устранении пробелов в знаниях. ' +
                    'На занятиях — никакой зубрёжки, только понимание и практика.</p>' +
                    '<div class="mq-row mq-row--wrap" style="margin-top:14px">' +
                    '<span class="mq-chip mq-chip--ok">' + MQ.icon('check', { size: 14 }) + 'Визуализация сложных тем</span>' +
                    '<span class="mq-chip mq-chip--ok">' + MQ.icon('check', { size: 14 }) + 'Онлайн-доска и конспекты</span>' +
                    '</div></div>'));

                // КАК ЭТО РАБОТАЕТ
                const how = MQ.el('section', 'mq-section',
                    '<div class="mq-section__head"><h2>Как это работает</h2></div>');
                const hg = MQ.el('div', 'mq-grid mq-grid--4');
                HOW.forEach((s, i) => hg.appendChild(MQ.el('div', 'mq-card mq-card--hover',
                    '<div class="mq-row">' + MQ.iconBadge(s.i) + '<span class="mq-chip">' + (i + 1) +
                    '</span></div>' +
                    '<h3 style="margin:12px 0 6px;font-size:16px">' + s.t + '</h3>' +
                    '<p class="mq-muted" style="margin:0;font-size:14px">' + s.d + '</p>')));
                how.appendChild(hg);
                wrap.appendChild(how);

                // ОТЗЫВЫ
                const rev = MQ.el('section', 'mq-section',
                    '<div class="mq-section__head"><h2>Отзывы</h2><p>Что говорят ученики и родители.</p></div>');
                const rg = MQ.el('div', 'mq-grid mq-grid--3');
                REVIEWS.forEach(r => {
                    let stars = '';
                    for (let i = 0; i < r.s; i++) stars += MQ.icon('star', { size: 16 });
                    rg.appendChild(MQ.el('div', 'mq-card mq-card--hover',
                        '<div class="mq-review"><div class="mq-review__stars">' + stars + '</div>' +
                        '<p class="mq-review__text">«' + MQ.esc(r.t) + '»</p>' +
                        '<div class="mq-review__who"><span class="mq-avatar" style="width:34px;height:34px;font-size:13px">' +
                        MQ.esc(r.n.charAt(0)) + '</span><span><b>' + MQ.esc(r.n) + '</b>' +
                        '<span class="mq-muted">' + MQ.esc(r.r) + '</span></span></div></div>'));
                });
                rev.appendChild(rg);
                wrap.appendChild(rev);

                // FAQ
                const faq = MQ.el('section', 'mq-section',
                    '<div class="mq-section__head"><h2>Частые вопросы</h2></div>');
                FAQ.forEach(p => faq.appendChild(MQ.el('details', 'mq-faq',
                    '<summary>' + MQ.esc(p[0]) + '</summary><div class="mq-faq__body">' + MQ.esc(p[1]) +
                    '</div>')));
                wrap.appendChild(faq);

                // CTA
                wrap.appendChild(MQ.el('section', 'mq-section',
                    '<div class="mq-cta-band"><h2>Начнём с бесплатного занятия</h2>' +
                    '<p>Познакомимся, определим уровень и составим план. Без обязательств.</p>' +
                    '<a class="mq-btn mq-btn--lg" href="' + C.telegram + '" target="_blank" rel="noopener">' +
                    MQ.icon('telegram', { size: 19 }) + 'Написать в Telegram</a></div>' +
                    '<div class="mq-contacts" style="margin-top:26px">' +
                    '<a class="mq-contact mq-contact--wa" href="' + C.whatsapp +
                    '" target="_blank" rel="noopener">' +
                    MQ.icon('whatsapp', { size: 18 }) + 'WhatsApp</a>' +
                    '<a class="mq-contact mq-contact--tg" href="' + C.telegram +
                    '" target="_blank" rel="noopener">' +
                    MQ.icon('telegram', { size: 18 }) + 'Telegram</a>' +
                    '<a class="mq-contact mq-contact--tel" href="tel:' + C.phoneRaw + '">' +
                    MQ.icon('phone', { size: 18 }) + MQ.esc(C.phone) + '</a>' +
                    '<a class="mq-contact" href="mailto:' + C.email + '">' +
                    MQ.icon('mail', { size: 18 }) + MQ.esc(C.email) + '</a></div>'));

                // ФУТЕР — без имён
                wrap.appendChild(MQ.el('footer', 'mq-footer',
                    'iMath · ' + new Date().getFullYear() +
                    '<br>Онлайн-занятия по математике, тренажёры и журнал оценок'));
                return wrap;
            };
        })();
    </script>

</body>
</html>
