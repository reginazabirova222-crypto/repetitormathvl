<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#6c5ce7">
<title>iMath — репетитор по математике</title>
<meta name="description" content="iMath: онлайн-занятия по математике, тренажёры, домашние задания, разбор ОГЭ, ЕГЭ, ВПР.">
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
/* ===== ПЕРЕМЕННЫЕ ===== */
:root{
  --brand:#6c5ce7; --brand-2:#8b7cf6; --brand-dark:#4b3fc0;
  --ok:#00b894; --warn:#fdcb6e; --err:#e17055; --info:#0984e3;
  --bg:#f4f5fb; --surface:#fff; --surface-2:#fafbff;
  --text:#1c1f33; --muted:#6b7192; --line:#e6e8f5;
  --r-sm:10px; --r:16px; --r-lg:24px; --r-full:999px;
  --sh-1:0 1px 2px rgba(28,31,51,.06),0 2px 8px rgba(28,31,51,.05);
  --sh-2:0 4px 14px rgba(28,31,51,.09);
  --sh-3:0 14px 40px rgba(76,63,192,.18);
  --grad:linear-gradient(135deg,#6c5ce7,#8b7cf6 55%,#a78bfa);
  --grad-warm:linear-gradient(135deg,#fdcb6e,#e17055);
  --ease:cubic-bezier(.4,0,.2,1);
  --nav-h:64px; --safe-b:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#12141f; --surface:#1b1e2d; --surface-2:#222639;
    --text:#eef0fa; --muted:#9aa0c0; --line:#2b3049;
    --sh-1:0 1px 2px rgba(0,0,0,.4); --sh-2:0 4px 16px rgba(0,0,0,.45);
  }
}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;font:400 16px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,sans-serif;
  background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased;overscroll-behavior-y:none}
h1,h2,h3,h4{margin:0 0 .4em;line-height:1.22;font-weight:700;letter-spacing:-.01em}
h1{font-size:clamp(28px,5vw,44px)} h2{font-size:clamp(22px,3.4vw,30px)} h3{font-size:19px}
p{margin:0 0 .8em}
a{color:var(--brand);text-decoration:none} a:hover{text-decoration:underline}
img{max-width:100%;display:block}
button,input,textarea,select{font:inherit;color:inherit}
:focus-visible{outline:2.5px solid var(--brand);outline-offset:2px;border-radius:6px}
.mq-wrap{width:100%;max-width:1120px;margin:0 auto;padding:0 16px}
.mq-hide{display:none!important}
.mq-muted{color:var(--muted)}
.mq-center{text-align:center}
.mq-row{display:flex;align-items:center;gap:10px}
.mq-row--wrap{flex-wrap:wrap}
.mq-spacer{flex:1}
.mq-stack{display:flex;flex-direction:column;gap:12px}
.mq-grid{display:grid;gap:16px}
.mq-grid--2{grid-template-columns:repeat(auto-fit,minmax(280px,1fr))}
.mq-grid--3{grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.mq-grid--4{grid-template-columns:repeat(auto-fill,minmax(170px,1fr))}
/* ===== ИКОНКИ ===== */
.mq-ic{flex:0 0 auto;vertical-align:-.18em}
.mq-ic-badge{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;
  background:color-mix(in srgb,var(--brand) 14%,transparent);color:var(--brand);flex:0 0 auto}
.mq-ic-badge--ok{background:color-mix(in srgb,var(--ok) 15%,transparent);color:var(--ok)}
.mq-ic-badge--warn{background:color-mix(in srgb,var(--warn) 22%,transparent);color:#b8860b}
.mq-ic-badge--err{background:color-mix(in srgb,var(--err) 15%,transparent);color:var(--err)}
.mq-ic-badge--info{background:color-mix(in srgb,var(--info) 14%,transparent);color:var(--info)}
/* ===== КНОПКИ ===== */
.mq-btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;
  padding:11px 18px;border:1px solid transparent;border-radius:var(--r-full);
  background:var(--surface-2);color:var(--text);font-weight:600;font-size:15px;cursor:pointer;
  transition:transform .16s var(--ease),box-shadow .16s var(--ease);
  -webkit-tap-highlight-color:transparent;user-select:none}
.mq-btn:hover{transform:translateY(-1px);box-shadow:var(--sh-2);text-decoration:none}
.mq-btn:active{transform:translateY(0) scale(.985)}
.mq-btn:disabled{opacity:.5;cursor:not-allowed;transform:none;box-shadow:none}
.mq-btn--primary{background:var(--grad);color:#fff;box-shadow:0 6px 18px rgba(108,92,231,.32)}
.mq-btn--ok{background:var(--ok);color:#fff}
.mq-btn--danger{background:var(--err);color:#fff}
.mq-btn--ghost{background:transparent;border-color:var(--line);color:var(--muted)}
.mq-btn--ghost:hover{border-color:var(--brand);color:var(--brand)}
.mq-btn--lg{padding:15px 30px;font-size:17px}
.mq-btn--sm{padding:7px 13px;font-size:13.5px}
.mq-btn--icon{padding:9px;border-radius:12px}
.mq-btn--block{width:100%}
/* ===== КАРТОЧКИ ===== */
.mq-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);
  padding:18px;box-shadow:var(--sh-1);transition:box-shadow .2s var(--ease),transform .2s var(--ease)}
.mq-card--hover:hover{transform:translateY(-3px);box-shadow:var(--sh-2)}
.mq-card--pad-lg{padding:26px}
.mq-card__head{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.mq-card__title{font-size:17px;font-weight:700;margin:0}
.mq-card__sub{font-size:13.5px;color:var(--muted);margin:2px 0 0}
.mq-chip{display:inline-flex;align-items:center;gap:6px;padding:5px 11px;border-radius:var(--r-full);
  background:var(--surface-2);border:1px solid var(--line);font-size:13px;font-weight:600;color:var(--muted)}
.mq-chip--brand{background:color-mix(in srgb,var(--brand) 12%,transparent);color:var(--brand);border-color:transparent}
.mq-chip--ok{background:color-mix(in srgb,var(--ok) 14%,transparent);color:var(--ok);border-color:transparent}
.mq-chip--warn{background:color-mix(in srgb,var(--warn) 24%,transparent);color:#9a6b00;border-color:transparent}
.mq-chip--err{background:color-mix(in srgb,var(--err) 14%,transparent);color:var(--err);border-color:transparent}
.mq-chip--info{background:color-mix(in srgb,var(--info) 13%,transparent);color:var(--info);border-color:transparent}
.mq-badge-dot{min-width:20px;height:20px;padding:0 6px;border-radius:var(--r-full);background:var(--err);
  color:#fff;font-size:12px;font-weight:700;display:inline-grid;place-items:center}
/* ===== ФОРМЫ ===== */
.mq-field{display:flex;flex-direction:column;gap:6px}
.mq-label{font-size:13.5px;font-weight:600;color:var(--muted)}
.mq-input,.mq-textarea,.mq-select{width:100%;padding:12px 14px;border:1.5px solid var(--line);
  border-radius:var(--r-sm);background:var(--surface);font-size:16px;
  transition:border-color .16s,box-shadow .16s}
.mq-input:focus,.mq-textarea:focus,.mq-select:focus{outline:none;border-color:var(--brand);
  box-shadow:0 0 0 4px color-mix(in srgb,var(--brand) 15%,transparent)}
.mq-textarea{min-height:96px;resize:vertical}
.mq-hint{font-size:12.5px;color:var(--muted)}
/* ===== СКЕЛЕТОНЫ ===== */
.mq-skel{border-radius:var(--r-sm);background:linear-gradient(90deg,var(--line) 25%,var(--surface-2) 50%,var(--line) 75%);
  background-size:200% 100%;animation:mq-shine 1.3s infinite linear}
.mq-skel--line{height:14px;margin:8px 0}
.mq-skel--card{height:96px}
@keyframes mq-shine{0%{background-position:200% 0}100%{background-position:-200% 0}}
.mq-empty{padding:36px 20px;text-align:center;color:var(--muted)}
.mq-empty .mq-ic{opacity:.45;margin-bottom:10px}
/* ===== ШАПКА ===== */
.mq-header{position:sticky;top:0;z-index:40;background:color-mix(in srgb,var(--surface) 88%,transparent);
  backdrop-filter:saturate(180%) blur(14px);-webkit-backdrop-filter:saturate(180%) blur(14px);
  border-bottom:1px solid var(--line)}
.mq-header__in{display:flex;align-items:center;gap:12px;height:var(--nav-h);max-width:1120px;margin:0 auto;padding:0 16px}
.mq-logo{display:flex;align-items:center;gap:9px;font-weight:800;font-size:19px;letter-spacing:-.02em;color:var(--text)}
.mq-logo:hover{text-decoration:none}
.mq-logo__mark{width:34px;height:34px;border-radius:11px;background:var(--grad);color:#fff;
  display:grid;place-items:center;box-shadow:0 4px 12px rgba(108,92,231,.4);flex:0 0 auto}
.mq-logo__mark span{font-size:17px;font-weight:800;line-height:1}
.mq-logo b{color:var(--brand)}
.mq-header__pts{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:var(--r-full);
  background:var(--grad-warm);color:#4a2e00;font-weight:700;font-size:14px}
.mq-avatar{width:36px;height:36px;border-radius:50%;flex:0 0 auto;background:var(--grad);color:#fff;
  display:grid;place-items:center;font-weight:700;font-size:14px;border:2px solid var(--surface);
  box-shadow:var(--sh-1);cursor:pointer}
/* ===== НАВИГАЦИЯ ===== */
.mq-nav{position:fixed;left:0;right:0;bottom:0;z-index:45;display:grid;grid-auto-flow:column;
  grid-auto-columns:1fr;background:color-mix(in srgb,var(--surface) 94%,transparent);
  backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  border-top:1px solid var(--line);padding-bottom:var(--safe-b)}
.mq-nav__item{position:relative;display:flex;flex-direction:column;align-items:center;gap:3px;
  padding:9px 4px 8px;border:0;background:none;color:var(--muted);font-size:11px;font-weight:600;
  cursor:pointer;transition:color .18s var(--ease)}
.mq-nav__item.is-active{color:var(--brand)}
.mq-nav__item.is-active .mq-ic{transform:translateY(-2px) scale(1.08)}
.mq-nav__item .mq-ic{transition:transform .22s var(--ease)}
.mq-nav__item::after{content:'';position:absolute;top:0;left:50%;transform:translateX(-50%) scaleX(0);
  width:26px;height:3px;border-radius:0 0 4px 4px;background:var(--brand);transition:transform .22s var(--ease)}
.mq-nav__item.is-active::after{transform:translateX(-50%) scaleX(1)}
.mq-nav__dot{position:absolute;top:5px;right:calc(50% - 20px)}
.mq-main{padding:20px 0 calc(var(--nav-h) + 26px + var(--safe-b))}
@media(min-width:860px){
  .mq-nav{position:sticky;top:var(--nav-h);bottom:auto;border-top:0;border-bottom:1px solid var(--line);
    max-width:1120px;margin:0 auto;padding:0}
  .mq-nav__item{flex-direction:row;gap:8px;font-size:14px;padding:13px 8px}
  .mq-main{padding-bottom:48px}
}
/* ===== ТОСТЫ ===== */
.mq-toasts{position:fixed;z-index:90;left:50%;transform:translateX(-50%);
  bottom:calc(var(--nav-h) + 18px + var(--safe-b));display:flex;flex-direction:column-reverse;gap:9px;
  width:min(420px,calc(100vw - 28px));pointer-events:none}
@media(min-width:860px){.mq-toasts{bottom:22px;left:auto;right:22px;transform:none}}
.mq-toast{display:flex;align-items:center;gap:10px;padding:12px 16px;border-radius:14px;
  background:var(--surface);border:1px solid var(--line);box-shadow:var(--sh-3);
  font-size:14.5px;font-weight:600;opacity:0;transform:translateY(14px) scale(.96);
  transition:opacity .24s var(--ease),transform .24s var(--ease)}
.mq-toast.is-in{opacity:1;transform:none}
.mq-toast--ok{border-left:4px solid var(--ok);color:var(--ok)}
.mq-toast--err{border-left:4px solid var(--err);color:var(--err)}
.mq-toast--warn{border-left:4px solid var(--warn);color:#9a6b00}
.mq-toast--info{border-left:4px solid var(--info);color:var(--info)}
.mq-toast span{color:var(--text);font-weight:500}
/* ===== МОДАЛКИ ===== */
.mq-modal-back{position:fixed;inset:0;z-index:95;display:grid;place-items:center;padding:18px;
  background:rgba(18,20,31,.5);backdrop-filter:blur(5px);opacity:0;
  transition:opacity .22s var(--ease);overflow-y:auto}
.mq-modal-back.is-in{opacity:1}
.mq-modal{position:relative;width:min(520px,100%);background:var(--surface);border-radius:var(--r-lg);
  padding:26px 24px 22px;box-shadow:var(--sh-3);transform:translateY(18px) scale(.97);
  transition:transform .26s var(--ease);max-height:calc(100vh - 36px);overflow-y:auto}
.mq-modal-back.is-in .mq-modal{transform:none}
.mq-modal__x{position:absolute;top:12px;right:12px;width:34px;height:34px;border:0;border-radius:11px;
  background:var(--surface-2);color:var(--muted);cursor:pointer;display:grid;place-items:center}
.mq-modal__t{margin:0 30px .5em 0;font-size:20px}
.mq-modal__p{color:var(--muted);margin:0 0 16px;font-size:15px}
.mq-modal__in{width:100%;padding:12px 14px;border:1.5px solid var(--line);border-radius:var(--r-sm);
  background:var(--surface-2);margin-bottom:16px;font-size:16px}
.mq-modal__in:focus{outline:none;border-color:var(--brand)}
.mq-modal__row{display:flex;gap:10px;justify-content:flex-end;margin-top:16px}
.mq-modal__row .mq-btn{flex:1}
@media(min-width:520px){.mq-modal__row .mq-btn{flex:0 0 auto;min-width:118px}}
/* ===== КОНФЕТТИ ===== */
.mq-confetti{position:fixed;inset:0;z-index:98;pointer-events:none;overflow:hidden}
.mq-confetti i{position:absolute;top:-14px;left:var(--x);width:9px;height:9px;border-radius:2px;
  animation:mq-fall calc(1.1s + var(--d)) var(--ease) forwards}
@keyframes mq-fall{0%{opacity:1;transform:translateY(0) rotate(0)}
  100%{opacity:0;transform:translateY(105vh) rotate(var(--r))}}
.mq-points-pop{position:absolute;z-index:97;pointer-events:none;display:inline-flex;align-items:center;
  gap:5px;padding:6px 13px;border-radius:var(--r-full);background:var(--grad-warm);color:#4a2e00;
  font-weight:800;font-size:15px;box-shadow:var(--sh-2);animation:mq-rise 1.4s var(--ease) forwards}
@keyframes mq-rise{0%{opacity:0;transform:translate(-50%,0) scale(.7)}
  22%{opacity:1;transform:translate(-50%,-14px) scale(1.1)}
  70%{opacity:1;transform:translate(-50%,-42px) scale(1)}
  100%{opacity:0;transform:translate(-50%,-64px) scale(.92)}}
@keyframes mq-in{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes mq-pop{0%{transform:scale(.9)}55%{transform:scale(1.04)}100%{transform:scale(1)}}
@keyframes mq-spin{to{transform:rotate(360deg)}}
.mq-anim-in{animation:mq-in .34s var(--ease) both}
.mq-pop{animation:mq-pop .3s var(--ease)}
.mq-spin{animation:mq-spin .9s linear infinite}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;
  animation-iteration-count:1!important;transition-duration:.01ms!important}}
/* ===== ЦЕЛЬ ДНЯ ===== */
.mq-goal{display:flex;align-items:center;gap:16px}
.mq-goal__ring{--p:0;width:76px;height:76px;border-radius:50%;flex:0 0 auto;display:grid;place-items:center;
  background:conic-gradient(var(--brand) calc(var(--p)*1%),var(--line) 0);transition:background .6s var(--ease)}
.mq-goal__ring::before{content:'';position:absolute;width:60px;height:60px;border-radius:50%;background:var(--surface)}
.mq-goal__ring>b{position:relative;font-size:17px;font-weight:800}
.mq-goal__ring.is-done{background:conic-gradient(var(--ok) 100%,var(--ok) 0)}
/* ===== ЧАТ ===== */
.mq-chat{display:grid;gap:0;height:calc(100vh - var(--nav-h) - 90px);min-height:420px}
@media(min-width:860px){.mq-chat{grid-template-columns:290px 1fr;border:1px solid var(--line);
  border-radius:var(--r-lg);overflow:hidden;background:var(--surface)}}
.mq-chat__list{border-right:1px solid var(--line);overflow-y:auto;background:var(--surface)}
.mq-chat__peer{display:flex;align-items:center;gap:11px;padding:12px 14px;border:0;width:100%;
  background:none;cursor:pointer;text-align:left;border-bottom:1px solid var(--line);transition:background .16s}
.mq-chat__peer:hover{background:var(--surface-2)}
.mq-chat__peer.is-active{background:color-mix(in srgb,var(--brand) 9%,transparent)}
.mq-chat__peer-body{flex:1;min-width:0}
.mq-chat__peer-name{display:block;font-weight:700;font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mq-chat__peer-last{display:block;font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mq-chat__pane{display:flex;flex-direction:column;min-width:0;background:var(--surface-2)}
.mq-chat__head{display:flex;align-items:center;gap:11px;padding:11px 14px;border-bottom:1px solid var(--line);
  background:var(--surface);flex:0 0 auto}
.mq-chat__body{flex:1;overflow-y:auto;padding:16px 14px;display:flex;flex-direction:column;gap:9px}
.mq-msg{max-width:76%;padding:10px 14px;border-radius:18px;font-size:15px;line-height:1.45;
  animation:mq-in .24s var(--ease) both;word-wrap:break-word}
.mq-msg--in{align-self:flex-start;background:var(--surface);border:1px solid var(--line);border-bottom-left-radius:6px}
.mq-msg--out{align-self:flex-end;background:var(--grad);color:#fff;border-bottom-right-radius:6px}
.mq-msg__meta{display:flex;align-items:center;gap:5px;justify-content:flex-end;margin-top:4px;font-size:11.5px;opacity:.75}
.mq-msg--out .mq-msg__meta .mq-ic{color:#fff}
.mq-msg__read .mq-ic{color:#7ee7c7!important}
.mq-msg__files{display:flex;flex-direction:column;gap:5px;margin-top:7px}
.mq-msg__file{display:flex;align-items:center;gap:7px;padding:7px 10px;border-radius:10px;border:0;
  background:rgba(255,255,255,.18);font-size:13px;font-weight:600;color:inherit;cursor:pointer;text-align:left}
.mq-msg--in .mq-msg__file{background:var(--surface-2);color:var(--brand)}
.mq-chat__day{align-self:center;font-size:12px;color:var(--muted);padding:3px 12px;
  border-radius:var(--r-full);background:var(--surface)}
.mq-chat__foot{display:flex;align-items:flex-end;gap:8px;padding:10px 12px calc(10px + var(--safe-b));
  border-top:1px solid var(--line);background:var(--surface);flex:0 0 auto}
.mq-chat__input{flex:1;min-height:44px;max-height:130px;padding:11px 15px;border:1.5px solid var(--line);
  border-radius:22px;background:var(--surface-2);resize:none;font-size:16px}
.mq-chat__input:focus{outline:none;border-color:var(--brand)}
.mq-chat__send{width:44px;height:44px;border-radius:50%;border:0;background:var(--grad);color:#fff;
  display:grid;place-items:center;cursor:pointer;flex:0 0 auto}
.mq-chat__send:disabled{opacity:.45;cursor:not-allowed}
/* ===== ДОМАШКА / ФАЙЛЫ ===== */
.mq-hw{border-left:4px solid var(--line)}
.mq-hw--open{border-left-color:var(--warn)}
.mq-hw--submitted{border-left-color:var(--info)}
.mq-hw--graded{border-left-color:var(--ok)}
.mq-hw__due{display:inline-flex;align-items:center;gap:5px;font-size:13px;color:var(--muted)}
.mq-hw__due.is-late{color:var(--err);font-weight:700}
.mq-drop{border:2px dashed var(--line);border-radius:var(--r);padding:22px 16px;text-align:center;
  color:var(--muted);cursor:pointer;transition:border-color .18s,background .18s}
.mq-drop:hover,.mq-drop.is-over{border-color:var(--brand);
  background:color-mix(in srgb,var(--brand) 6%,transparent);color:var(--brand)}
.mq-drop input{display:none}
.mq-files{display:flex;flex-direction:column;gap:7px;margin-top:11px}
.mq-file{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:var(--r-sm);
  background:var(--surface-2);border:1px solid var(--line);font-size:14px;animation:mq-in .22s var(--ease) both}
.mq-file__name{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600}
.mq-file__size{font-size:12px;color:var(--muted);flex:0 0 auto}
.mq-file__x{border:0;background:none;color:var(--muted);cursor:pointer;padding:4px;border-radius:8px;
  display:grid;place-items:center;flex:0 0 auto}
.mq-file__x:hover{background:color-mix(in srgb,var(--err) 14%,transparent);color:var(--err)}
/* ===== ТРЕНАЖЁРЫ ===== */
.mq-game{position:relative;overflow:hidden;padding:18px;border-radius:var(--r);cursor:pointer;
  background:var(--surface);border:1px solid var(--line);box-shadow:var(--sh-1);

.mq-game--algebra::before{background:linear-gradient(90deg,#00b894,#55efc4)}
.mq-game--logic::before{background:linear-gradient(90deg,#e84393,#fd79a8)}
.mq-game--vpr::before{background:var(--grad-warm)}
.mq-game__title{font-weight:700;font-size:15.5px;margin:10px 0 3px}
.mq-game__meta{display:flex;align-items:center;gap:9px;font-size:12.5px;color:var(--muted);margin-top:9px}
.mq-game__free{color:var(--ok);font-weight:700}
.mq-drill{max-width:620px;margin:0 auto}

.mq-drill__opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:11px}
.mq-drill__opt{padding:17px 12px;border-radius:var(--r);border:2px solid var(--line);background:var(--surface);
  font-size:19px;font-weight:700;cursor:pointer;transition:all .16s var(--ease)}
.mq-drill__opt:hover{border-color:var(--brand);transform:translateY(-2px)}
.mq-drill__opt.is-right{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 13%,transparent);color:var(--ok)}
.mq-drill__opt.is-wrong{border-color:var(--err);background:color-mix(in srgb,var(--err) 13%,transparent);color:var(--err)}
.mq-progress{height:8px;border-radius:4px;background:var(--line);overflow:hidden}
.mq-progress>i{display:block;height:100%;background:var(--grad);width:0;transition:width .35s var(--ease)}
.mq-mini{max-width:440px;margin:auto}.mq-mini-board{--cols:4;display:grid;grid-template-columns:repeat(var(--cols),1fr);gap:5px;margin:14px auto;max-width:400px}.mq-mini-cell{aspect-ratio:1;border:1px solid var(--line);border-radius:9px;background:var(--surface-2);display:grid;place-items:center;font-weight:800;font-size:20px;min-width:0;text-align:center}.mq-mini-cell.is-selected{outline:3px solid var(--brand)}.mq-mini-board--8{gap:2px}.mq-mini-board--8 .mq-mini-cell{border-radius:3px;font-size:clamp(16px,5vw,25px)}.mq-mini-question{font-size:14px;padding:4px}.mq-mini-question input{width:90%;border:0;border-bottom:1px solid var(--brand);background:transparent;text-align:center}.mq-mini-controls{display:flex;justify-content:center;gap:8px;margin-top:12px}.mq-mini-controls button{width:48px;height:42px;border:1px solid var(--line);border-radius:9px;background:var(--surface);font-size:20px}.mq-tetris{display:grid;grid-template-columns:repeat(10,18px);gap:2px;justify-content:center}.mq-tetris i{width:18px;height:18px;background:var(--line);border-radius:3px}.mq-tetris i.on{background:var(--brand)}

<script>
/* =====================================================================
   B0 — КОНФИГ И ЯДРО
   ===================================================================== */
window.MQ = window.MQ || {};
MQ.CFG = {
  SUPABASE_URL: 'https://wwyxvfpqhptsryaaaefo.supabase.co',
  SUPABASE_KEY: 'sb_publishable_2yTQm5JjVI4S0cM59eZg6w_o6mKOont',
  BUCKETS: { hw:'homework', chat:'chat', avatars:'avatars', shop:'shop', tasks:'tasks', exams:'exams' }
};
MQ.sb = null; MQ.user = null; MQ.profile = null; MQ.route = 'home'; MQ.params = {};

MQ.initSupabase = function(){
  if (MQ.sb) return MQ.sb;
  if (!MQ.CFG.SUPABASE_URL.startsWith('https://') || MQ.CFG.SUPABASE_KEY.length < 20){
    MQ.sbError = 'Не заданы SUPABASE_URL / SUPABASE_KEY'; return null;
  }
  MQ.sb = window.supabase.createClient(MQ.CFG.SUPABASE_URL, MQ.CFG.SUPABASE_KEY, {
    auth:{ persistSession:true, autoRefreshToken:true, detectSessionInUrl:true }
  });
  return MQ.sb;
};
MQ.$  = (s,r) => (r || document).querySelector(s);
MQ.$$ = (s,r) => Array.from((r || document).querySelectorAll(s));
MQ.el = function(tag, cls, html){
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (html != null) e.innerHTML = html;
  return e;
};
MQ.esc = s => String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;')
  .replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
MQ.human = b => {
  if (b == null) return '';
  const u = ['Б','КБ','МБ','ГБ']; let i = 0, n = Number(b);
  while (n >= 1024 && i < u.length - 1){ n /= 1024; i++; }
  return (i ? n.toFixed(1) : n) + ' ' + u[i];
};
MQ.debounce = (fn, ms) => { let t; return function(){ const a = arguments;
  clearTimeout(t); t = setTimeout(() => fn.apply(null,a), ms || 300); }; };
MQ.math = function(root){
  if (!window.renderMathInElement) return;
  try{
    window.renderMathInElement(root || MQ.$('#mqView'), { delimiters:[
      {left:'\\(',right:'\\)',display:false},
      {left:'\\[',right:'\\]',display:true},
      {left:'$$',right:'$$',display:true}], throwOnError:false });
  }catch(e){}
};
MQ.empty = function(text, iconName){
  const t = MQ.$('#tplEmpty').content.cloneNode(true);
  t.querySelector('[data-text]').textContent = text || 'Пока пусто';
  t.querySelector('[data-icon]').innerHTML = MQ.icon(iconName || 'sparkle',{size:40,w:1.4});
  const box = MQ.el('div'); box.appendChild(t); return box;
};
MQ.skeleton = function(n){
  const box = MQ.el('div','mq-stack');
  for (let i = 0; i < (n || 3); i++) box.appendChild(MQ.el('div','mq-card',
    '<div class="mq-skel mq-skel--line" style="width:38%"></div>' +
    '<div class="mq-skel mq-skel--line" style="width:80%"></div>' +
    '<div class="mq-skel mq-skel--line" style="width:56%"></div>'));
  return box;
};
MQ.rpc = async function(name, args){
  if (!MQ.sb) return { data:null, error:{ message:'Supabase не инициализирован' } };
  const res = await MQ.sb.rpc(name, args || {});
  if (res.error) console.warn('[rpc:' + name + ']', res.error.message);
  return res;
};
MQ.fileUrl = async function(bucket, path){
  const { data, error } = await MQ.sb.storage.from(bucket).createSignedUrl(path, 3600);
  if (error){ MQ.toast('Ссылка недоступна','err'); return null; }
  return data.signedUrl;
};
MQ.pubUrl = (bucket, path) => path
  ? MQ.sb.storage.from(bucket).getPublicUrl(path).data.publicUrl : '';

MQ.boot = [];
MQ.onReady = fn => MQ.boot.push(fn);
MQ.start = async function(){
  MQ.initSupabase();
  for (const fn of MQ.boot){ try{ await fn(); }catch(e){ console.error('[boot]', e); } }
};
document.addEventListener('DOMContentLoaded', () => {
  if (MQ.sbError) console.warn('[iMath]', MQ.sbError);
  MQ.start();
});
</script>

function icon(name, opt){
  const o = opt || {};
  const body = ICONS[name] || ICONS.sparkle;

  return '<svg class="mq-ic' + (o.cls ? ' ' + o.cls : '') + '" viewBox="0 0 24 24" width="' + s +
    '" height="' + s + '" fill="' + (FILLED[name] ? 'currentColor' : 'none') +
    '" stroke="currentColor" stroke-width="' + (o.w || 1.7) +
    '" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + body + '</svg>';
}
const iconBadge = (name, kind, size) =>

let toastBox = null;
function toast(text, type, ms){
  if (!toastBox || !document.body.contains(toastBox)){
    toastBox = MQ.el('div','mq-toasts'); document.body.appendChild(toastBox);
  }
  const k = type || 'info';
  const ic = k === 'ok' ? 'check' : k === 'err' ? 'close' : k === 'warn' ? 'bell' : 'sparkle';
  const t = MQ.el('div','mq-toast mq-toast--' + k, icon(ic,{size:18}) + '<span>' + MQ.esc(text) + '</span>');
  toastBox.appendChild(t);
  requestAnimationFrame(() => t.classList.add('is-in'));
  setTimeout(() => { t.classList.remove('is-in'); setTimeout(() => t.remove(), 280); }, ms || 3200);
}

function modal(cfg){
  const c = cfg || {};
  return new Promise(resolve => {
    const isPrompt = c.type === 'prompt', isConfirm = c.type === 'confirm' || isPrompt;
    const back = MQ.el('div','mq-modal-back');
    back.innerHTML = '<div class="mq-modal" role="dialog" aria-modal="true">' +
      '<button class="mq-modal__x" type="button" aria-label="Закрыть">' + icon('close',{size:18}) + '</button>' +
      (c.title ? '<h3 class="mq-modal__t">' + MQ.esc(c.title) + '</h3>' : '') +
      (c.text ? '<p class="mq-modal__p" style="white-space:pre-wrap">' + MQ.esc(c.text) + '</p>' : '') +
      (isPrompt ? '<input class="mq-modal__in" type="' + (c.inputType || 'text') + '" value="' +
        MQ.esc(c.value || '') + '" placeholder="' + MQ.esc(c.placeholder || '') + '">' : '') +
      '<div class="mq-modal__row">' +
        (isConfirm ? '<button class="mq-btn mq-btn--ghost" type="button" data-no>' +
          MQ.esc(c.cancelText || 'Отмена') + '</button>' : '') +
        '<button class="mq-btn mq-btn--primary" type="button" data-yes>' +
          MQ.esc(c.okText || 'Ок') + '</button></div></div>';
    document.body.appendChild(back);
    requestAnimationFrame(() => back.classList.add('is-in'));
    const input = back.querySelector('.mq-modal__in');
    if (input) setTimeout(() => input.focus(), 70);
    const no = isPrompt ? null : false;
    function done(v){
      back.classList.remove('is-in');
      document.removeEventListener('keydown', onKey);
      setTimeout(() => back.remove(), 240);
      resolve(v);
    }
    function onKey(e){
      if (e.key === 'Escape') done(no);
      if (e.key === 'Enter' && input){ e.preventDefault(); done(input.value.trim()); }
    }
    back.querySelector('[data-yes]').onclick = () => done(isPrompt ? input.value.trim() : true);
    const cn = back.querySelector('[data-no]'); if (cn) cn.onclick = () => done(no);
    back.querySelector('.mq-modal__x').onclick = () => done(no);
    back.onclick = e => { if (e.target === back) done(no); };
    document.addEventListener('keydown', onKey);
  });
}

/* модалка с произвольным узлом внутри */
MQ.modalNode = function(title, node, okText, onOk){
  const back = MQ.el('div','mq-modal-back');
  back.innerHTML = '<div class="mq-modal"><button class="mq-modal__x" type="button">' +
    icon('close',{size:18}) + '</button><h3 class="mq-modal__t">' + MQ.esc(title) + '</h3>' +
    '<div data-slot></div><div class="mq-modal__row">' +
    '<button class="mq-btn mq-btn--ghost" data-no>Отмена</button>' +
    '<button class="mq-btn mq-btn--primary" data-yes>' + MQ.esc(okText) + '</button></div></div>';
  back.querySelector('[data-slot]').appendChild(node);
  document.body.appendChild(back);
  requestAnimationFrame(() => back.classList.add('is-in'));
  const close = () => { back.classList.remove('is-in'); setTimeout(() => back.remove(), 240); };
  back.querySelector('[data-no]').onclick = close;
  back.querySelector('.mq-modal__x').onclick = close;
  back.querySelector('[data-yes]').onclick = function(){ onOk(this, close); };
  return close;
};

function confetti(n){
  const colors = ['#6c5ce7','#00b894','#fdcb6e','#e17055','#0984e3','#e84393'];
  const box = MQ.el('div','mq-confetti');
  let h = '';
  for (let i = 0; i < (n || 44); i++)
    h += '<i style="--x:' + (Math.random()*100).toFixed(1) + '%;--d:' +
      (0.5 + Math.random()*0.8).toFixed(2) + 's;--r:' + Math.round(Math.random()*720) +
      'deg;background:' + colors[i % colors.length] + '"></i>';
  box.innerHTML = h;
  document.body.appendChild(box);
  setTimeout(() => box.remove(), 2300);
}
function pointsPop(amount, anchor){
  const el = MQ.el('div','mq-points-pop', icon('coin',{size:16}) + '<b>+' + amount + '</b>');
  const r = anchor && anchor.getBoundingClientRect ? anchor.getBoundingClientRect()
    : { left: innerWidth/2, top: innerHeight/2, width:0 };
  el.style.left = (r.left + r.width/2) + 'px';
  el.style.top  = (r.top + window.scrollY) + 'px';
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 1450);
}

const fmtDate = d => { try{ return new Date(d).toLocaleDateString('ru-RU',{day:'numeric',month:'long'}); }catch(e){ return ''; } };
const fmtTime = d => { try{ return new Date(d).toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'}); }catch(e){ return ''; } };
const dayKey = d => { const x = new Date(d);
  return x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0')+'-'+String(x.getDate()).padStart(2,'0'); };
function dayLabel(d){
  const k = dayKey(d), t = dayKey(new Date());
  const y = new Date(); y.setDate(y.getDate()-1);
  if (k === t) return 'Сегодня';
  if (k === dayKey(y)) return 'Вчера';
  return fmtDate(d);
}

<script>

(function(){

MQ.loadSession = async function(){

};
MQ.loadProfile = async function(){

  const { error } = await MQ.sb.auth.signInWithPassword({ email, password });

      (n ? '<span class="mq-badge-dot mq-nav__dot">' + (n > 99 ? '99+' : n) + '</span>' : '');

MQ.go = function(route, params){

  if (location.hash.slice(1) !== MQ.route) history.replaceState(null,'','#' + MQ.route);

};
MQ.render = async function(){

  view.innerHTML = '';

  try{
    const node = await fn(MQ.params);
    view.innerHTML = '';
    if (node) view.appendChild(node);
    MQ.math(view);

    console.error('[view:' + MQ.route + ']', e);

MQ.views.auth = function(){

})();

  let sel = MQ.sb.from('profiles').select('id,full_name,role').neq('id', MQ.user.id).limit(30);
  if (!MQ.isTeacher()) sel = sel.in('role', ['teacher','admin']);
  if (q) sel = sel.ilike('full_name', '%' + q + '%');
  const { data } = await sel;
  return data || [];
}
async function loadMsgs(peerId){
  const { data, error } = await MQ.sb.from('messages').select('*')
    .or('and(sender_id.eq.' + MQ.user.id + ',recipient_id.eq.' + peerId + '),' +
        'and(sender_id.eq.' + peerId + ',recipient_id.eq.' + MQ.user.id + ')')
    .order('created_at',{ ascending:true }).limit(300);
  if (error){ MQ.toast('Не удалось загрузить переписку','err'); return []; }
  return data || [];
}
async function uploadFiles(files){
  const out = [];
  for (const f of files){
    const path = MQ.user.id + '/' + Date.now() + '-' + f.name.replace(/[^\w.\-]/g,'_');
    const { error } = await MQ.sb.storage.from(MQ.CFG.BUCKETS.chat).upload(path, f);
    if (error){ MQ.toast(f.name + ': ' + error.message,'err'); continue; }
    out.push({ path, name:f.name, size:f.size, type:f.type });
  }
  return out;
}

function msgNode(m){
  const out = m.sender_id === MQ.user.id;
  const n = MQ.el('div','mq-msg ' + (out ? 'mq-msg--out' : 'mq-msg--in'));
  let h = m.body ? '<div>' + MQ.esc(m.body).replace(/\n/g,'<br>') + '</div>' : '';
  const files = Array.isArray(m.attachments) ? m.attachments : [];
  if (files.length) h += '<div class="mq-msg__files">' + files.map((f,i) =>
    '<button class="mq-msg__file" type="button" data-f="' + i + '">' +
    MQ.icon((f.type||'').startsWith('image') ? 'image' : 'file',{size:15}) +
    MQ.esc(f.name || 'файл') + '</button>').join('') + '</div>';
  h += '<div class="mq-msg__meta">' + MQ.fmtTime(m.created_at) +
    (out ? (m.read_at ? '<span class="mq-msg__read">' + MQ.icon('checkDouble',{size:14}) + '</span>'
      : MQ.icon('check',{size:14})) : '') + '</div>';
  n.innerHTML = h;
  MQ.$$('[data-f]', n).forEach(b => b.onclick = async () => {
    const url = await MQ.fileUrl(MQ.CFG.BUCKETS.chat, files[+b.dataset.f].path);
    if (url) window.open(url,'_blank','noopener');
  });
  return n;
}
function paintMsgs(body){
  if (!body) return;
  body.innerHTML = '';
  if (!state.msgs.length){ body.appendChild(MQ.empty('Сообщений пока нет. Напишите первым.','chat')); return; }
  let last = '';
  state.msgs.forEach(m => {
    const k = MQ.dayKey(m.created_at);
    if (k !== last){ last = k; body.appendChild(MQ.el('div','mq-chat__day', MQ.dayLabel(m.created_at))); }
    body.appendChild(msgNode(m));
  });
  requestAnimationFrame(() => { body.scrollTop = body.scrollHeight; });
}

MQ.views.chat = async function(){
  state.files = [];
  state.partners = await loadPartners();
  if (!MQ.isTeacher()){
    const teachers = await findPeople('');
    teachers.forEach(t => {
      if (!state.partners.some(p => p.id === t.id))
        state.partners.push({ id:t.id, full_name:t.full_name, role:t.role, unread:0, last_body:null });
    });
  }
  MQ.setBadge('chat', state.partners.reduce((s,p) => s + (p.unread || 0), 0));

  const root = MQ.el('div','mq-chat mq-anim-in');
  const list = MQ.el('div','mq-chat__list');
  const pane = MQ.el('div','mq-chat__pane');
  root.appendChild(list); root.appendChild(pane);

  function paintList(items, isSearch){
    list.innerHTML = '';
    const top = MQ.el('div','', '<input class="mq-input" id="cSearch" placeholder="' +
      (MQ.isTeacher() ? 'Поиск учеников...' : 'Поиск преподавателя...') + '">');
    top.style.padding = '10px 12px';
    list.appendChild(top);
    MQ.$('#cSearch', top).oninput = MQ.debounce(async e => {
      const q = e.target.value.trim();
      paintList(q ? await findPeople(q) : state.partners, !!q);
    }, 320);
    if (!items.length){
      list.appendChild(MQ.empty(isSearch ? 'Никого не нашли' : 'Нет переписок','users'));
      return;
    }
    items.forEach(p => {
      const b = MQ.el('button','mq-chat__peer' + (state.peer && state.peer.id === p.id ? ' is-active' : ''));
      b.type = 'button';
      b.innerHTML = '<span class="mq-avatar">' + MQ.esc((p.full_name || '?').charAt(0).toUpperCase()) + '</span>' +
        '<span class="mq-chat__peer-body"><span class="mq-chat__peer-name">' +
        MQ.esc(p.full_name || 'Без имени') + '</span><span class="mq-chat__peer-last">' +
        MQ.esc(p.last_body || 'Начните диалог') + '</span></span>' +
        (p.unread ? '<span class="mq-badge-dot">' + p.unread + '</span>' : '');
      b.onclick = () => openPeer(p);
      list.appendChild(b);
    });
  }

  async function openPeer(p){
    state.peer = p;
    paintList(state.partners, false);
    pane.innerHTML =
      '<div class="mq-chat__head"><span class="mq-avatar">' +
        MQ.esc((p.full_name || '?').charAt(0).toUpperCase()) + '</span>' +
        '<div><div style="font-weight:700">' + MQ.esc(p.full_name || 'Без имени') + '</div>' +
        '<div class="mq-muted" style="font-size:12.5px">' +
        MQ.esc(MQ.ROLE_RU[p.role] || p.role || '') + '</div></div></div>' +
      '<div class="mq-chat__body" id="cBody"></div>' +
      '<div class="mq-files" id="cFiles" style="padding:0 12px"></div>' +
      '<div class="mq-chat__foot">' +
        '<button class="mq-btn mq-btn--ghost mq-btn--icon" id="cClip" title="Прикрепить">' +
        MQ.icon('paperclip',{size:19}) + '</button>' +
        '<input type="file" id="cFile" multiple hidden>' +
        '<textarea class="mq-chat__input" id="cIn" rows="1" placeholder="Сообщение..."></textarea>' +
        '<button class="mq-chat__send" id="cSend" disabled>' + MQ.icon('send',{size:19}) + '</button></div>';

    const body = MQ.$('#cBody', pane);
    body.appendChild(MQ.skeleton(2));
    state.msgs = await loadMsgs(p.id);
    paintMsgs(body);
    await MQ.rpc('mark_read',{ p_partner:p.id });
    p.unread = 0;
    MQ.setBadge('chat', state.partners.reduce((s,x) => s + (x.unread || 0), 0));
    paintList(state.partners, false);

    const input = MQ.$('#cIn', pane), send = MQ.$('#cSend', pane);
    const filesBox = MQ.$('#cFiles', pane), fileIn = MQ.$('#cFile', pane);
    function refreshFiles(){
      filesBox.innerHTML = '';
      state.files.forEach((f,i) => {
        const row = MQ.el('div','mq-file',
          MQ.icon((f.type||'').startsWith('image') ? 'image' : 'file',{size:16}) +
          '<span class="mq-file__name">' + MQ.esc(f.name) + '</span>' +
          '<span class="mq-file__size">' + MQ.human(f.size) + '</span>' +
          '<button class="mq-file__x" type="button">' + MQ.icon('close',{size:15}) + '</button>');
        row.querySelector('.mq-file__x').onclick = () => { state.files.splice(i,1); refreshFiles(); tg(); };
        filesBox.appendChild(row);
      });
    }
    function tg(){ send.disabled = !input.value.trim() && !state.files.length; }
    MQ.$('#cClip', pane).onclick = () => fileIn.click();
    fileIn.onchange = () => {
      Array.from(fileIn.files).forEach(f => {
        if (f.size > 25*1024*1024){ MQ.toast(f.name + ': больше 25 МБ','warn'); return; }
        state.files.push(f);
      });
      fileIn.value = ''; refreshFiles(); tg();
    };
    input.oninput = () => {
      input.style.height = 'auto';
      input.style.height = Math.min(input.scrollHeight,130) + 'px';
      tg();
    };
    input.onkeydown = e => {
      if (e.key === 'Enter' && !e.shiftKey && innerWidth > 860){ e.preventDefault(); send.click(); }
    };
    send.onclick = async () => {
      const text = input.value.trim();
      if (!text && !state.files.length) return;
      send.disabled = true;
      const pending = state.files.slice();
      state.files = []; refreshFiles();
      input.value = ''; input.style.height = 'auto';
      const attachments = pending.length ? await uploadFiles(pending) : [];
      const { data, error } = await MQ.sb.from('messages').insert({
        sender_id:MQ.user.id, recipient_id:p.id, body:text || null, attachments
      }).select().single();
      if (error){ MQ.toast(error.message,'err'); send.disabled = false; return; }
      if (!state.msgs.some(x => x.id === data.id)){ state.msgs.push(data); paintMsgs(MQ.$('#cBody', pane)); }
      tg();
    };
    tg();
  }

  paintList(state.partners, false);
  pane.appendChild(MQ.empty('Выберите собеседника','chat'));
  if (state.partners.length && innerWidth > 860) openPeer(state.partners[0]);

  if (state.chan){ MQ.sb.removeChannel(state.chan); state.chan = null; }
  state.chan = MQ.sb.channel('msg-' + MQ.user.id)
    .on('postgres_changes',{ event:'INSERT', schema:'public', table:'messages' }, async pl => {
      const m = pl.new;
      if (m.sender_id !== MQ.user.id && m.recipient_id !== MQ.user.id) return;
      if (state.msgs.some(x => x.id === m.id)) return;
      const pid = state.peer && state.peer.id;
      const inThread = pid && (m.sender_id === pid || m.recipient_id === pid);
      if (inThread){
        state.msgs.push(m);
        paintMsgs(MQ.$('#cBody', pane));
        if (m.recipient_id === MQ.user.id) await MQ.rpc('mark_read',{ p_partner:pid });
      } else if (m.recipient_id === MQ.user.id){
        MQ.setBadge('chat',(MQ.badges.chat || 0) + 1);
        MQ.toast('Новое сообщение','info');
      }
    })
    .on('postgres_changes',{ event:'UPDATE', schema:'public', table:'messages' }, pl => {
      const m = pl.new;
      const i = state.msgs.findIndex(x => x.id === m.id);
      if (i > -1){ state.msgs[i] = m; paintMsgs(MQ.$('#cBody', pane)); }
    })
    .subscribe();
  return root;
};

MQ.onReady(async function(){
  if (!MQ.isAuthed()) return;
  const list = await loadPartners();
  MQ.setBadge('chat', list.reduce((s,p) => s + (p.unread || 0), 0));
});
})();
</script>

<script>
/* =====================================================================
   B4 — ДОМАШНИЕ ЗАДАНИЯ: файлы от учителя и от ученика
   ===================================================================== */
(function(){
'use strict';
const MQ = window.MQ;

MQ.dropzone = function(opt){
  const o = opt || {}, files = [];
  const root = MQ.el('div');
  root.innerHTML =
    '<div class="mq-drop" tabindex="0" role="button">' + MQ.icon('upload',{size:26}) +
    '<div style="font-weight:700;margin-top:8px">' + (o.title || 'Перетащите файлы или нажмите') + '</div>' +
    '<div class="mq-hint">' + (o.hint || 'PDF, фото, документы · до 25 МБ каждый') + '</div>' +
    '<input type="file" multiple></div><div class="mq-files"></div>';
  const drop = root.querySelector('.mq-drop'), input = root.querySelector('input');
  const listBox = root.querySelector('.mq-files');
  function paint(){
    listBox.innerHTML = '';
    files.forEach((f,i) => {
      const row = MQ.el('div','mq-file',
        MQ.icon((f.type||'').startsWith('image') ? 'image' : 'file',{size:17}) +
        '<span class="mq-file__name">' + MQ.esc(f.name) + '</span>' +
        '<span class="mq-file__size">' + MQ.human(f.size) + '</span>' +
        '<button class="mq-file__x" type="button" aria-label="Убрать">' + MQ.icon('close',{size:15}) + '</button>');
      row.querySelector('.mq-file__x').onclick = () => { files.splice(i,1); paint(); };
      listBox.appendChild(row);
    });
  }
  function add(fs){
    Array.from(fs).forEach(f => {
      if (f.size > 25*1024*1024){ MQ.toast(f.name + ': больше 25 МБ','warn'); return; }
      if (files.length >= (o.max || 10)){ MQ.toast('Максимум ' + (o.max || 10) + ' файлов','warn'); return; }
      files.push(f);
    });
    paint();
  }
  drop.onclick = () => input.click();
  drop.onkeydown = e => { if (e.key === 'Enter' || e.key === ' '){ e.preventDefault(); input.click(); } };
  input.onchange = () => { add(input.files); input.value = ''; };
  ['dragenter','dragover'].forEach(ev => drop.addEventListener(ev, e => {
    e.preventDefault(); drop.classList.add('is-over'); }));
  ['dragleave','drop'].forEach(ev => drop.addEventListener(ev, e => {
    e.preventDefault(); drop.classList.remove('is-over');
    if (ev === 'drop' && e.dataTransfer) add(e.dataTransfer.files); }));
  return {
    node:root, files, clear(){ files.length = 0; paint(); },
    async upload(bucket, prefix){
      const out = [];
      for (const f of files){
        const path = (prefix || MQ.user.id) + '/' + Date.now() + '-' + f.name.replace(/[^\w.\-]/g,'_');
        const { error } = await MQ.sb.storage.from(bucket || MQ.CFG.BUCKETS.hw).upload(path, f);
        if (error){ MQ.toast(f.name + ': ' + error.message,'err'); continue; }
        out.push({ path, name:f.name, size:f.size, type:f.type });
      }
      return out;
    }
  };
};

function attachList(arr, bucket){
  const files = Array.isArray(arr) ? arr : [];
  if (!files.length) return MQ.el('div');
  const box = MQ.el('div','mq-files');
  files.forEach(f => {
    const row = MQ.el('div','mq-file',
      MQ.icon((f.type||'').startsWith('image') ? 'image' : 'file',{size:17}) +
      '<span class="mq-file__name">' + MQ.esc(f.name || 'файл') + '</span>' +
      '<button class="mq-btn mq-btn--ghost mq-btn--sm" type="button">' +
      MQ.icon('download',{size:15}) + 'Открыть</button>');
    row.querySelector('button').onclick = async () => {
      const url = await MQ.fileUrl(bucket || MQ.CFG.BUCKETS.hw, f.path);
      if (url) window.open(url,'_blank','noopener');
    };
    box.appendChild(row);
  });
  return box;
}

async function submissionPdf(files){
  if (!window.PDFLib) throw new Error('Модуль PDF не загрузился');
  const out=await PDFLib.PDFDocument.create();
  for(const f of files){
    const bytes=await f.arrayBuffer();
    if(f.type==='application/pdf'||/\.pdf$/i.test(f.name)){
      const src=await PDFLib.PDFDocument.load(bytes), pages=await out.copyPages(src,src.getPageIndices());pages.forEach(p=>out.addPage(p));
    }else if((f.type||'').startsWith('image/')){
      const img=f.type==='image/png'?await out.embedPng(bytes):await out.embedJpg(bytes), page=out.addPage([595,842]), scale=Math.min(555/img.width,802/img.height,1);page.drawImage(img,{x:(595-img.width*scale)/2,y:(842-img.height*scale)/2,width:img.width*scale,height:img.height*scale});
    }else throw new Error('Файл «'+f.name+'» нельзя преобразовать. Используйте PDF, JPG или PNG.');
  }
  return new File([await out.save()],'домашняя-работа.pdf',{type:'application/pdf'});
}

async function submitDialog(hw){
  const dz = MQ.dropzone({ title:'Прикрепите решение', hint:'PDF, JPG или PNG · всё будет объединено в один PDF', max:10 });
  const wrap = MQ.el('div','mq-stack',
    '<label class="mq-field"><span class="mq-label">Комментарий (необязательно)</span>' +
    '<textarea class="mq-textarea" id="sbCom" placeholder="Что было сложно?"></textarea></label>');
  wrap.appendChild(dz.node);
  MQ.modalNode('Сдать: ' + hw.title, wrap, 'Отправить', async (go, close) => {
    if (!dz.files.length){ MQ.toast('Прикрепите хотя бы один файл','warn'); return; }
    go.disabled = true;
    go.innerHTML = MQ.icon('refresh',{size:17,cls:'mq-spin'}) + 'Загрузка...';
    let pdf; try{ pdf=await submissionPdf(dz.files); }catch(e){ MQ.toast(e.message,'err',5000);go.disabled=false;go.textContent='Отправить';return; }
    dz.files.splice(0,dz.files.length,pdf);
    const attachments = await dz.upload(MQ.CFG.BUCKETS.hw, MQ.user.id + '/hw' + hw.id);
    const { error } = await MQ.sb.from('homework_submissions').insert({
      homework_id:hw.id, student_id:MQ.user.id,
      comment:(MQ.$('#sbCom', wrap).value || '').trim() || null, attachments });
    if (error){ MQ.toast(error.message,'err'); go.disabled = false; go.textContent = 'Отправить'; return; }
    await MQ.sb.from('homework').update({ status:'submitted' }).eq('id', hw.id);
    close(); MQ.confetti(28); MQ.toast('Работа отправлена','ok'); MQ.render();
  });
}

async function gradeSubmission(sub){
  const form = MQ.el('div','mq-stack',
    '<div class="mq-row" style="justify-content:center;gap:8px" id="gsV"></div>' +
    '<label class="mq-field"><span class="mq-label">Комментарий ученику</span>' +
    '<textarea class="mq-textarea" id="gsC" placeholder="Что получилось, над чем работать"></textarea></label>' +
    '<div class="mq-hint">Оценка попадёт в журнал автоматически.</div>');
  let picked = 5;
  const box = MQ.$('#gsV', form);
  function paint(){
    box.innerHTML = '';
    [5,4,3,2].forEach(v => {
      const b = MQ.el('button','mq-btn mq-grade ' + (picked === v ? 'mq-btn--primary' : 'mq-btn--ghost'), String(v));
      b.type = 'button';
      b.onclick = () => { picked = v; paint(); };
      box.appendChild(b);
    });
  }
  paint();
  MQ.modalNode('Проверка работы', form, 'Поставить', async (go, close) => {
    go.disabled = true;
    const { error } = await MQ.sb.from('homework_submissions').update({
      grade:picked, feedback:(MQ.$('#gsC', form).value || '').trim() || null }).eq('id', sub.id);

}

async function createDialog(){
  const { data: students } = await MQ.sb.from('profiles')
    .select('id,full_name').eq('role','student').order('full_name');
  if (!students || !students.length){ MQ.alertBox('Пока нет учеников в системе'); return; }

  });
}

function hwCard(hw, subs, asTeacher, nameOf){
  const mine = (subs || []).filter(s => s.homework_id === hw.id);
  const graded = mine.filter(s => s.grade != null)[0];
  const status = graded ? 'graded' : mine.length ? 'submitted' : 'open';
  const late = hw.due_at && status === 'open' && new Date(hw.due_at) < new Date();
  const card = MQ.el('div','mq-card mq-card--hover mq-hw mq-hw--' + status + ' mq-anim-in',
    '<div class="mq-card__head">' +
      MQ.iconBadge('note', status === 'graded' ? 'ok' : status === 'submitted' ? 'info' : 'warn') +
      '<div style="flex:1;min-width:0"><h3 class="mq-card__title">' + MQ.esc(hw.title) + '</h3>' +
      '<p class="mq-card__sub">' +
      (asTeacher && nameOf ? MQ.esc(nameOf(hw.student_id)) + ' · ' : '') +
      (hw.due_at ? '<span class="mq-hw__due' + (late ? ' is-late' : '') + '">' +
        MQ.icon('clock',{size:14}) + ' до ' + MQ.fmtDate(hw.due_at) + '</span>' : 'без дедлайна') +
      '</p></div>' +
      '<span class="mq-chip mq-chip--' + (status === 'graded' ? 'ok' : status === 'submitted' ? 'brand' : 'warn') +
      '">' + (status === 'graded' ? 'Оценка ' + graded.grade : status === 'submitted' ? 'Сдано' : 'Открыто') +
      '</span></div>' +
    (hw.description ? '<p>' + MQ.esc(hw.description).replace(/\n/g,'<br>') + '</p>' : ''));
  card.appendChild(attachList(hw.attachments));

  if (graded && graded.feedback) card.appendChild(MQ.el('div','mq-card',
    '<div class="mq-row">' + MQ.icon('lightbulb',{size:17}) + '<b>Комментарий преподавателя</b></div>' +
    '<p style="margin:8px 0 0">' + MQ.esc(graded.feedback) + '</p>'));

  if (!asTeacher && status === 'open'){
    const b = MQ.el('button','mq-btn mq-btn--primary', MQ.icon('upload',{size:17}) + 'Сдать работу');
    b.style.marginTop = '12px';
    b.onclick = () => submitDialog(hw);
    card.appendChild(b);
  }
  mine.forEach(s => {
    const box = MQ.el('div','mq-card',
      '<div class="mq-row mq-muted" style="font-size:13px">' + MQ.icon('check',{size:15}) +
      'Отправлено ' + MQ.fmtDate(s.created_at) + '</div>' +
      (s.comment ? '<p style="margin:8px 0 0">' + MQ.esc(s.comment) + '</p>' : ''));
    box.style.marginTop = '12px';
    box.appendChild(attachList(s.attachments));
    if (asTeacher){
      const g = MQ.el('button','mq-btn mq-btn--ok mq-btn--sm',
        MQ.icon('star',{size:15}) + (s.grade == null ? 'Оценить' : 'Изменить оценку'));
      g.style.marginTop = '10px';
      g.onclick = () => gradeSubmission(s);
      box.appendChild(g);
    }
    card.appendChild(box);
  });
  return card;
}

  const wrap = MQ.el('div','mq-stack');
  const head = MQ.el('div','mq-row mq-row--wrap',
    '<h2 style="margin:0">Домашние задания</h2><div class="mq-spacer"></div>');

    nameOf = id => { const u = (us || []).filter(x => x.id === id)[0];

  if (!hws || !hws.length){
    wrap.appendChild(MQ.empty(asTeacher ? 'Заданий пока нет — создайте первое' : 'Заданий нет. Отдыхайте!','note'));

  hws.forEach(h => wrap.appendChild(hwCard(h, subs, asTeacher, nameOf)));

};
})();

<script>
/* =====================================================================
   B5 — ТРЕНАЖЁРЫ (бесплатные)
   ===================================================================== */
(function(){
'use strict';
const MQ = window.MQ;
const ri = (a,b) => a + Math.floor(Math.random() * (b - a + 1));
const pick = a => a[Math.floor(Math.random() * a.length)];
const shuffle = a => a.map(v => [Math.random(),v]).sort((x,y) => x[0]-y[0]).map(p => p[1]);

const GEN = {
  add: l => { const m = 10*l, a = ri(1,m), b = ri(1,m); return { q:a + ' + ' + b, a:a+b }; },
  sub: l => { const m = 10*l; let a = ri(1,m), b = ri(1,m);
    if (b > a){ const t = a; a = b; b = t; } return { q:a + ' − ' + b, a:a-b }; },
  mul: l => { const a = ri(2,4+3*l), b = ri(2,4+3*l); return { q:a + ' × ' + b, a:a*b }; },
  div: l => { const b = ri(2,3+2*l), r = ri(2,4+3*l); return { q:(b*r) + ' ÷ ' + b, a:r }; },
  pow: l => { const a = ri(2,6+l), n = l > 2 ? 3 : 2;
    return { q:'\\(' + a + '^' + n + '\\)', a:Math.pow(a,n) }; },
  percent: l => { const p = pick([10,20,25,50]), n = ri(2,10*l)*4;
    return { q:p + '% от ' + n, a:Math.round(n*p/100) }; },
  linear: l => { const k = ri(2,3+l), x = ri(1,5+2*l), b = ri(1,10*l);
    return { q:'\\(' + k + 'x + ' + b + ' = ' + (k*x+b) + '\\), найдите \\(x\\)', a:x }; },
  linear2: l => { const x = ri(2,6+l), k = ri(2,5), b = ri(1,9);
    return { q:'\\(' + k + 'x - ' + b + ' = ' + (k*x-b) + '\\)', a:x }; },
  quad: () => { const x1 = ri(1,7), x2 = ri(1,7);
    return { q:'\\(x^2 - ' + (x1+x2) + 'x + ' + (x1*x2) + ' = 0\\), больший корень', a:Math.max(x1,x2) }; },
  square: l => { const a = ri(2,8+l); return { q:'Площадь квадрата со стороной ' + a, a:a*a }; },
  rect: l => { const a = ri(2,9+l), b = ri(2,9+l);
    return { q:'Площадь прямоугольника ' + a + ' × ' + b, a:a*b }; },
  perim: l => { const a = ri(2,9+l), b = ri(2,9+l);
    return { q:'Периметр прямоугольника ' + a + ' × ' + b, a:2*(a+b) }; },
  triangle: l => { const a = ri(2,10+l)*2, h = ri(2,8+l);
    return { q:'Площадь треугольника: основание ' + a + ', высота ' + h, a:a*h/2 }; },
  angles: () => { const a = ri(20,80), b = ri(20,150-a);
    return { q:'Два угла треугольника: ' + a + '° и ' + b + '°. Третий?', a:180-a-b }; },
  seq: l => { const s = ri(1,9), d = ri(2,3+l);
    return { q:s + ', ' + (s+d) + ', ' + (s+2*d) + ', ' + (s+3*d) + ', ... следующее?', a:s+4*d }; },
  logic: () => { const a = ri(2,9), b = ri(2,9);
    return { q:'У ' + a + ' коробок по ' + b + ' карандашей. Сколько карандашей?', a:a*b }; },
  speed: l => { const v = ri(3,8+l)*10, t = ri(2,5);
    return { q:'Скорость ' + v + ' км/ч, время ' + t + ' ч. Путь?', a:v*t }; }
};
GEN.trig = () => { const a = pick([0,30,45,60,90]); const vals={0:0,30:0.5,45:0.71,60:0.87,90:1}; return {q:'\\(\\sin '+a+'^\\circ\\)',a:vals[a]}; };
GEN.probability = l => { const all=ri(6,12+l), good=ri(1,all-1); return {q:'Из '+all+' равновозможных исходов подходят '+good+'. Вероятность (десятичной дробью)?',a:Number((good/all).toFixed(2))}; };
GEN.vpr = l => pick([GEN.percent, GEN.rect, GEN.speed, GEN.seq, GEN.add])(l);

const SECTIONS = [
  { key:'arithmetic', title:'Арифметика', icon:'sigma',
    kinds:[['add','Сложение'],['sub','Вычитание'],['mul','Умножение'],['div','Деление'],
           ['pow','Степени'],['percent','Проценты']] },
  { key:'algebra', title:'Алгебра', icon:'chart',
    kinds:[['linear','Линейные уравнения'],['linear2','Уравнения со сдвигом'],
           ['quad','Квадратные уравнения'],['seq','Последовательности'],['trig','Тригонометрия']] },
  { key:'geometry', title:'Геометрия', icon:'ruler',
    kinds:[['square','Площадь квадрата'],['rect','Площадь прямоугольника'],['perim','Периметр'],
           ['triangle','Площадь треугольника'],['angles','Углы']] },
  { key:'logic', title:'Логика и задачи', icon:'lightbulb',
    kinds:[['logic','Текстовые задачи'],['speed','Движение'],['probability','Теория вероятностей']] },
  { key:'vpr', title:'Подготовка к ВПР', icon:'target', kinds:[['vpr','Смешанный вариант']] }
];
const CATALOG = (function(){
  const out = [];
  SECTIONS.forEach(s => s.kinds.forEach(p => out.push({
    slug:s.key + '-' + p[0], section:s.key, sectionTitle:s.title, icon:s.icon,
    kind:p[0], lvl:2, title:p[1], sub:'единый режим · задания усложняются постепенно', reward:7 })));
  return out;
})();

function makeQuestion(kind, lvl){
  const item = (GEN[kind] || GEN.add)(lvl);
  const right = item.a, opts = new Set([right]);
  let guard = 0;
  while (opts.size < 4 && guard++ < 40){
    const d = ri(1, Math.max(3, Math.round(Math.abs(right)*0.25) + lvl*2));
    const c = Math.random() < .5 ? right + d : right - d;
    if (c !== right && c >= 0) opts.add(c);
  }
  while (opts.size < 4) opts.add(right + opts.size);
  return { q:item.q, a:right, opts:shuffle(Array.from(opts)) };
}

MQ.runDrill = function(game){
  const TOTAL = 10;
  let idx = 0, correct = 0, locked = false;
  const started = Date.now();
  const view = MQ.$('#mqView');
  const root = MQ.el('div','mq-drill mq-anim-in');

  async function save(corr, earned, ms){
    if (!MQ.isAuthed()) return;
    await MQ.sb.from('game_results').insert({ user_id:MQ.user.id, game_slug:game.slug,
      score:earned, correct:corr, total:TOTAL, duration_ms:ms });
    if (earned > 0){
      const { data } = await MQ.rpc('add_points',{ p_amount:earned });
      if (data && data[0]){
        MQ.profile.points = data[0].points; MQ.profile.streak = data[0].streak; MQ.dressHeader();
      }
      MQ.pointsPop(earned, MQ.$('#mqPts'));
    }
    await MQ.rpc('bump_daily',{ p_solved:corr });
    const { data: codes } = await MQ.rpc('grant_achievements');
    if (codes && codes.length){ MQ.confetti(40); MQ.toast('Новое достижение!','ok',4000); }
  }
  function finish(){
    const spent = Date.now() - started, earned = correct * game.reward;
    root.innerHTML = '<div class="mq-card mq-card--pad-lg mq-center">' +
      MQ.iconBadge(correct >= 8 ? 'trophy' : correct >= 5 ? 'medal' : 'target',
        correct >= 8 ? 'ok' : correct >= 5 ? 'info' : 'warn', 26) +
      '<h2 style="margin-top:14px">' + correct + ' из ' + TOTAL + '</h2>' +
      '<p class="mq-muted">' + (correct >= 8 ? 'Отличный результат!' :
        correct >= 5 ? 'Хорошо, продолжаем' : 'Потренируемся ещё') + '</p>' +
      '<div class="mq-row" style="justify-content:center;gap:16px;margin:18px 0">' +
        '<span class="mq-chip mq-chip--ok">' + MQ.icon('coin',{size:15}) + '+' + earned + '</span>' +
        '<span class="mq-chip">' + MQ.icon('clock',{size:15}) + Math.round(spent/1000) + ' с</span></div>' +
      '<div class="mq-row" style="justify-content:center;gap:10px">' +
        '<button class="mq-btn mq-btn--primary" id="dAgain">' + MQ.icon('refresh',{size:17}) + 'Ещё раз</button>' +
        '<button class="mq-btn mq-btn--ghost" id="dBack">К списку</button></div></div>';
    MQ.$('#dAgain', root).onclick = () => MQ.runDrill(game);
    MQ.$('#dBack', root).onclick = () => MQ.go('games');
    if (correct >= 8) MQ.confetti(50);
    save(correct, earned, spent);
  }
  function step(){
    if (idx >= TOTAL){ finish(); return; }
    const item = makeQuestion(game.kind, game.lvl);
    locked = false;
    root.innerHTML = '<div class="mq-card mq-card--pad-lg">' +
      '<div class="mq-row" style="margin-bottom:14px">' +
        '<span class="mq-chip mq-chip--brand">' + MQ.esc(game.title) + '</span>' +
        '<div class="mq-spacer"></div><span class="mq-chip">' + (idx+1) + ' / ' + TOTAL + '</span></div>' +
      '<div class="mq-progress"><i style="width:' + (idx/TOTAL*100) + '%"></i></div>' +
      '<div class="mq-drill__q">' + item.q + '</div><div class="mq-drill__opts">' +
      item.opts.map(o => '<button class="mq-drill__opt" type="button" data-v="' + o + '">' + o + '</button>').join('') +
      '</div></div>';
    MQ.math(root);
    MQ.$$('.mq-drill__opt', root).forEach(b => b.onclick = () => {
      if (locked) return;
      locked = true;
      const ok = Number(b.dataset.v) === item.a;
      if (ok){ correct++; b.classList.add('is-right'); }
      else {
        b.classList.add('is-wrong');
        const r = MQ.$$('.mq-drill__opt', root).filter(x => Number(x.dataset.v) === item.a)[0];
        if (r) r.classList.add('is-right');
      }
      idx++;
      setTimeout(step, ok ? 380 : 900);
    });
  }
  view.innerHTML = '';
  view.appendChild(root);
  step();
};

MQ.views.games = async function(){
  const wrap = MQ.el('div','mq-stack',
    '<div class="mq-row mq-row--wrap"><div><h2 style="margin:0">Тренажёры</h2>' +
    '<p class="mq-muted" style="margin:2px 0 0;font-size:14px">' + CATALOG.length +
    ' тем · единая сложность · бесплатно</p></div><div class="mq-spacer"></div>' +
    '<input class="mq-input" id="gQ" placeholder="Поиск..." style="max-width:220px"></div>');
  const listBox = MQ.el('div','mq-stack');
  wrap.appendChild(listBox);

  let custom = [];
  const { data: cg } = await MQ.sb.from('games').select('*').eq('is_active', true).limit(40);
  if (cg && cg.length) custom = cg.map(g => ({
    slug:g.slug, section:g.section, sectionTitle:'От преподавателя', icon:'user',
    kind:(g.config && g.config.kind) || 'add', lvl:(g.config && g.config.lvl) || 1,
    title:g.title, sub:'авторский', reward:g.reward || 5 }));
  const all = custom.concat(CATALOG);

  function card(g){
    const c = MQ.el('div','mq-game mq-game--' + g.section,
      MQ.iconBadge(g.icon, g.section === 'geometry' ? 'info' : g.section === 'algebra' ? 'ok' :
        g.section === 'vpr' ? 'warn' : null) +
      '<div class="mq-game__title">' + MQ.esc(g.title) + '</div>' +
      '<div class="mq-muted" style="font-size:13px">' + MQ.esc(g.sub) + '</div>' +
      '<div class="mq-game__meta"><span class="mq-game__free">' + MQ.icon('check',{size:14}) +
      ' бесплатно</span><span>' + MQ.icon('coin',{size:14}) + ' +' + g.reward + '</span></div>');
    c.onclick = () => MQ.runDrill(g);
    return c;
  }
  function paint(f){
    listBox.innerHTML = '';
    const q = (f || '').toLowerCase(), groups = {};
    all.filter(g => !q || g.title.toLowerCase().indexOf(q) > -1 ||
                    g.sectionTitle.toLowerCase().indexOf(q) > -1)
       .forEach(g => { (groups[g.sectionTitle] = groups[g.sectionTitle] || []).push(g); });
    const keys = Object.keys(groups);
    if (!keys.length){ listBox.appendChild(MQ.empty('Ничего не нашли','search')); return; }
    keys.forEach(k => {
      const sec = MQ.el('div','mq-stack');
      sec.appendChild(MQ.el('h3','', MQ.esc(k) +
        ' <span class="mq-muted" style="font-weight:500;font-size:14px">· ' + groups[k].length + '</span>'));
      const grid = MQ.el('div','mq-grid mq-grid--4');
      groups[k].forEach(g => grid.appendChild(card(g)));
      sec.appendChild(grid);
      listBox.appendChild(sec);
    });
  }
  paint('');
  MQ.$('#gQ', wrap).oninput = MQ.debounce(e => paint(e.target.value), 220);
  return wrap;
};
})();
</script>

<script>
/* =====================================================================
   B5.1 — ИГРОВАЯ: десять настоящих мини-игр
   ===================================================================== */
(function(){
'use strict';
const MQ=window.MQ;
const GAMES=[
  ['tetris','Тетрис','Собирайте заполненные линии','🧱'],
  ['fifteen','Пятнашки','Расставьте числа от 1 до 15','🔢'],
  ['battle','Морской бой','Найдите все пять кораблей','🚢'],
  ['checkers','Шашки','Играйте вдвоём на одном устройстве','⛀'],
  ['chess','Шахматы','Упрощённая партия для двух игроков','♟'],
  ['sudoku','Судоку','Заполните поле 4 × 4','9️⃣'],
  ['memory','Мемори','Найдите одинаковые пары','🃏'],
  ['snake','Змейка','Управляйте стрелками','🐍'],
  ['2048','2048','Соединяйте одинаковые числа','✨'],
  ['bingo','Математическое бинго','Решите девять примеров','🎯']
];
const shuffle=a=>a.map(x=>[Math.random(),x]).sort((a,b)=>a[0]-b[0]).map(x=>x[1]);
function board(root,cols,cells){root.innerHTML='<div class="mq-mini-board" style="--cols:'+cols+'">'+cells.join('')+'</div>';return root.firstChild}
function modal(title,node){MQ.modalNode(title,node,'Закрыть',(_,close)=>close());}
function fifteen(){
  const root=MQ.el('div','mq-mini'), nums=shuffle([...Array(15)].map((_,i)=>i+1).concat(0));
  function draw(){const b=board(root,4,nums.map((n,i)=>'<button data-i="'+i+'" class="mq-mini-cell">'+(n||'')+'</button>'));b.onclick=e=>{const i=+e.target.dataset.i,z=nums.indexOf(0);if([i-1,i+1,i-4,i+4].includes(z)&&!(Math.abs(i-z)===1&&Math.floor(i/4)!==Math.floor(z/4))){[nums[i],nums[z]]=[nums[z],nums[i]];draw();if(nums.slice(0,15).every((n,j)=>n===j+1))MQ.toast('Пятнашки собраны!','ok')}}} draw();return root;
}
function memory(){
  const root=MQ.el('div','mq-mini'), vals=shuffle(['π','√','∑','∞','△','×','π','√','∑','∞','△','×']);let open=[],done=[];
  function draw(){const b=board(root,4,vals.map((v,i)=>'<button data-i="'+i+'" class="mq-mini-cell">'+(open.includes(i)||done.includes(i)?v:'?')+'</button>'));b.onclick=e=>{const i=+e.target.dataset.i;if(open.length===2||open.includes(i)||done.includes(i))return;open.push(i);draw();if(open.length===2)setTimeout(()=>{if(vals[open[0]]===vals[open[1]])done.push(...open);open=[];draw();if(done.length===vals.length)MQ.toast('Все пары найдены!','ok')},500)}}draw();return root;
}
function battle(){
  const root=MQ.el('div','mq-mini'), ships=new Set(shuffle([...Array(25).keys()]).slice(0,5)), shots=new Set();
  function draw(){root.innerHTML='<p class="mq-center"><b>'+(ships.size-[...shots].filter(x=>ships.has(x)).length)+'</b> кораблей осталось</p>';const b=board(root,5,[...Array(25)].map((_,i)=>'<button data-i="'+i+'" class="mq-mini-cell">'+(shots.has(i)?(ships.has(i)?'🔥':'·'):'~')+'</button>'));b.onclick=e=>{shots.add(+e.target.dataset.i);draw();if([...ships].every(x=>shots.has(x)))MQ.toast('Флот найден!','ok')}}draw();return root;
}
function sudoku(){
  const root=MQ.el('div','mq-mini');const solution=[1,2,3,4,3,4,1,2,2,1,4,3,4,3,2,1],fixed=new Set([0,3,5,6,9,10,12,15]);
  root.innerHTML='<div class="mq-mini-board" style="--cols:4">'+solution.map((v,i)=>fixed.has(i)?'<b class="mq-mini-cell">'+v+'</b>':'<input class="mq-mini-cell" data-i="'+i+'" inputmode="numeric" maxlength="1">').join('')+'</div><button class="mq-btn mq-btn--primary mq-btn--block" data-check>Проверить</button>';
  root.querySelector('[data-check]').onclick=()=>{const ok=[...root.querySelectorAll('input')].every(x=>+x.value===solution[+x.dataset.i]);MQ.toast(ok?'Судоку решено!':'Есть ошибки',ok?'ok':'warn')};return root;
}
function bingo(){
  const root=MQ.el('div','mq-mini'), qs=[...Array(9)].map(()=>{const a=2+Math.floor(Math.random()*9),b=2+Math.floor(Math.random()*9);return[a,b,a*b]});
  root.innerHTML='<div class="mq-mini-board" style="--cols:3">'+qs.map((q,i)=>'<label class="mq-mini-cell mq-mini-question">'+q[0]+'×'+q[1]+'<input data-i="'+i+'" inputmode="numeric"></label>').join('')+'</div><button class="mq-btn mq-btn--primary mq-btn--block" data-check>Проверить бинго</button>';
  root.querySelector('[data-check]').onclick=()=>{const n=[...root.querySelectorAll('input')].filter(x=>+x.value===qs[+x.dataset.i][2]).length;MQ.toast(n===9?'Бинго! Все ответы верны':'Верно: '+n+' из 9',n===9?'ok':'info')};return root;
}
function game2048(){
  const root=MQ.el('div','mq-mini'), a=Array(16).fill(0);function add(){const z=a.map((x,i)=>x?null:i).filter(x=>x!==null);if(z.length)a[z[Math.floor(Math.random()*z.length)]]=Math.random()<.9?2:4}add();add();
  const line=x=>{x=x.filter(Boolean);for(let i=0;i<x.length-1;i++)if(x[i]===x[i+1]){x[i]*=2;x.splice(i+1,1)}return x.concat(Array(4-x.length).fill(0))};
  function move(d){let old=a.join();for(let r=0;r<4;r++){let ids=d==='L'||d==='R'?[0,1,2,3].map(c=>r*4+c):[0,1,2,3].map(c=>c*4+r);let v=ids.map(i=>a[i]);if(d==='R'||d==='D')v.reverse();v=line(v);if(d==='R'||d==='D')v.reverse();ids.forEach((i,j)=>a[i]=v[j])}if(a.join()!==old)add();draw()}
  function draw(){root.innerHTML='<p class="mq-center">Используйте кнопки или стрелки</p><div class="mq-mini-board" style="--cols:4">'+a.map(x=>'<b class="mq-mini-cell">'+(x||'')+'</b>').join('')+'</div><div class="mq-mini-controls"><button>←</button><button>↑</button><button>↓</button><button>→</button></div>';[...root.querySelectorAll('.mq-mini-controls button')].forEach((b,i)=>b.onclick=()=>move(['L','U','D','R'][i]))}draw();return root;
}
function gridGame(kind){
  const root=MQ.el('div','mq-mini'), chess=kind==='chess', pieces=chess?['♜','♞','♝','♛','♚','♝','♞','♜',...Array(8).fill('♟'),...Array(32).fill(''),...Array(8).fill('♙'),'♖','♘','♗','♕','♔','♗','♘','♖']:[...Array(64)].map((_,i)=>{const r=Math.floor(i/8),c=i%8;if((r+c)%2===0)return'';return r<3?'●':r>4?'○':''});let selected=-1,turn=0;
  function draw(){root.innerHTML='<p class="mq-center">Ходят: <b>'+(chess?(turn?'белые':'чёрные'):(turn?'○':'●'))+'</b></p><div class="mq-mini-board mq-mini-board--8" style="--cols:8">'+pieces.map((p,i)=>'<button data-i="'+i+'" class="mq-mini-cell '+(selected===i?'is-selected':'')+'">'+p+'</button>').join('')+'</div>';root.querySelector('.mq-mini-board').onclick=e=>{const i=+e.target.dataset.i;if(selected<0){if(pieces[i]){selected=i;draw()}return}if(i!==selected){pieces[i]=pieces[selected];pieces[selected]='';turn=1-turn}selected=-1;draw()}}draw();return root;
}
function tetris(){
  const root=MQ.el('div','mq-mini'), w=10,h=16,a=Array(w*h).fill(0);let x=4,y=0,score=0,over=false;
  function fits(nx,ny){return ny<h&&nx>=0&&nx<w&&!a[ny*w+nx]}function settle(){a[y*w+x]=1;for(let r=h-1;r>=0;r--)if(a.slice(r*w,r*w+w).every(Boolean)){a.splice(r*w,w);a.unshift(...Array(w).fill(0));score++;r++}x=4;y=0;if(!fits(x,y))over=true}
  function step(){if(over||!root.isConnected)return;if(fits(x,y+1))y++;else settle();draw();setTimeout(step,350)}function move(dx){if(fits(x+dx,y))x+=dx;draw()}function draw(){root.innerHTML='<p class="mq-center">Линии: <b>'+score+'</b></p><div class="mq-tetris">'+a.map((v,i)=>'<i class="'+(y-Mi===y*w+x?'on':'')+'"></i>').join('')+'</div><div class="mq-mini-controls"><button>←</button><button>↓</button><button>→</button></div>';const bs=root.querySelectorAll('button');bs[0].onclick=()=>move(-1);bs[1].onclick=()=>{if(fits(x,y+1))y++;draw()};bs[2].onclick=()=>move(1)}draw();setTimeout(step,350);return root;
}
function snake(){
  const root=MQ.el('div','mq-mini'), canvas=MQ.el('canvas');canvas.width=300;canvas.height=300;root.appendChild(canvas);root.appendChild(MQ.el('div','mq-mini-controls','<button>←</button><button>↑</button><button>↓</button><button>→</button>'));let snake=[[7,7]],dir=[1,0],food=[3,3],score=0;
  const dirs=[[-1,0],[0,-1],[0,1],[1,0]];root.querySelectorAll('button').forEach((b,i)=>b.onclick=()=>dir=dirs[i]);function tick(){if(!root.isConnected)return;const n=[snake[0][0]+dir[0],snake[0][1]+dir[1]];if(n[0]<0||n[1]<0||n[0]>=15||n[1]>=15||snake.some(p=>p[0]===n[0]&&p[1]===n[1])){MQ.toast('Змейка: '+score+' очков','info');return}snake.unshift(n);if(n[0]===food[0]&&n[1]===food[1]){score++;food=[Math.floor(Math.random()*15),Math.floor(Math.random()*15)]}else snake.pop();const c=canvas.getContext('2d');c.fillStyle='#eef0fa';c.fillRect(0,0,300,300);c.fillStyle='#6c5ce7';snake.forEach(p=>c.fillRect(p[0]*20+1,p[1]*20+1,18,18));c.fillStyle='#e17055';c.fillRect(food[0]*20+2,food[1]*20+2,16,16);setTimeout(tick,150)}tick();return root;
}

MQ.goalRing = function(solved, goal){

    '<h3 style="margin:0 0 4px">Цель на день</h3>' +
    '<p class="mq-muted" style="margin:0">' + solved + ' из ' + g + ' задач' +
    (pct >= 100 ? ' · выполнено' : '') + '</p>' +

      MQ.icon('play',{size:15}) + 'Тренироваться</button>' : '') + '</div></div>');
};

MQ.progressFor = async function(userId){
  const today = MQ.dayKey(new Date());
  const res = await Promise.all([
    MQ.sb.from('daily_progress').select('*').eq('user_id', userId).eq('day', today).maybeSingle(),
    MQ.sb.from('game_results').select('correct,total,created_at')
      .eq('user_id', userId).order('created_at',{ ascending:false }).limit(120),
    MQ.sb.from('user_achievements').select('code').eq('user_id', userId)
  ]);
  const dp = res[0], runs = res[1].data || [], ua = res[2].data || [];
  const correct = runs.reduce((s,r) => s + (r.correct || 0), 0);
  const total = runs.reduce((s,r) => s + (r.total || 0), 0);
  return { solved: dp.data ? dp.data.solved : 0,
    goal: dp.data ? dp.data.goal : (MQ.profile && MQ.profile.daily_goal) || 10,
    runs, correct, total, accuracy: total ? Math.round(correct/total*100) : 0,
    codes: ua.map(x => x.code) };
};

    '<div><h3 class="mq-card__title">Достижения</h3><p class="mq-card__sub">' +
    st.codes.length + ' из ' + ((achs || []).length) + '</p></div></div>');

async function linkParent(student){
  const { data: parents } = await MQ.sb.from('profiles')
    .select('id,full_name').eq('role','parent').order('full_name');
  if (!parents || !parents.length){
    MQ.alertBox('Нет аккаунтов с ролью «Родитель». Попросите родителя зарегистрироваться и выбрать роль «Родитель».');
    return;
  }
  const form = MQ.el('div','mq-stack',

    '<select class="mq-select" id="lpP"><option value="">— не привязан —</option>' +

      const pid = MQ.$('#lpP', form).value || null;

      if (error){ MQ.toast(error.message,'err'); go.disabled = false; return; }
      close(); MQ.toast(pid ? 'Родитель привязан' : 'Привязка снята','ok'); MQ.render();

async function renameStudent(studentId, currentName) {
  const newName = await MQ.promptBox(
    'Введите новое имя для ученика',
    currentName || '',
    'Переименование ученика'
  );
  if (!newName || newName.trim() === '') return;
  if (newName.trim() === currentName) {
    MQ.toast('Имя не изменилось', 'info');
    return;
  }
  const { error } = await MQ.sb
    .from('profiles')
    .update({ full_name: newName.trim() })
    .eq('id', studentId);
  if (error) {
    MQ.toast(error.message, 'err');
  } else {
    MQ.toast('Имя обновлено ✅', 'ok');
    MQ.render();
  }
}

async function deleteStudent(studentId, studentName) {
  const confirmed = await MQ.confirmBox(
    `Удалить ученика "${studentName}"?\nЭто действие необратимо! Все данные ученика будут удалены.`
  );
  if (!confirmed) return;
  const { error } = await MQ.sb.rpc('delete_profile', { p_user_id: studentId });
  if (error) {
    MQ.toast(error.message, 'err');
  } else {
    MQ.toast(`Ученик "${studentName}" удалён`, 'ok');
    MQ.render();
  }
}
