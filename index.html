<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
    <meta name="theme-color" content="#6c5ce7">
    <title>iMath — репетитор по математике</title>
    <meta name="description" content="iMath: онлайн-занятия по математике, тренажёры, домашние задания, разбор ОГЭ, ЕГЭ, ВПР.">
    <link rel="preconnect" href="https://cdn.jsdelivr.net">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js">
    </script>
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js">
    </script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2">
    </script>
    <script defer src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js">
    </script>
    <style>
        /* ===== ПЕРЕМЕННЫЕ ===== */
        :root {
            --brand: #6c5ce7;
            --brand-2: #8b7cf6;
            --brand-dark: #4b3fc0;
            --ok: #00b894;
            --warn: #fdcb6e;
            --err: #e17055;
            --info: #0984e3;
            --bg: #f4f5fb;
            --surface: #fff;
            --surface-2: #fafbff;
            --text: #1c1f33;
            --muted: #6b7192;
            --line: #e6e8f5;
            --r-sm: 10px;
            --r: 16px;
            --r-lg: 24px;
            --r-full: 999px;
            --sh-1: 0 1px 2px rgba(28, 31, 51, .06), 0 2px 8px rgba(28, 31, 51, .05);
            --sh-2: 0 4px 14px rgba(28, 31, 51, .09);
            --sh-3: 0 14px 40px rgba(76, 63, 192, .18);
            --grad: linear-gradient(135deg, #6c5ce7, #8b7cf6 55%, #a78bfa);
            --grad-warm: linear-gradient(135deg, #fdcb6e, #e17055);
        }
        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        html {
            scroll-behavior: smooth;
            -webkit-tap-highlight-color: transparent;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, system-ui, sans-serif;
            background: var(--bg);
            color: var(--text);
            line-height: 1.5;
            min-height: 100vh;
            padding: 0 16px 40px;
        }
        img,
        svg {
            display: block;
            max-width: 100%;
        }
        button,
        input,
        select,
        textarea {
            font: inherit;
            color: inherit;
        }
        a {
            color: var(--brand);
            text-decoration: none;
        }
        .mq-hidden {
            display: none !important;
        }
        .mq-spacer {
            flex: 1;
        }
        .mq-row {
            display: flex;
            gap: 12px;
            align-items: center;
            flex-wrap: wrap;
        }
        .mq-row--wrap {
            flex-wrap: wrap;
        }
        .mq-stack {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }
        .mq-grid {
            display: grid;
            gap: 16px;
        }
        .mq-grid--2 {
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
        }
        .mq-grid--3 {
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
        }
        .mq-grid--4 {
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
        }
        .mq-card {
            background: var(--surface);
            border-radius: var(--r);
            box-shadow: var(--sh-1);
            padding: 18px 20px;
            transition: box-shadow .2s, transform .15s;
            border: 1px solid var(--line);
        }
        .mq-card--hover:hover {
            box-shadow: var(--sh-2);
            transform: translateY(-2px);
        }
        .mq-card--pad-lg {
            padding: 24px 28px;
        }
        .mq-card__head {
            display: flex;
            gap: 14px;
            align-items: center;
            margin-bottom: 8px;
        }
        .mq-card__title {
            font-size: 17px;
            font-weight: 600;
            margin: 0;
        }
        .mq-card__sub {
            color: var(--muted);
            font-size: 14px;
            margin: 2px 0 0;
        }
        .mq-btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 8px 18px;
            border-radius: var(--r-full);
            border: none;
            background: var(--surface);
            color: var(--text);
            font-weight: 500;
            font-size: 15px;
            cursor: pointer;
            transition: all .2s;
            box-shadow: var(--sh-1);
            text-align: center;
            justify-content: center;
            line-height: 1.3;
            white-space: nowrap;
        }
        .mq-btn--primary {
            background: var(--brand);
            color: #fff;
            box-shadow: var(--sh-2);
        }
        .mq-btn--primary:hover {
            background: var(--brand-dark);
            box-shadow: var(--sh-3);
            transform: translateY(-1px);
        }
        .mq-btn--ghost {
            background: transparent;
            box-shadow: none;
            border: 1px solid var(--line);
        }
        .mq-btn--ghost:hover {
            background: var(--surface-2);
            border-color: var(--brand);
        }
        .mq-btn--sm {
            padding: 4px 12px;
            font-size: 13px;
        }
        .mq-btn--lg {
            padding: 12px 28px;
            font-size: 17px;
        }
        .mq-btn--danger {
            background: var(--err);
            color: #fff;
        }
        .mq-btn--danger:hover {
            background: #c0392b;
        }
        .mq-btn:disabled {
            opacity: .5;
            pointer-events: none;
        }
        .mq-chip {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            background: var(--surface-2);
            padding: 2px 12px;
            border-radius: var(--r-full);
            font-size: 13px;
            color: var(--muted);
            border: 1px solid var(--line);
        }
        .mq-chip--brand {
            background: var(--brand);
            color: #fff;
            border-color: var(--brand);
        }
        .mq-chip--ok {
            background: var(--ok);
            color: #fff;
            border-color: var(--ok);
        }
        .mq-chip--warn {
            background: var(--warn);
            color: #fff;
            border-color: var(--warn);
        }
        .mq-field {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        .mq-label {
            font-weight: 500;
            font-size: 14px;
            color: var(--muted);
        }
        .mq-input,
        .mq-select,
        .mq-textarea {
            padding: 10px 14px;
            border-radius: var(--r-sm);
            border: 1px solid var(--line);
            background: var(--surface);
            font-size: 15px;
            transition: border .2s;
            width: 100%;
        }
        .mq-input:focus,
        .mq-select:focus,
        .mq-textarea:focus {
            outline: none;
            border-color: var(--brand);
            box-shadow: 0 0 0 3px rgba(108, 92, 231, .15);
        }
        .mq-textarea {
            min-height: 80px;
            resize: vertical;
        }
        .mq-hint {
            color: var(--muted);
            font-size: 13px;
            margin-top: 4px;
        }
        .mq-muted {
            color: var(--muted);
        }
        .mq-avatar {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: var(--grad);
            color: #fff;
            font-weight: 600;
            font-size: 18px;
            flex-shrink: 0;
        }
        .mq-avatar.max {
            background: linear-gradient(135deg, #0984e3, #74b9ff);
        }
        .mq-hero {
            text-align: center;
            padding: 40px 0 20px;
        }
        .mq-hero__lead {
            font-size: 18px;
            color: var(--muted);
            max-width: 600px;
            margin: 12px auto 24px;
        }
        .mq-hero__cta {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            justify-content: center;
            margin: 20px 0 28px;
        }
        .mq-hero__stats {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 24px 40px;
            margin-top: 16px;
        }
        .mq-hero__stat {
            text-align: center;
        }
        .mq-hero__stat b {
            display: block;
            font-size: 24px;
            color: var(--brand);
        }
        .mq-hero__stat span {
            font-size: 14px;
            color: var(--muted);
        }
        .mq-section {
            margin: 32px 0;
        }
        .mq-section__head {
            margin-bottom: 16px;
        }
        .mq-section__head h2 {
            font-size: 22px;
            margin-bottom: 4px;
        }
        .mq-section__head p {
            color: var(--muted);
            font-size: 15px;
        }
        .mq-theme-icon {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 48px;
            height: 48px;
            border-radius: 12px;
            background: var(--surface-2);
            color: var(--brand);
            flex-shrink: 0;
        }
        .mq-theme-icon.pythagoras {
            background: #dfe6e9;
            color: #0984e3;
        }
        .mq-theme-card {
            cursor: pointer;
        }
        .mq-review {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .mq-review__stars {
            display: flex;
            gap: 2px;
            color: var(--warn);
        }
        .mq-review__text {
            font-size: 15px;
            line-height: 1.5;
            margin: 4px 0;
        }
        .mq-review__who {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-top: 6px;
        }
        .mq-review__who b {
            display: block;
            font-size: 14px;
        }
        .mq-review__who .mq-muted {
            font-size: 13px;
        }
        .mq-faq {
            background: var(--surface);
            border-radius: var(--r);
            border: 1px solid var(--line);
            padding: 12px 18px;
            margin-bottom: 8px;
            cursor: pointer;
        }
        .mq-faq summary {
            font-weight: 500;
            font-size: 16px;
            outline: none;
        }
        .mq-faq__body {
            padding-top: 10px;
            color: var(--muted);
            font-size: 15px;
        }
        .mq-cta-band {
            background: var(--grad);
            color: #fff;
            padding: 32px 24px;
            border-radius: var(--r-lg);
            text-align: center;
        }
        .mq-cta-band h2 {
            font-size: 24px;
            margin-bottom: 8px;
        }
        .mq-cta-band p {
            font-size: 16px;
            opacity: .9;
            margin-bottom: 20px;
        }
        .mq-cta-band .mq-btn {
            background: #fff;
            color: var(--brand);
            box-shadow: var(--sh-2);
        }
        .mq-cta-band .mq-btn:hover {
            background: #f4f5fb;
        }
        .mq-contacts {
            display: flex;
            flex-wrap: wrap;
            gap: 12px 20px;
            justify-content: center;
            margin-top: 16px;
        }
        .mq-contact {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            color: var(--muted);
            font-size: 14px;
        }
        .mq-contact--wa {
            color: #25d366;
        }
        .mq-contact--tg {
            color: #0088cc;
        }
        .mq-contact--tel {
            color: var(--text);
        }
        .mq-footer {
            margin-top: 40px;
            padding-top: 20px;
            border-top: 1px solid var(--line);
            text-align: center;
            color: var(--muted);
            font-size: 14px;
            line-height: 1.6;
        }
        .mq-drill {
            max-width: 560px;
            margin: 0 auto;
        }
        .mq-drill__question {
            font-size: 20px;
            font-weight: 500;
            text-align: center;
            padding: 20px 0;
        }
        .mq-drill__options {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }
        .mq-drill__option {
            padding: 14px;
            border-radius: var(--r-sm);
            border: 2px solid var(--line);
            background: var(--surface);
            text-align: center;
            font-size: 18px;
            cursor: pointer;
            transition: all .15s;
        }
        .mq-drill__option:hover {
            border-color: var(--brand);
            background: var(--surface-2);
        }
        .mq-drill__option--correct {
            border-color: var(--ok);
            background: #e6f9f1;
        }
        .mq-drill__option--wrong {
            border-color: var(--err);
            background: #fde8e3;
        }
        .mq-drill__progress {
            display: flex;
            gap: 6px;
            justify-content: center;
            margin: 16px 0;
        }
        .mq-drill__dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: var(--line);
        }
        .mq-drill__dot--done {
            background: var(--ok);
        }
        .mq-drill__dot--wrong {
            background: var(--err);
        }
        .mq-drill__score {
            text-align: center;
            font-size: 16px;
            font-weight: 500;
        }
        .mq-files {
            display: flex;
            flex-direction: column;
            gap: 6px;
            margin-top: 8px;
        }
        .mq-file {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 8px 12px;
            background: var(--surface-2);
            border-radius: var(--r-sm);
            border: 1px solid var(--line);
            font-size: 14px;
        }
        .mq-file__name {
            flex: 1;
            word-break: break-word;
        }
        .mq-file__size {
            color: var(--muted);
            font-size: 12px;
        }
        .mq-dropzone {
            border: 2px dashed var(--line);
            border-radius: var(--r);
            padding: 30px 20px;
            text-align: center;
            cursor: pointer;
            transition: border .2s, background .2s;
        }
        .mq-dropzone.is-over {
            border-color: var(--brand);
            background: rgba(108, 92, 231, .05);
        }
        .mq-dropzone__icon {
            font-size: 40px;
            color: var(--muted);
        }
        .mq-dropzone__hint {
            color: var(--muted);
            font-size: 14px;
            margin-top: 6px;
        }
        .mq-ed-bar {
            display: flex;
            flex-wrap: wrap;
            gap: 4px;
            padding: 6px 8px;
            background: var(--surface-2);
            border-radius: var(--r-sm) var(--r-sm) 0 0;
            border: 1px solid var(--line);
            border-bottom: none;
        }
        .mq-ed-btn {
            padding: 4px 10px;
            border: 1px solid transparent;
            border-radius: 4px;
            background: transparent;
            cursor: pointer;
            font-size: 13px;
            transition: background .15s;
        }
        .mq-ed-btn:hover {
            background: var(--line);
        }
        .mq-ed-body {
            padding: 12px 14px;
            border: 1px solid var(--line);
            border-radius: 0 0 var(--r-sm) var(--r-sm);
            min-height: 100px;
            background: var(--surface);
            outline: none;
            font-size: 15px;
            line-height: 1.6;
        }
        .mq-ed-body:focus {
            border-color: var(--brand);
        }
        .mq-anim-in {
            animation: fadeUp .35s ease;
        }
        @keyframes fadeUp {
            from {
                opacity: 0;
                transform: translateY(12px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        .mq-spin {
            animation: spin .8s linear infinite;
        }
        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }
        .mq-toast-container {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 9999;
            display: flex;
            flex-direction: column;
            gap: 8px;
            align-items: center;
            pointer-events: none;
        }
        .mq-toast {
            padding: 12px 24px;
            border-radius: var(--r-full);
            background: var(--text);
            color: #fff;
            box-shadow: var(--sh-3);
            font-size: 15px;
            pointer-events: auto;
            animation: slideUp .25s ease;
            max-width: 90vw;
        }
        .mq-toast--ok {
            background: var(--ok);
        }
        .mq-toast--err {
            background: var(--err);
        }
        .mq-toast--warn {
            background: var(--warn);
            color: var(--text);
        }
        .mq-toast--info {
            background: var(--info);
        }
        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        .mq-modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, .4);
            backdrop-filter: blur(4px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 10000;
            padding: 20px;
            animation: fadeIn .2s;
        }
        .mq-modal {
            max-width: 560px;
            width: 100%;
            background: var(--surface);
            border-radius: var(--r-lg);
            padding: 28px 24px;
            box-shadow: var(--sh-3);
            max-height: 90vh;
            overflow-y: auto;
            animation: scaleIn .2s;
        }
        .mq-modal__title {
            font-size: 20px;
            font-weight: 600;
            margin-bottom: 12px;
        }
        .mq-modal__body {
            margin-bottom: 20px;
        }
        .mq-modal__actions {
            display: flex;
            gap: 10px;
            justify-content: flex-end;
        }
        @keyframes fadeIn {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }
        @keyframes scaleIn {
            from {
                transform: scale(.95);
                opacity: 0;
            }
            to {
                transform: scale(1);
                opacity: 1;
            }
        }
        .mq-confetti-container {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 99999;
            overflow: hidden;
        }
        .mq-confetti-piece {
            position: absolute;
            width: 10px;
            height: 10px;
            border-radius: 2px;
            animation: confettiFall linear forwards;
        }
        @keyframes confettiFall {
            0% {
                transform: translateY(-10vh) rotate(0deg);
                opacity: 1;
            }
            100% {
                transform: translateY(110vh) rotate(720deg);
                opacity: 0;
            }
        }
        /* адаптив */
        @media (max-width: 600px) {
            .mq-grid--2,
            .mq-grid--3,
            .mq-grid--4 {
                grid-template-columns: 1fr;
            }
            .mq-hero__stats {
                gap: 12px 20px;
            }
            .mq-hero__stat b {
                font-size: 20px;
            }
            .mq-modal {
                padding: 20px 16px;
            }
            .mq-drill__options {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div id="mqApp"></div>
    <script>
        /* =====================================================================
           ИНИЦИАЛИЗАЦИЯ

        (function() {

            MQ.ICONS = ICONS;

            MQ.icon = function(name, opts) {
                opts = opts || {};
                const size = opts.size || 18;
                const cls = opts.cls || '';
                const html = ICONS[name] || name;
                return '<span class="mq-icon ' + cls + '" style="font-size:' + size + 'px;line-height:1">' + html +

            };

            MQ.iconBadge = function(name, color) {

                const map = {
                    brand: 'var(--brand)',
                    ok: 'var(--ok)',

                    err: 'var(--err)',

                };
                const bg = map[c] || 'var(--brand)';
                return '<span style="display:inline-flex;align-items:center;justify-content:center;width:36px;height:36px;border-radius:50%;background:' +
                    bg + ';color:#fff;font-size:18px;flex-shrink:0">' + (ICONS[name] || name) + '</span>';
            };

            MQ.esc = function(s) {
                if (!s) return '';
                const div = document.createElement('div');
                div.textContent = s;
                return div.innerHTML;
            };

            MQ.human = function(bytes) {
                if (bytes < 1024) return bytes + ' Б';
                if (bytes < 1048576) return (bytes / 1024).toFixed(1) + ' КБ';
                return (bytes / 1048576).toFixed(1) + ' МБ';
            };

            MQ.pubUrl = function(bucket, path) {
                return MQ.sb.storage.from(bucket).getPublicUrl(path).data.publicUrl;
            };

            MQ.fileUrl = async function(bucket, path) {
                try {
                    const { data } = await MQ.sb.storage.from(bucket).createSignedUrl(path, 3600);
                    return data.signedUrl;
                } catch (e) {
                    return MQ.pubUrl(bucket, path);
                }
            };

            MQ.el = function(tag, cls, html) {
                const el = document.createElement(tag);
                if (cls) el.className = cls;
                if (html !== undefined) el.innerHTML = html;
                return el;
            };

            MQ.$ = function(sel, ctx) {
                return (ctx || document).querySelector(sel);
            };

            MQ.$$ = function(sel, ctx) {
                return Array.from((ctx || document).querySelectorAll(sel));
            };

            MQ.debounce = function(fn, ms) {
                let t;
                return function() {
                    clearTimeout(t);
                    t = setTimeout(() => fn.apply(this, arguments), ms);
                };
            };

            // --- toast ---
            MQ.toast = function(text, type, duration) {
                type = type || 'info';
                duration = duration || 2500;
                const container = document.getElementById('mqToasts') || (function() {
                    const c = MQ.el('div', 'mq-toast-container');
                    c.id = 'mqToasts';
                    document.body.appendChild(c);
                    return c;
                })();
                const t = MQ.el('div', 'mq-toast mq-toast--' + type, text);
                container.appendChild(t);
                setTimeout(() => { t.style.opacity = '0';
                    t.style.transition = 'opacity .3s'; }, duration);
                setTimeout(() => t.remove(), duration + 400);
            };

            // --- modal ---
            MQ.modalNode = function(title, bodyNode, okText, onOk) {
                const overlay = MQ.el('div', 'mq-modal-overlay');
                const modal = MQ.el('div', 'mq-modal');
                modal.innerHTML = '<div class="mq-modal__title">' + MQ.esc(title) + '</div>';
                const bodyWrap = MQ.el('div', 'mq-modal__body');
                bodyWrap.appendChild(bodyNode);
                modal.appendChild(bodyWrap);
                const actions = MQ.el('div', 'mq-modal__actions');
                const cancel = MQ.el('button', 'mq-btn mq-btn--ghost', 'Отмена');
                cancel.onclick = () => { overlay.remove();
                    if (MQ._modalResolve) MQ._modalResolve(false); };
                const ok = MQ.el('button', 'mq-btn mq-btn--primary', okText || 'OK');
                ok.onclick = async () => {
                    if (onOk) {
                        await onOk(ok, () => overlay.remove());
                    } else {
                        overlay.remove();
                        if (MQ._modalResolve) MQ._modalResolve(true);
                    }
                };
                actions.appendChild(cancel);
                actions.appendChild(ok);
                modal.appendChild(actions);
                overlay.appendChild(modal);
                document.body.appendChild(overlay);
                return overlay;
            };

            MQ.modal = function(title, html, okText, onOk) {
                const body = MQ.el('div', '', html);
                return MQ.modalNode(title, body, okText, onOk);
            };

            MQ.alertBox = function(text, title) {
                return new Promise((resolve) => {

                        close();
                        resolve(true);
                    });
                });

            MQ.confirmBox = function(text, title) {
                return new Promise((resolve) => {
                    const body = MQ.el('div', '', '<p>' + MQ.esc(text) + '</p>');
                    const overlay = MQ.modalNode(title || 'Подтверждение', body, 'Да', async (btn, close) => {
                        close();
                        resolve(true);
                    });
                    const cancel = overlay.querySelector('.mq-btn--ghost');
                    if (cancel) {
                        cancel.onclick = () => { overlay.remove();
                            resolve(false); };
                    }
                });
            };

            MQ.promptBox = function(text, value, title) {
                return new Promise((resolve) => {
                    const body = MQ.el('div', 'mq-stack',
                        '<p>' + MQ.esc(text) + '</p>' +
                        '<input class="mq-input" id="mqPromptInput" value="' + MQ.esc(value || '') + '">');
                    const overlay = MQ.modalNode(title || 'Ввод', body, 'OK', (btn, close) => {
                        const val = MQ.$('#mqPromptInput', body).value;
                        close();
                        resolve(val);

                    const cancel = overlay.querySelector('.mq-btn--ghost');
                    if (cancel) {
                        cancel.onclick = () => { overlay.remove();
                            resolve(null); };

                    setTimeout(() => { const inp = MQ.$('#mqPromptInput', body); if (inp) inp.focus(); },

            // --- confetti ---
            MQ.confetti = function(count) {
                count = count || 30;
                const container = MQ.el('div', 'mq-confetti-container');
                document.body.appendChild(container);
                const colors = ['#6c5ce7', '#00b894', '#fdcb6e', '#e17055', '#0984e3', '#fd79a8', '#fdcb6e'];
                for (let i = 0; i < count; i++) {
                    const piece = MQ.el('div', 'mq-confetti-piece');
                    const size = 6 + Math.random() * 8;
                    piece.style.width = size + 'px';
                    piece.style.height = size * 0.6 + 'px';
                    piece.style.background = colors[Math.floor(Math.random() * colors.length)];

            // --- dropzone ---
            MQ.dropzone = function(opts) {
                opts = opts || {};
                const root = MQ.el('div', 'mq-stack');
                const title = opts.title || 'Загрузите файлы';
                const hint = opts.hint || 'Перетащите или нажмите для выбора';
                const max = opts.max || 10;
                const files = [];
                const drop = MQ.el('div', 'mq-dropzone',
                    '<div class="mq-dropzone__icon">' + MQ.icon('upload', { size: 40 }) + '</div>' +
                    '<div style="font-weight:500;margin-top:4px">' + MQ.esc(title) + '</div>' +
                    '<div class="mq-dropzone__hint">' + MQ.esc(hint) + '</div>');
                const input = MQ.el('input', '', '');
                input.type = 'file';
                input.multiple = true;
                input.style.display = 'none';
                drop.appendChild(input);

                const list = MQ.el('div', 'mq-files');
                const paint = () => {
                    list.innerHTML = '';
                    files.forEach((f, i) => {
                        const row = MQ.el('div', 'mq-file',
                            MQ.icon((f.type || '').startsWith('image') ? 'image' : 'file', { size: 17 }) +
                            '<span class="mq-file__name">' + MQ.esc(f.name) + '</span>' +
                            '<span class="mq-file__size">' + MQ.human(f.size) + '</span>' +
                            '<button class="mq-btn mq-btn--ghost mq-btn--sm" type="button">' +
                            MQ.icon('trash', { size: 14 }) + '</button>');
                        row.querySelector('button').onclick = () => {
                            files.splice(i, 1);
                            paint();
                        };
                        list.appendChild(row);
                    });
                };
                const add = (newFiles) => {
                    const arr = Array.from(newFiles || []);
                    for (const f of arr) {
                        if (files.length >= max) { MQ.toast('Максимум ' + max + ' файлов', 'warn'); break; }
                        if (f.size > 25 * 1024 * 1024) { MQ.toast(f.name + ' > 25 МБ', 'err'); continue; }
                        files.push(f);
                    }
                    paint();
                };
                drop.onclick = () => input.click();
                drop.onkeydown = e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault();
                        input.click(); } };
                input.onchange = () => { add(input.files);
                    input.value = ''; };
                ['dragenter', 'dragover'].forEach(ev => drop.addEventListener(ev, e => {
                    e.preventDefault();
                    drop.classList.add('is-over');
                }));
                ['dragleave', 'drop'].forEach(ev => drop.addEventListener(ev, e => {
                    e.preventDefault();
                    drop.classList.remove('is-over');
                    if (ev === 'drop' && e.dataTransfer) add(e.dataTransfer.files);
                }));
                root.appendChild(drop);
                root.appendChild(list);

                return {
                    node: root,
                    files,
                    clear() { files.length = 0;
                        paint(); },
                    async upload(bucket, prefix) {
                        const out = [];
                        const uploadFiles = opts.beforeUpload ? await opts.beforeUpload(files) : files;
                        for (const f of uploadFiles) {
                            const path = (prefix || MQ.user.id) + '/' + Date.now() + '-' + f.name.replace(/[^\w.\-]/g,
                                '_');
                            const { error } = await MQ.sb.storage.from(bucket || MQ.CFG.BUCKETS.hw).upload(path,
                            f);
                            if (error) { MQ.toast(f.name + ': ' + error.message, 'err'); continue; }
                            out.push({ path, name: f.name, size: f.size, type: f.type });
                        }
                        return out;
                    }
                };
            };

            // --- attach list ---
            function attachList(arr, bucket) {
                const files = Array.isArray(arr) ? arr : [];
                if (!files.length) return MQ.el('div');
                const box = MQ.el('div', 'mq-files');
                files.forEach(f => {
                    const row = MQ.el('div', 'mq-file',
                        MQ.icon((f.type || '').startsWith('image') ? 'image' : 'file', { size: 17 }) +
                        '<span class="mq-file__name">' + MQ.esc(f.name || 'файл') + '</span>' +
                        '<button class="mq-btn mq-btn--ghost mq-btn--sm" type="button">' +
                        MQ.icon('download', { size: 15 }) + 'Открыть</button>');
                    row.querySelector('button').onclick = async () => {
                        const url = await MQ.fileUrl(bucket || MQ.CFG.BUCKETS.hw, f.path);
                        if (url) window.open(url, '_blank', 'noopener');
                    };
                    box.appendChild(row);
                });
                return box;
            }

            // --- PDF converter for homework images ---
            async function homeworkFilesAsPdf(files) {
                const list = Array.from(files || []);
                const images = list.filter(f => (f.type || '').startsWith('image/'));
                const other = list.filter(f => !(f.type || '').startsWith('image/'));
                if (!images.length || !window.jspdf || !window.jspdf.jsPDF) return list;
                const pdf = new window.jspdf.jsPDF({ orientation: 'p', unit: 'mm', format: 'a4' });
                for (let i = 0; i < images.length; i++) {
                    const data = await new Promise((resolve, reject) => {
                        const r = new FileReader();
                        r.onload = () => resolve(r.result);
                        r.onerror = reject;
                        r.readAsDataURL(images[i]);
                    });
                    const img = await new Promise((resolve, reject) => {
                        const im = new Image();
                        im.onload = () => resolve(im);
                        im.onerror = reject;
                        im.src = data;
                    });
                    if (i) pdf.addPage();
                    const pageW = pdf.internal.pageSize.getWidth(),
                        pageH = pdf.internal.pageSize.getHeight();
                    const ratio = Math.min((pageW - 20) / img.width, (pageH - 20) / img.height);
                    const w = img.width * ratio,
                        h = img.height * ratio;
                    pdf.addImage(data, images[i].type.indexOf('png') > -1 ? 'PNG' : 'JPEG', (pageW - w) / 2, 10, w,
                    h);
                }
                const blob = pdf.output('blob');
                const file = new File([blob], 'homework-' + Date.now() + '.pdf', { type: 'application/pdf' });
                return [file].concat(other);
            }

            // --- helpers ---
            const fmtDate = d => { try { return new Date(d).toLocaleDateString('ru-RU', { day: 'numeric',
                        month: 'long' }); } catch (e) { return ''; } };
            const fmtTime = d => { try { return new Date(d).toLocaleTimeString('ru-RU', { hour: '2-digit',
                        minute: '2-digit' }); } catch (e) { return ''; } };
            const dayKey = d => { const x = new Date(d);
                return x.getFullYear() + '-' + String(x.getMonth() + 1).padStart(2, '0') + '-' + String(x.getDate())
                    .padStart(2, '0'); };

            function dayLabel(d) {
                const k = dayKey(d),

                y.setDate(y.getDate() - 1);
                if (k === t) return 'Сегодня';
                if (k === dayKey(y)) return 'Вчера';
                return fmtDate(d);

            Object.assign(MQ, {

                alertBox: (t, ti) => modal({ text: t, title: ti || 'iMath', okText: 'Понятно' }),

                promptBox: (t, v, ti) => modal({ type: 'prompt', text: t, value: v, title: ti || 'Ввод' }),
                fmtDate,

                esc: MQ.esc,

                isTeacher() { return MQ.user && MQ.user.role === 'teacher'; },
                isAuthed() { return !!MQ.user; },
                go(view, params) {
                    MQ.params = params || {};
                    MQ.render(view);
                },
                render(view) {
                    const app = document.getElementById('mqApp');
                    if (!app) return;
                    const v = view || MQ.params.view || 'home';
                    const fn = MQ.views[v];

            // --- init supabase ---
            const { createClient } = supabase;

            // --- auth ---
            async function initAuth() {

    <script>
        (function() {
            'use strict';
            const MQ = window.MQ;

            const ri = (a, b) => Math.floor(Math.random() * (b - a + 1)) + a;
            const pick = arr => arr[Math.floor(Math.random() * arr.length)];
            const shuffle = arr => { for (let i = arr.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (
                        i + 1));
                    [arr[i], arr[j]] = [arr[j], arr[i]]; } return arr; };

            const GEN = {
                add: l => { const a = ri(1, 10 + l),
                        b = ri(1, 10 + l);
                    return { q: a + ' + ' + b, a: a + b }; },
                sub: l => { const a = ri(5 + l, 20 + l),
                        b = ri(1, a - 1);
                    return { q: a + ' − ' + b, a: a - b }; },
                mul: l => { const a = ri(2, 6 + l),
                        b = ri(2, 6 + l);
                    return { q: a + ' × ' + b, a: a * b }; },
                div: l => { const b = ri(2, 6 + l),
                        c = ri(1, 6 + l);
                    return { q: (b * c) + ' ÷ ' + b, a: c }; },
                pow: l => { const b = ri(2, 4 + l),
                        e = ri(2, 3);
                    return { q: b + '^' + e, a: Math.pow(b, e) }; },
                percent: l => { const p = ri(10, 60 + l * 5),
                        x = ri(50, 200 + l * 20);
                    return { q: p + '% от ' + x, a: Math.round(p * x / 100) }; },
                linear: l => { const a = ri(2, 5 + l),
                        b = ri(2, 8 + l),
                        c = a * ri(1, 4 + l) + b;
                    return { q: a + 'x + ' + b + ' = ' + c, a: (c - b) / a }; },
                linear2: l => { const a = ri(2, 5 + l),
                        b = ri(2, 6 + l),
                        c = ri(2, 5 + l),
                        d = ri(2, 6 + l),
                        x = ri(1, 5 + l);
                    return { q: a + 'x + ' + b + ' = ' + c + 'x + ' + d, a: (d - b) / (a - c) }; },
                quad: l => { const x1 = ri(1, 5 + l),
                        x2 = ri(1, 7 + l);
                    return { q: '\\(x^2 - ' + (x1 + x2) + 'x + ' + (x1 * x2) + ' = 0\\), больший корень', a: Math.max(x1,
                            x2) }; },
                square: l => { const a = ri(2, 8 + l); return { q: 'Площадь квадрата со стороной ' + a, a: a * a }; },
                rect: l => { const a = ri(2, 9 + l),
                        b = ri(2, 9 + l);
                    return { q: 'Площадь прямоугольника ' + a + ' × ' + b, a: a * b }; },
                perim: l => { const a = ri(2, 9 + l),
                        b = ri(2, 9 + l);
                    return { q: 'Периметр прямоугольника ' + a + ' × ' + b, a: 2 * (a + b) }; },
                triangle: l => { const a = ri(2, 10 + l) * 2,
                        h = ri(2, 8 + l);
                    return { q: 'Площадь треугольника: основание ' + a + ', высота ' + h, a: a * h / 2 }; },
                angles: () => { const a = ri(20, 80),
                        b = ri(20, 150 - a);
                    return { q: 'Два угла треугольника: ' + a + '° и ' + b + '°. Третий?', a: 180 - a - b }; },
                seq: l => { const s = ri(1, 9),
                        d = ri(2, 3 + l);
                    return { q: s + ', ' + (s + d) + ', ' + (s + 2 * d) + ', ' + (s + 3 * d) + ', ... следующее?', a: s +
                            4 * d }; },
                logic: () => { const a = ri(2, 9),
                        b = ri(2, 9);
                    return { q: 'У ' + a + ' коробок по ' + b + ' карандашей. Сколько карандашей?', a: a * b }; },
                speed: l => { const v = ri(3, 8 + l) * 10,
                        t = ri(2, 5);
                    return { q: 'Скорость ' + v + ' км/ч, время ' + t + ' ч. Путь?', a: v * t }; },
                frac: () => { const b = ri(2, 9),
                        c = ri(2, 9),
                        a = ri(1, b - 1); return { q: '\\(\\frac{' + a + '}{' + b + '}\\) от ' + (b * c), a: a *
                        c }; },
                roots: () => { const x = ri(3, 14); return { q: '\\(\\sqrt{' + (x * x) + '}\\)', a: x }; },
                system: () => { const x = ri(1, 9),
                        y = ri(1, 9); return { q: '\\(x+y=' + (x + y) + ',\\ x-y=' + (x - y) + '\\). Найдите \\(x\\)',
                        a: x }; },
                discr: () => { const x1 = ri(1, 8),
                        x2 = ri(1, 8); return { q: 'Дискриминант уравнения \\(x^2-' + (x1 + x2) + 'x+' + (x1 *
                            x2) + '=0\\)', a: Math.pow(x1 - x2, 2) }; },
                pyth: () => { const triples = [
                        [3, 4, 5],
                        [5, 12, 13],
                        [6, 8, 10],
                        [8, 15, 17]
                    ],
                    t = pick(triples); return { q: 'Прямоугольный треугольник: катеты ' + t[0] + ' и ' + t[1] +
                            '. Гипотенуза?', a: t[2] }; },
                circle: () => { const r = ri(2, 10); return { q: 'Длина окружности при \\(r=' + r +
                        '\\), если \\(\\pi=3\\)', a: 2 * 3 * r }; },
                prob: () => { const good = ri(2, 8); return { q: 'Благоприятных исходов ' + good +
                        ' из 10. Вероятность в процентах?', a: good * 10 }; }
            };
            GEN.vpr = l => pick([GEN.percent, GEN.rect, GEN.speed, GEN.seq, GEN.add])(l);

            const SECTIONS = [
                { key: 'arithmetic', title: 'Арифметика', icon: 'sigma',
                    kinds: [
                        ['add', 'Сложение'],
                        ['sub', 'Вычитание'],
                        ['mul', 'Умножение'],
                        ['div', 'Деление'],
                        ['pow', 'Степени'],
                        ['percent', 'Проценты'],
                        ['frac', 'Дроби'],
                        ['roots', 'Корни']
                    ] },
                { key: 'algebra', title: 'Алгебра', icon: 'chart',
                    kinds: [
                        ['linear', 'Линейные уравнения'],
                        ['linear2', 'Уравнения со сдвигом'],
                        ['quad', 'Квадратные уравнения'],
                        ['seq', 'Последовательности'],
                        ['system', 'Системы уравнений'],
                        ['discr', 'Дискриминант']
                    ] },
                { key: 'geometry', title: 'Геометрия', icon: 'ruler',
                    kinds: [
                        ['square', 'Площадь квадрата'],
                        ['rect', 'Площадь прямоугольника'],
                        ['perim', 'Периметр'],
                        ['triangle', 'Площадь треугольника'],
                        ['angles', 'Углы'],
                        ['pyth', 'Теорема Пифагора'],
                        ['circle', 'Окружность']
                    ] },
                { key: 'logic', title: 'Логика и задачи', icon: 'lightbulb',
                    kinds: [
                        ['logic', 'Текстовые задачи'],
                        ['speed', 'Движение'],
                        ['prob', 'Вероятность']
                    ] },
                { key: 'vpr', title: 'Подготовка к ВПР', icon: 'target', kinds: [
                    ['vpr', 'Смешанный вариант']
                ] }
            ];

            const CATALOG = (function() {
                const out = [];
                SECTIONS.forEach(s => s.kinds.forEach(p => out.push({
                    slug: s.key + '-' + p[0],
                    section: s.key,
                    sectionTitle: s.title,
                    icon: s.icon,
                    kind: p[0],
                    lvl: 3,
                    title: p[1],
                    sub: 'единый тренажёр без деления на уровни',
                    reward: 8
                })));
                return out;
            })();

            function makeQuestion(kind, lvl) {
                const item = (GEN[kind] || GEN.add)(lvl);
                const right = item.a,
                    opts = new Set([right]);
                let guard = 0;
                while (opts.size < 4 && guard++ < 40) {
                    const d = ri(1, Math.max(3, Math.round(Math.abs(right) * 0.25) + lvl * 2));
                    const c = Math.random() < .5 ? right + d : right - d;
                    if (c !== right && c >= 0) opts.add(c);
                }
                while (opts.size < 4) opts.add(right + opts.size);
                return { q: item.q, a: right, opts: shuffle(Array.from(opts)) };
            }

            MQ.runDrill = function(game) {
                const TOTAL = 10;
                let idx = 0,
                    correct = 0,
                    locked = false;
                const started = Date.now();
                const view = MQ.$('#mqView');
                const root = MQ.el('div', 'mq-drill mq-anim-in');
                const progress = MQ.el('div', 'mq-drill__progress');
                const dots = [];
                for (let i = 0; i < TOTAL; i++) {
                    const dot = MQ.el('span', 'mq-drill__dot');
                    progress.appendChild(dot);
                    dots.push(dot);
                }
                const question = MQ.el('div', 'mq-drill__question', '');
                const options = MQ.el('div', 'mq-drill__options', '');
                const score = MQ.el('div', 'mq-drill__score', '');
                const back = MQ.el('button', 'mq-btn mq-btn--ghost mq-btn--sm', MQ.icon('arrow-left', { size: 16 }) +
                    ' Назад');
                back.onclick = () => MQ.go('games');
                root.appendChild(back);
                root.appendChild(progress);
                root.appendChild(question);
                root.appendChild(options);
                root.appendChild(score);

                let currentQ = null;

                function nextQuestion() {
                    if (idx >= TOTAL) {
                        const elapsed = (Date.now() - started) / 1000;
                        const pct = Math.round(correct / TOTAL * 100);
                        score.innerHTML = '🎉 Готово! Правильных: ' + correct + '/' + TOTAL + ' (' + pct +
                            '%) за ' + Math.round(elapsed) + 'с';
                        if (correct === TOTAL) MQ.confetti(20);
                        return;
                    }
                    currentQ = makeQuestion(game.kind, game.lvl);
                    question.innerHTML = currentQ.q;
                    options.innerHTML = '';
                    currentQ.opts.forEach(o => {
                        const btn = MQ.el('button', 'mq-drill__option', String(o));
                        btn.onclick = () => {
                            if (locked) return;
                            locked = true;
                            const ok = o === currentQ.a;
                            if (ok) correct++;
                            btn.classList.add(ok ? 'mq-drill__option--correct' : 'mq-drill__option--wrong');
                            dots[idx].classList.add(ok ? 'mq-drill__dot--done' : 'mq-drill__dot--wrong');
                            if (!ok) {
                                options.querySelectorAll('.mq-drill__option').forEach(b => {
                                    if (Number(b.textContent) === currentQ.a) b.classList.add(
                                        'mq-drill__option--correct');
                                });
                            }
                            setTimeout(() => {
                                idx++;
                                locked = false;
                                nextQuestion();
                            }, 800);
                        };
                        options.appendChild(btn);
                    });
                    score.innerHTML = 'Вопрос ' + (idx + 1) + '/' + TOTAL + ' · Правильно: ' + correct;
                }
                nextQuestion();
                return root;
            };

            MQ.views.games = function() {
                const wrap = MQ.el('div', 'mq-stack mq-anim-in');
                wrap.appendChild(MQ.el('h2', '', 'Тренажёры'));
                const grid = MQ.el('div', 'mq-grid mq-grid--3');
                CATALOG.forEach(g => {
                    const c = MQ.el('div', 'mq-card mq-card--hover',
                        MQ.iconBadge(g.icon) + '<h3 style="margin:12px 0 4px">' + MQ.esc(g.title) +
                        '</h3>' +
                        '<p class="mq-muted" style="margin:0;font-size:13px">' + MQ.esc(g.sub) +
                        ' · ' + g.reward + ' баллов</p>');
                    c.style.cursor = 'pointer';
                    c.onclick = () => {
                        const drill = MQ.runDrill(g);
                        const view = MQ.$('#mqView');
                        view.innerHTML = '';
                        view.appendChild(drill);
                    };
                    grid.appendChild(c);
                });
                wrap.appendChild(grid);
                return wrap;
            };

        })();
    </script>

                    '<button type="button" class="mq-ed-btn" data-c="italic" style="font-style:italic">К</button>' +
                    '<button type="button" class="mq-ed-btn" data-c="underline" style="text-decoration:underline">Ч</button>' +
                    '<button type="button" class="mq-ed-btn" data-c="superscript">x²</button>' +
                    '<button type="button" class="mq-ed-btn" data-c="subscript">x₂</button>' +
                    '<button type="button" class="mq-ed-btn" data-ins="frac">a⁄b</button>' +
                    '<button type="button" class="mq-ed-btn" data-ins="sqrt">√</button>' +
                    '<button type="button" class="mq-ed-btn" data-ins="pi">π</button>' +
                    '<button type="button" class="mq-ed-btn" data-ins="pm">±</button>' +
                    '<button type="button" class="mq-ed-btn" data-ins="le">≤</button>' +
                    '<button type="button" class="mq-ed-btn" data-ins="ge">≥</button>' +
                    '<button type="button" class="mq-ed-btn" data-geo>Гео-конструктор</button>' +
                    '<button type="button" class="mq-ed-btn" data-c="insertUnorderedList">• список</button>' +
                    '<button type="button" class="mq-ed-btn" data-tex>Формула</button>' +
                    '<button type="button" class="mq-ed-btn" data-img>' + MQ.icon('image', { size: 14 }) +
                    ' Фото</button>' +
                    '<button type="button" class="mq-ed-btn" data-c="removeFormat">Сброс</button>' +
                    '<input type="file" accept="image/*" hidden data-file></div>' +
                    '<div class="mq-ed-body" contenteditable="true" data-body></div>' +
                    '<div class="mq-hint" style="margin-top:6px">Степени и индексы — кнопки x² и x₂. ' +
                    'Дроби, корни, π, ≤, ≥ выбираются кнопками; геометрию можно вставить конструктором.</div>';
                const body = root.querySelector('[data-body]');
                body.innerHTML = initial || '';
                root.querySelectorAll('[data-c]').forEach(b => {
                    b.onmousedown = e => e.preventDefault();
                    b.onclick = () => { body.focus();
                        document.execCommand(b.dataset.c, false, null); };
                });
                root.querySelectorAll('[data-cmd]').forEach(s => s.onchange = () => {
                    if (!s.value) return;
                    body.focus();
                    document.execCommand(s.dataset.cmd, false, s.value);
                    s.value = '';
                });
                root.querySelectorAll('[data-ins]').forEach(b => b.onclick = () => {
                    const map = {
                        frac: '\\(\\frac{a}{b}\\)',
                        sqrt: '\\(\\sqrt{x}\\)',
                        pi: '\\(\\pi\\)',
                        pm: '\\(\\pm\\)',
                        le: '\\(\\le\\)',
                        ge: '\\(\\ge\\)'
                    };
                    body.focus();
                    document.execCommand('insertText', false, ' ' + (map[b.dataset.ins] || '') + ' ');
                });
                root.querySelector('[data-geo]').onclick = async () => {
                    const type = await MQ.promptBox('Фигура: triangle, right, circle, rectangle, trapezoid',
                        'right', 'Гео-конструктор');
                    if (!type) return;
                    const svg = MQ.geometrySvg(type.trim().toLowerCase());
                    body.focus();
                    document.execCommand('insertHTML', false, svg);
                };
                root.querySelector('[data-tex]').onclick = async () => {
                    const tex = await MQ.promptBox('Формула в LaTeX', 'x^2 + 2x - 3 = 0', 'Формула');
                    if (!tex) return;
                    body.focus();
                    document.execCommand('insertText', false, ' \\(' + tex + '\\) ');
                };
                const fileIn = root.querySelector('[data-file]');
                root.querySelector('[data-img]').onclick = () => fileIn.click();
                fileIn.onchange = async () => {
                    const f = fileIn.files[0];
                    fileIn.value = '';
                    if (!f) return;
                    MQ.toast('Загружаю фото...', 'info', 1600);
                    const p = MQ.user.id + '/' + Date.now() + '-' + f.name.replace(/[^\w.\-]/g, '_');
                    const { error } = await MQ.sb.storage.from('tasks').upload(p, f);
                    if (error) { MQ.toast(error.message, 'err'); return; }
                    body.focus();
                    document.execCommand('insertHTML', false,
                        '<img src="' + MQ.pubUrl('tasks', p) + '" alt="">');
                };
                return { node: root, get html() { return body.innerHTML.trim(); },
                    get text() { return body.textContent.trim(); } };
            }

            async function taskDialog(task) {
                const t = task || {};
                const ed = editor(t.statement_html || (t.statement ? MQ.esc(t.statement) : ''));
                const form = MQ.el('div', 'mq-stack',
                    '<label class="mq-field"><span class="mq-label">Тема / номер</span>' +
                    '<input class="mq-input" id="tkT" value="' + MQ.esc(t.title || '') +
                    '" placeholder="Задание 6"></label>' +
                    '<div class="mq-row mq-row--wrap">' +
                    '<label class="mq-field" style="flex:1;min-width:110px"><span class="mq-label">Класс</span>' +
                    '<select class="mq-select" id="tkG"><option value="">—</option>' +
                    GRADES.map(g => '<option value="' + g + '"' + (t.grade == g ? ' selected' : '') + '>' +
                        g + ' класс</option>').join('') + '</select></label>' +
                    '<label class="mq-field" style="flex:1;min-width:130px"><span class="mq-label">Раздел</span>' +
                    '<select class="mq-select" id="tkS">' +
                    SECT.map(s => '<option value="' + s[0] + '"' + (t.section === s[0] ? ' selected' : '') + '>' +
                        s[1] + '</option>').join('') + '</select></label>' +
                    '<label class="mq-field" style="flex:1;min-width:110px"><span class="mq-label">Экзамен</span>' +
                    '<select class="mq-select" id="tkE"><option value="">—</option>' +
                    '<option value="vpr"' + (t.exam === 'vpr' ? ' selected' : '') + '>ВПР</option>' +
                    '<option value="oge"' + (t.exam === 'oge' ? ' selected' : '') + '>ОГЭ</option>' +
                    '<option value="ege_base"' + (t.exam === 'ege_base' ? ' selected' : '') + '>ЕГЭ база</option>' +
                    '<option value="ege_profile"' + (t.exam === 'ege_profile' ? ' selected' : '') +
                    '>ЕГЭ профиль</option></select></label>' +
                    '<label class="mq-field" style="max-width:120px"><span class="mq-label">Сложность</span>' +
                    '<input class="mq-input" id="tkD" type="number" min="1" max="5" value="' +
                    (t.difficulty || 1) + '"></label></div>' +
                    '<label class="mq-field"><span class="mq-label">Картинка к задаче (необязательно)</span>' +
                    '<input class="mq-input" id="tkImg" type="file" accept="image/*"></label>' +
                    (t.image_path ? '<div id="tkImgPrev"><img src="' + MQ.pubUrl('tasks', t.image_path) +
                        '" style="max-height:120px;border-radius:8px"></div>' :
                        '<div id="tkImgPrev"></div>') +
                    '<hr><span class="mq-label">Задача (текст + формулы)</span>');
                form.appendChild(ed.node);
                form.appendChild(MQ.el('div', 'mq-stack',
                    '<label class="mq-field"><span class="mq-label">Ответ</span>' +
                    '<input class="mq-input" id="tkA" value="' + MQ.esc(t.answer || '') + '"></label>' +
                    '<label class="mq-field"><span class="mq-label">Ответ или решение (подробное решение необязательно)</span>' +
                    '<textarea class="mq-textarea" id="tkSol">' + MQ.esc(t.solution || '') + '</textarea></label>' +
                    '<label class="mq-field"><span class="mq-label">Баллы за решение</span>' +
                    '<input class="mq-input" id="tkReward" type="number" min="0" value="' + (t.reward_points || 0) +
                    '"></label>'));

                const imgInput = MQ.$('#tkImg', form);
                const imgPrev = MQ.$('#tkImgPrev', form);
                imgInput.onchange = e => {
                    const f = e.target.files[0];
                    if (f) {
                        imgPrev.innerHTML = '<img src="' + URL.createObjectURL(f) +
                            '" style="max-height:120px;border-radius:8px">';
                    }
                };

                MQ.modalNode(t.id ? 'Изменить задачу' : 'Новая задача', form,
                    t.id ? 'Сохранить' : 'Добавить', async (go, close) => {
                        if (!ed.html) { MQ.toast('Заполните условие', 'warn'); return; }
                        go.disabled = true;
                        go.innerHTML = MQ.icon('refresh', { size: 17, cls: 'mq-spin' }) + 'Сохраняем...';
                        let image_path = t.image_path || null;
                        const f = MQ.$('#tkImg', form).files[0];
                        if (f) {
                            const p = 'tasks/' + Date.now() + '-' + f.name.replace(/[^\w.\-]/g, '_');
                            const { error } = await MQ.sb.storage.from('tasks').upload(p, f);
                            if (error) { MQ.toast(error.message, 'err');
                                go.disabled = false; return; }
                            image_path = p;
                        }
                        const data = {
                            title: MQ.$('#tkT', form).value.trim(),
                            grade: MQ.$('#tkG', form).value ? parseInt(MQ.$('#tkG', form).value, 10) :
                            null,
                            section: MQ.$('#tkS', form).value,
                            exam: MQ.$('#tkE', form).value || null,
                            difficulty: parseInt(MQ.$('#tkD', form).value, 10) || 1,
                            statement_html: ed.html,
                            answer: MQ.$('#tkA', form).value.trim(),
                            solution: MQ.$('#tkSol', form).value.trim() || null,
                            reward_points: parseInt(MQ.$('#tkReward', form).value, 10) || 0,
                            image_path: image_path,
                            author_id: MQ.user.id
                        };
                        let result;
                        if (t.id) {
                            result = await MQ.sb.from('tasks').update(data).eq('id', t.id);
                        } else {
                            result = await MQ.sb.from('tasks').insert(data);
                        }
                        if (result.error) { MQ.toast(result.error.message, 'err');
                            go.disabled = false; return; }
                        close();
                        MQ.toast(t.id ? 'Задача обновлена' : 'Задача добавлена', 'ok');
                        MQ.render();
                    });
            }

            async function solveTaskDialog(task) {
                const form = MQ.el('div', 'mq-stack',
                    '<p><b>' + MQ.esc(task.title) + '</b></p>' +
                    '<div>' + task.statement_html + '</div>' +
                    (task.image_path ? '<div><img src="' + MQ.pubUrl('tasks', task.image_path) +
                        '" style="max-height:200px;border-radius:8px"></div>' : '') +
                    '<label class="mq-field"><span class="mq-label">Ваш ответ</span>' +
                    '<input class="mq-input" id="solAns" placeholder="Введите ответ"></label>');
                MQ.modalNode('Решить задачу', form, 'Проверить', async (go, close) => {
                    const ans = MQ.$('#solAns', form).value.trim();
                    if (!ans) { MQ.toast('Введите ответ', 'warn'); return; }
                    const correct = ans.toLowerCase() === String(task.answer).toLowerCase();
                    const { error } = await MQ.sb.from('task_solutions').insert({
                        task_id: task.id,
                        user_id: MQ.user.id,
                        answer: ans,
                        correct: correct
                    });
                    if (error) { MQ.toast(error.message, 'err'); return; }
                    if (correct) {
                        const { data } = await MQ.rpc('add_points', { p_amount: task.reward_points });
                        if (data && data[0]) {
                            MQ.profile.points = data[0].points;
                            MQ.dressHeader();
                        }
                        MQ.pointsPop(task.reward_points, MQ.$('#mqPts'));
                        MQ.confetti(30);
                        MQ.toast('Правильно! Вы получили ' + task.reward_points + ' баллов 🎉', 'ok', 4000);
                    } else {
                        MQ.toast('Неправильно. Попробуйте ещё раз', 'err');
                    }
                    close();
                    MQ.render();
                });
            }

            MQ.views.bank = async function() {
                const isT = MQ.isTeacher();
                const f = MQ.params.filter || { grade: '', section: '', exam: '' };
                const wrap = MQ.el('div', 'mq-stack mq-anim-in');
                const head = MQ.el('div', 'mq-row mq-row--wrap',
                    '<h2 style="margin:0">Банк ФИПИ</h2><div class="mq-spacer"></div>');
                if (isT) {
                    const add = MQ.el('button', 'mq-btn mq-btn--primary', MQ.icon('plus', { size: 17 }) +
                    'Новая задача');
                    add.onclick = () => taskDialog(null);
                    head.appendChild(add);
                }
                wrap.appendChild(head);

                const bar = MQ.el('div', 'mq-card',
                    '<div class="mq-row mq-row--wrap">' +
                    '<select class="mq-select" id="fG" style="max-width:150px"><option value="">Все классы</option>' +
                    GRADES.map(g => '<option value="' + g + '"' + (f.grade == g ? ' selected' : '') + '>' +
                        g + ' класс</option>').join('') + '</select>' +
                    '<select class="mq-select" id="fS" style="max-width:170px"><option value="">Все разделы</option>' +
                    SECT.map(s => '<option value="' + s[0] + '"' + (f.section === s[0] ? ' selected' : '') + '>' +
                        s[1] + '</option>').join('') + '</select>' +
                    '<select class="mq-select" id="fE" style="max-width:160px"><option value="">Все экзамены</option>' +
                    '<option value="vpr"' + (f.exam === 'vpr' ? ' selected' : '') + '>ВПР</option>' +
                    '<option value="oge"' + (f.exam === 'oge' ? ' selected' : '') + '>ОГЭ</option>' +
                    '<option value="ege_base"' + (f.exam === 'ege_base' ? ' selected' : '') + '>ЕГЭ база</option>' +
                    '<option value="ege_profile"' + (f.exam === 'ege_profile' ? ' selected' : '') +
                    '>ЕГЭ профиль</option></select></div>');
                wrap.appendChild(bar);
                ['fG', 'fS', 'fE'].forEach(id => MQ.$('#' + id, bar).onchange = () =>
                    MQ.go('bank', { filter: { grade: MQ.$('#fG', bar).value,
                            section: MQ.$('#fS', bar).value, exam: MQ.$('#fE', bar).value } }));

                let q = MQ.sb.from('tasks').select('*').order('created_at', { ascending: false }).limit(80);
                if (f.grade) q = q.eq('grade', parseInt(f.grade, 10));
                if (f.section) q = q.eq('section', f.section);
                if (f.exam) q = q.eq('exam', f.exam);
                const { data: tasks, error } = await q;
                if (error) throw error;

                if (!tasks || !tasks.length) {
                    wrap.appendChild(MQ.empty(isT ? 'Задач нет — добавьте первую' : 'По этим фильтрам задач нет',
                        'book'));
                    return wrap;
                }

                let solvedIds = [];
                if (!isT && MQ.isAuthed()) {
                    const { data: sols } = await MQ.sb.from('task_solutions')
                        .select('task_id').eq('user_id', MQ.user.id).eq('correct', true);
                    if (sols) solvedIds = sols.map(s => s.task_id);
                }

                tasks.forEach(t => {
                    const c = MQ.el('div', 'mq-card');
                    const row = MQ.el('div', 'mq-row mq-row--wrap');
                    row.innerHTML =
                        '<div style="flex:1"><b>' + MQ.esc(t.title) + '</b>' +
                        '<span class="mq-chip" style="margin-left:8px">' + (t.grade ? t.grade + ' кл' :
                            '') + '</span>' +
                        '<span class="mq-chip">' + secName(t.section) + '</span>' +
                        (t.exam ? '<span class="mq-chip">' + t.exam.toUpperCase() + '</span>' : '') +
                        '</div>';
                    const alreadySolved = solvedIds.includes(t.id);
                    if (!isT && MQ.isAuthed()) {
                        const btn = MQ.el('button', 'mq-btn ' + (alreadySolved ? 'mq-btn--ghost' :
                                'mq-btn--primary mq-btn--sm'),
                            alreadySolved ? MQ.icon('check', { size: 15 }) + 'Решено' : 'Решить');
                        if (!alreadySolved) {
                            btn.onclick = () => solveTaskDialog(t);
                        }
                        row.appendChild(btn);
                    }
                    c.appendChild(row);
                    if (t.statement_html) {
                        const st = MQ.el('div', '', t.statement_html);
                        st.style.marginTop = '8px';
                        c.appendChild(st);
                    }
                    if (t.image_path) {
                        const img = MQ.el('img', '', '');
                        img.src = MQ.pubUrl('tasks', t.image_path);
                        img.style.maxHeight = '160px';
                        img.style.borderRadius = '8px';
                        img.style.marginTop = '8px';
                        c.appendChild(img);
                    }
                    wrap.appendChild(c);
                });
                return wrap;
            };

            MQ.taskDialog = taskDialog;

        })();
    </script>

    <!-- =====================================================================
    B8 — ПРОБНИКИ (экзамены)
    ===================================================================== -->
    <script>
        (function() {
            'use strict';
            const MQ = window.MQ;
            const EXAMS = [
                ['vpr', 'ВПР', 'target'],
                ['oge', 'ОГЭ', 'trophy'],
                ['ege_base', 'ЕГЭ база', 'chart'],
                ['ege_profile', 'ЕГЭ профиль', 'chart']
            ];
            const GRADES = [4, 5, 6, 7, 8, 9, 10, 11];
            const examName = k => (EXAMS.filter(e => e[0] === k)[0] || ['', '—', ''])[1];
            const examIcon = k => (EXAMS.filter(e => e[0] === k)[0] || ['', '', 'target'])[2];

            async function paperDialog() {
                const dz = MQ.dropzone({ title: 'Файлы пробника', hint: 'Вариант, ответы, критерии · до 25 МБ каждый',
                    max: 12 });
                const form = MQ.el('div', 'mq-stack',
                    '<label class="mq-field"><span class="mq-label">Название</span>' +
                    '<input class="mq-input" id="epT" placeholder="ОГЭ, вариант 12"></label>' +
                    '<div class="mq-row mq-row--wrap">' +
                    '<label class="mq-field" style="flex:1;min-width:110px"><span class="mq-label">Экзамен</span>' +
                    '<select class="mq-select" id="epE">' +
                    EXAMS.map(e => '<option value="' + e[0] + '">' + e[1] + '</option>').join('') + '</select></label>' +
                    '<label class="mq-field" style="flex:1;min-width:100px"><span class="mq-label">Класс</span>' +
                    '<select class="mq-select" id="epG"><option value="">—</option>' +
                    GRADES.map(g => '<option value="' + g + '">' + g + '</option>').join('') + '</select></label>' +
                    '<label class="mq-field" style="flex:1;min-width:100px"><span class="mq-label">Вариант</span>' +
                    '<input class="mq-input" id="epV" placeholder="12"></label></div>' +
                    '<label class="mq-field"><span class="mq-label">Ссылка на источник (если есть)</span>' +
                    '<input class="mq-input" id="epSrc" type="url" placeholder="https://fipi.ru/..."></label>');
                form.appendChild(dz.node);

                MQ.modalNode('Загрузить пробник', form, 'Загрузить', async (go, close) => {
                    const title = MQ.$('#epT', form).value.trim();
                    if (!title) { MQ.toast('Укажите название', 'warn'); return; }
                    if (!dz.files.length) { MQ.toast('Прикрепите хотя бы один файл', 'warn'); return; }
                    go.disabled = true;
                    go.innerHTML = MQ.icon('refresh', { size: 17, cls: 'mq-spin' }) + 'Загрузка...';
                    const files = await dz.upload('exams', 'papers');
                    const g = MQ.$('#epG', form).value;
                    const row = {
                        title,
                        exam: MQ.$('#epE', form).value,
                        grade: g ? parseInt(g, 10) : null,
                        variant: MQ.$('#epV', form).value.trim() || null,
                        source_url: MQ.$('#epSrc', form).value.trim() || null,
                        files,
                        author_id: MQ.user.id
                    };
                    let res = await MQ.sb.from('exam_papers').insert(row);
                    if (res.error && /source_url/i.test(res.error.message || '')) {
                        delete row.source_url;
                        res = await MQ.sb.from('exam_papers').insert(row);
                    }
                    if (res.error) { MQ.toast(res.error.message, 'err');
                        go.disabled = false; return; }
                    close();
                    MQ.toast('Пробник загружен', 'ok');
                    MQ.render();
                });
            }

            MQ.views.exams = async function() {
                const isT = MQ.isTeacher();
                const cur = MQ.params.exam || '';
                const wrap = MQ.el('div', 'mq-stack mq-anim-in');
                const head = MQ.el('div', 'mq-row mq-row--wrap',
                    '<h2 style="margin:0">ВПР · ОГЭ · ЕГЭ база · ЕГЭ профиль</h2><div class="mq-spacer"></div>');
                if (isT) {
                    const add = MQ.el('button', 'mq-btn mq-btn--primary', MQ.icon('upload', { size: 17 }) +
                        'Загрузить пробник');
                    add.onclick = paperDialog;
                    head.appendChild(add);
                }
                wrap.appendChild(head);

                const tabs = MQ.el('div', 'mq-row mq-row--wrap');
                [
                    ['', 'Все']
                ].concat(EXAMS.map(e => [e[0], e[1]])).forEach(t => {
                    const b = MQ.el('button', 'mq-btn mq-btn--sm ' +
                        (cur === t[0] ? 'mq-btn--primary' : 'mq-btn--ghost'), t[1]);
                    b.onclick = () => MQ.go('exams', { exam: t[0] });
                    tabs.appendChild(b);
                });
                wrap.appendChild(tabs);

                wrap.appendChild(MQ.el('div', 'mq-card',
                    '<div class="mq-row">' + MQ.iconBadge('lightbulb', 'info') +
                    '<div><b>Только пробники</b><p class="mq-muted" style="margin:2px 0 0;font-size:13.5px">' +
                    'В этом разделе админ загружает только пробные варианты. Банк задач здесь не показывается.</p></div></div>'));

                let q = MQ.sb.from('exam_papers').select('*').order('created_at', { ascending: false }).limit(60);
                if (cur) q = q.eq('exam', cur);
                const { data: papers, error } = await q;
                if (error) throw error;

                if (!papers || !papers.length) {
                    wrap.appendChild(MQ.empty(isT ? 'Пробников нет — загрузите первый' : 'Пробников пока нет',
                        'target'));
                    return wrap;
                }
                papers.forEach(p => {
                    const meta = examName(p.exam) + (p.grade ? ' · ' + p.grade + ' класс' : '') +
                        (p.variant ? ' · вариант ' + p.variant : '');
                    const c = MQ.el('div', 'mq-card mq-card--hover',
                        '<div class="mq-card__head">' +
                        MQ.iconBadge(examIcon(p.exam), p.exam === 'ege' ? 'info' : p.exam === 'oge' ? 'ok' :
                            'warn') +
                        '<div style="flex:1;min-width:0"><h3 class="mq-card__title">' + MQ.esc(p.title) +
                        '</h3>' +
                        '<p class="mq-card__sub">' + MQ.esc(meta) + ' · ' + MQ.fmtDate(p.created_at) +
                        '</p></div></div>');
                    if (p.source_url) {
                        const src = MQ.el('a', 'mq-chip', MQ.icon('book', { size: 14 }) + 'Источник ФИПИ / ссылка');
                        src.href = p.source_url;
                        src.target = '_blank';
                        src.rel = 'noopener';
                        c.appendChild(src);
                    }

                            '<span class="mq-file__size">' + MQ.human(f.size) + '</span>' +

                            MQ.icon('download', { size: 15 }) + 'Открыть</button>');

                            const url = await MQ.fileUrl('exams', f.path);

                    c.appendChild(box);

                    wrap.appendChild(c);

                return wrap;
