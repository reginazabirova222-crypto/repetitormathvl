<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
    <meta name="theme-color" content="#6c5ce7">
    <title>iMath — репетитор по математике</title>
    <meta name="description" content="iMath: онлайн-занятия по математике, тренажёры, домашние задания, разбор ОГЭ, ЕГЭ, ВПР.">
    <link rel="preconnect" href="https://cdn.jsdelivr.net">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js">
    </script>
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js">
    </script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2">
    </script>
    <script defer src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js">
    </script>
    <style>
        /* ===== ПЕРЕМЕННЫЕ ===== */
        :root {
            --brand: #6c5ce7;
            --brand-2: #8b7cf6;
            --brand-dark: #4b3fc0;
            --ok: #00b894;
            --warn: #fdcb6e;
            --err: #e17055;
            --info: #0984e3;
            --bg: #f4f5fb;
            --surface: #fff;
            --surface-2: #fafbff;
            --text: #1c1f33;
            --muted: #6b7192;
            --line: #e6e8f5;
            --r-sm: 10px;
            --r: 16px;
            --r-lg: 24px;
            --r-full: 999px;
            --sh-1: 0 1px 2px rgba(28, 31, 51, .06), 0 2px 8px rgba(28, 31, 51, .05);
            --sh-2: 0 4px 14px rgba(28, 31, 51, .09);
            --sh-3: 0 14px 40px rgba(76, 63, 192, .18);
            --grad: linear-gradient(135deg, #6c5ce7, #8b7cf6 55%, #a78bfa);
            --grad-warm: linear-gradient(135deg, #fdcb6e, #e17055);
        }
        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        html {
            scroll-behavior: smooth;
            -webkit-tap-highlight-color: transparent;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, system-ui, sans-serif;
            background: var(--bg);
            color: var(--text);
            line-height: 1.5;
            min-height: 100vh;
            padding: 0 16px 40px;
        }
        img,
        svg {
            display: block;
            max-width: 100%;
        }
        button,
        input,
        select,
        textarea {
            font: inherit;
            color: inherit;
        }
        a {
            color: var(--brand);
            text-decoration: none;
        }
        .mq-hidden {
            display: none !important;
        }
        .mq-spacer {
            flex: 1;
        }
        .mq-row {
            display: flex;
            gap: 12px;
            align-items: center;
            flex-wrap: wrap;
        }
        .mq-row--wrap {
            flex-wrap: wrap;
        }
        .mq-stack {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }
        .mq-grid {
            display: grid;
            gap: 16px;
        }
        .mq-grid--2 {
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
        }
        .mq-grid--3 {
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
        }
        .mq-grid--4 {
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
        }
        .mq-card {
            background: var(--surface);
            border-radius: var(--r);
            box-shadow: var(--sh-1);
            padding: 18px 20px;
            transition: box-shadow .2s, transform .15s;
            border: 1px solid var(--line);
        }
        .mq-card--hover:hover {
            box-shadow: var(--sh-2);
            transform: translateY(-2px);
        }
        .mq-card--pad-lg {
            padding: 24px 28px;
        }
        .mq-card__head {
            display: flex;
            gap: 14px;
            align-items: center;
            margin-bottom: 8px;
        }
        .mq-card__title {
            font-size: 17px;
            font-weight: 600;
            margin: 0;
        }
        .mq-card__sub {
            color: var(--muted);
            font-size: 14px;
            margin: 2px 0 0;
        }
        .mq-btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 8px 18px;
            border-radius: var(--r-full);
            border: none;
            background: var(--surface);
            color: var(--text);
            font-weight: 500;
            font-size: 15px;
            cursor: pointer;
            transition: all .2s;
            box-shadow: var(--sh-1);
            text-align: center;
            justify-content: center;
            line-height: 1.3;
            white-space: nowrap;
        }
        .mq-btn--primary {
            background: var(--brand);
            color: #fff;
            box-shadow: var(--sh-2);
        }
        .mq-btn--primary:hover {
            background: var(--brand-dark);
            box-shadow: var(--sh-3);
            transform: translateY(-1px);
        }
        .mq-btn--ghost {
            background: transparent;
            box-shadow: none;
            border: 1px solid var(--line);
        }
        .mq-btn--ghost:hover {
            background: var(--surface-2);
            border-color: var(--brand);
        }
        .mq-btn--sm {
            padding: 4px 12px;
            font-size: 13px;
        }
        .mq-btn--lg {
            padding: 12px 28px;
            font-size: 17px;
        }
        .mq-btn--danger {
            background: var(--err);
            color: #fff;
        }
        .mq-btn--danger:hover {
            background: #c0392b;
        }
        .mq-btn:disabled {
            opacity: .5;
            pointer-events: none;
        }
        .mq-chip {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            background: var(--surface-2);
            padding: 2px 12px;
            border-radius: var(--r-full);
            font-size: 13px;
            color: var(--muted);
            border: 1px solid var(--line);
        }
        .mq-chip--brand {
            background: var(--brand);
            color: #fff;
            border-color: var(--brand);
        }
        .mq-chip--ok {
            background: var(--ok);
            color: #fff;
            border-color: var(--ok);
        }
        .mq-chip--warn {
            background: var(--warn);
            color: #fff;
            border-color: var(--warn);
        }
        .mq-field {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        .mq-label {
            font-weight: 500;
            font-size: 14px;
            color: var(--muted);
        }
        .mq-input,
        .mq-select,
        .mq-textarea {
            padding: 10px 14px;
            border-radius: var(--r-sm);
            border: 1px solid var(--line);
            background: var(--surface);
            font-size: 15px;
            transition: border .2s;
            width: 100%;
        }
        .mq-input:focus,
        .mq-select:focus,
        .mq-textarea:focus {
            outline: none;
            border-color: var(--brand);
            box-shadow: 0 0 0 3px rgba(108, 92, 231, .15);
        }
        .mq-textarea {
            min-height: 80px;
            resize: vertical;
        }
        .mq-hint {
            color: var(--muted);
            font-size: 13px;
            margin-top: 4px;
        }
        .mq-muted {
            color: var(--muted);
        }
        .mq-avatar {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: var(--grad);
            color: #fff;
            font-weight: 600;
            font-size: 18px;
            flex-shrink: 0;
        }
        .mq-avatar.max {
            background: linear-gradient(135deg, #0984e3, #74b9ff);
        }
        .mq-hero {
            text-align: center;
            padding: 40px 0 20px;
        }
        .mq-hero__lead {
            font-size: 18px;
            color: var(--muted);
            max-width: 600px;
            margin: 12px auto 24px;
        }
        .mq-hero__cta {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            justify-content: center;
            margin: 20px 0 28px;
        }
        .mq-hero__stats {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 24px 40px;
            margin-top: 16px;
        }
        .mq-hero__stat {
            text-align: center;
        }
        .mq-hero__stat b {
            display: block;
            font-size: 24px;
            color: var(--brand);
        }
        .mq-hero__stat span {
            font-size: 14px;
            color: var(--muted);
        }
        .mq-section {
            margin: 32px 0;
        }
        .mq-section__head {
            margin-bottom: 16px;
        }
        .mq-section__head h2 {
            font-size: 22px;
            margin-bottom: 4px;
        }
        .mq-section__head p {
            color: var(--muted);
            font-size: 15px;
        }
        .mq-theme-icon {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 48px;
            height: 48px;
            border-radius: 12px;
            background: var(--surface-2);
            color: var(--brand);
            flex-shrink: 0;
        }
        .mq-theme-icon.pythagoras {
            background: #dfe6e9;
            color: #0984e3;
        }
        .mq-theme-card {
            cursor: pointer;
        }
        .mq-review {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .mq-review__stars {
            display: flex;
            gap: 2px;
            color: var(--warn);
        }
        .mq-review__text {
            font-size: 15px;
            line-height: 1.5;
            margin: 4px 0;
        }
        .mq-review__who {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-top: 6px;
        }
        .mq-review__who b {
            display: block;
            font-size: 14px;
        }
        .mq-review__who .mq-muted {
            font-size: 13px;
        }
        .mq-faq {
            background: var(--surface);
            border-radius: var(--r);
            border: 1px solid var(--line);
            padding: 12px 18px;
            margin-bottom: 8px;
            cursor: pointer;
        }
        .mq-faq summary {
            font-weight: 500;
            font-size: 16px;
            outline: none;
        }
        .mq-faq__body {
            padding-top: 10px;
            color: var(--muted);
            font-size: 15px;
        }
        .mq-cta-band {
            background: var(--grad);
            color: #fff;
            padding: 32px 24px;
            border-radius: var(--r-lg);
            text-align: center;
        }
        .mq-cta-band h2 {
            font-size: 24px;
            margin-bottom: 8px;
        }
        .mq-cta-band p {
            font-size: 16px;
            opacity: .9;
            margin-bottom: 20px;
        }
        .mq-cta-band .mq-btn {
            background: #fff;
            color: var(--brand);
            box-shadow: var(--sh-2);
        }
        .mq-cta-band .mq-btn:hover {
            background: #f4f5fb;
        }
        .mq-contacts {
            display: flex;
            flex-wrap: wrap;
            gap: 12px 20px;
            justify-content: center;
            margin-top: 16px;
        }
        .mq-contact {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            color: var(--muted);
            font-size: 14px;
        }
        .mq-contact--wa {
            color: #25d366;
        }
        .mq-contact--tg {
            color: #0088cc;
        }
        .mq-contact--tel {
            color: var(--text);
        }
        .mq-footer {
            margin-top: 40px;
            padding-top: 20px;
            border-top: 1px solid var(--line);
            text-align: center;
            color: var(--muted);
            font-size: 14px;
            line-height: 1.6;
        }
        .mq-drill {
            max-width: 560px;
            margin: 0 auto;
        }
        .mq-drill__question {
            font-size: 20px;
            font-weight: 500;
            text-align: center;
            padding: 20px 0;
        }
        .mq-drill__options {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }
        .mq-drill__option {
            padding: 14px;
            border-radius: var(--r-sm);
            border: 2px solid var(--line);
            background: var(--surface);
            text-align: center;
            font-size: 18px;
            cursor: pointer;
            transition: all .15s;
        }
        .mq-drill__option:hover {
            border-color: var(--brand);
            background: var(--surface-2);
        }
        .mq-drill__option--correct {
            border-color: var(--ok);
            background: #e6f9f1;
        }
        .mq-drill__option--wrong {
            border-color: var(--err);
            background: #fde8e3;
        }
        .mq-drill__progress {
            display: flex;
            gap: 6px;
            justify-content: center;
            margin: 16px 0;
        }
        .mq-drill__dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: var(--line);
        }
        .mq-drill__dot--done {
            background: var(--ok);
        }
        .mq-drill__dot--wrong {
            background: var(--err);
        }
        .mq-drill__score {
            text-align: center;
            font-size: 16px;
            font-weight: 500;
        }
        .mq-files {
            display: flex;
            flex-direction: column;
            gap: 6px;
            margin-top: 8px;
        }
        .mq-file {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 8px 12px;
            background: var(--surface-2);
            border-radius: var(--r-sm);
            border: 1px solid var(--line);
            font-size: 14px;
        }
        .mq-file__name {
            flex: 1;
            word-break: break-word;
        }
        .mq-file__size {
            color: var(--muted);
            font-size: 12px;
        }
        .mq-dropzone {
            border: 2px dashed var(--line);
            border-radius: var(--r);
            padding: 30px 20px;
            text-align: center;
            cursor: pointer;
            transition: border .2s, background .2s;
        }
        .mq-dropzone.is-over {
            border-color: var(--brand);
            background: rgba(108, 92, 231, .05);
        }
        .mq-dropzone__icon {
            font-size: 40px;
            color: var(--muted);
        }
        .mq-dropzone__hint {
            color: var(--muted);
            font-size: 14px;
            margin-top: 6px;
        }
        .mq-ed-bar {
            display: flex;
            flex-wrap: wrap;
            gap: 4px;
            padding: 6px 8px;
            background: var(--surface-2);
            border-radius: var(--r-sm) var(--r-sm) 0 0;
            border: 1px solid var(--line);
            border-bottom: none;
        }
        .mq-ed-btn {
            padding: 4px 10px;
            border: 1px solid transparent;
            border-radius: 4px;
            background: transparent;
            cursor: pointer;
            font-size: 13px;
            transition: background .15s;
        }
        .mq-ed-btn:hover {
            background: var(--line);
        }
        .mq-ed-body {
            padding: 12px 14px;
            border: 1px solid var(--line);
            border-radius: 0 0 var(--r-sm) var(--r-sm);
            min-height: 100px;
            background: var(--surface);
            outline: none;
            font-size: 15px;
            line-height: 1.6;
        }
        .mq-ed-body:focus {
            border-color: var(--brand);
        }
        .mq-anim-in {
            animation: fadeUp .35s ease;
        }
        @keyframes fadeUp {
            from {
                opacity: 0;
                transform: translateY(12px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        .mq-spin {
            animation: spin .8s linear infinite;
        }
        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }
        .mq-toast-container {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 9999;
            display: flex;
            flex-direction: column;
            gap: 8px;
            align-items: center;
            pointer-events: none;
        }
        .mq-toast {
            padding: 12px 24px;
            border-radius: var(--r-full);
            background: var(--text);
            color: #fff;
            box-shadow: var(--sh-3);
            font-size: 15px;
            pointer-events: auto;
            animation: slideUp .25s ease;
            max-width: 90vw;
        }
        .mq-toast--ok {
            background: var(--ok);
        }
        .mq-toast--err {
            background: var(--err);
        }
        .mq-toast--warn {
            background: var(--warn);
            color: var(--text);
        }
        .mq-toast--info {
            background: var(--info);
        }
        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        .mq-modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, .4);
            backdrop-filter: blur(4px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 10000;
            padding: 20px;
            animation: fadeIn .2s;
        }
        .mq-modal {
            max-width: 560px;
            width: 100%;
            background: var(--surface);
            border-radius: var(--r-lg);
            padding: 28px 24px;
            box-shadow: var(--sh-3);
            max-height: 90vh;
            overflow-y: auto;
            animation: scaleIn .2s;
        }
        .mq-modal__title {
            font-size: 20px;
            font-weight: 600;
            margin-bottom: 12px;
        }
        .mq-modal__body {
            margin-bottom: 20px;
        }
        .mq-modal__actions {
            display: flex;
            gap: 10px;
            justify-content: flex-end;
        }
        @keyframes fadeIn {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }
        @keyframes scaleIn {
            from {
                transform: scale(.95);
                opacity: 0;
            }
            to {
                transform: scale(1);
                opacity: 1;
            }
        }
        .mq-confetti-container {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 99999;
            overflow: hidden;
        }
        .mq-confetti-piece {
            position: absolute;
            width: 10px;
            height: 10px;
            border-radius: 2px;
            animation: confettiFall linear forwards;
        }
        @keyframes confettiFall {
            0% {
                transform: translateY(-10vh) rotate(0deg);
                opacity: 1;
            }
            100% {
                transform: translateY(110vh) rotate(720deg);
                opacity: 0;
            }
        }
        /* адаптив */
        @media (max-width: 600px) {
            .mq-grid--2,
            .mq-grid--3,
            .mq-grid--4 {
                grid-template-columns: 1fr;
            }
            .mq-hero__stats {
                gap: 12px 20px;
            }
            .mq-hero__stat b {
                font-size: 20px;
            }
            .mq-modal {
                padding: 20px 16px;
            }
            .mq-drill__options {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div id="mqApp"></div>
    <script>
        /* =====================================================================
           ИНИЦИАЛИЗАЦИЯ

        (function() {

            MQ.ICONS = ICONS;

            MQ.icon = function(name, opts) {
                opts = opts || {};
                const size = opts.size || 18;
                const cls = opts.cls || '';
                const html = ICONS[name] || name;
                return '<span class="mq-icon ' + cls + '" style="font-size:' + size + 'px;line-height:1">' + html +

            };

            MQ.iconBadge = function(name, color) {

                const map = {
                    brand: 'var(--brand)',
                    ok: 'var(--ok)',

                    err: 'var(--err)',

                };
                const bg = map[c] || 'var(--brand)';
                return '<span style="display:inline-flex;align-items:center;justify-content:center;width:36px;height:36px;border-radius:50%;background:' +
                    bg + ';color:#fff;font-size:18px;flex-shrink:0">' + (ICONS[name] || name) + '</span>';
            };

            MQ.esc = function(s) {
                if (!s) return '';
                const div = document.createElement('div');
                div.textContent = s;
                return div.innerHTML;
            };

            MQ.human = function(bytes) {
                if (bytes < 1024) return bytes + ' Б';
                if (bytes < 1048576) return (bytes / 1024).toFixed(1) + ' КБ';
                return (bytes / 1048576).toFixed(1) + ' МБ';
            };

            MQ.pubUrl = function(bucket, path) {
                return MQ.sb.storage.from(bucket).getPublicUrl(path).data.publicUrl;
            };

            MQ.fileUrl = async function(bucket, path) {
                try {
                    const { data } = await MQ.sb.storage.from(bucket).createSignedUrl(path, 3600);
                    return data.signedUrl;
                } catch (e) {
                    return MQ.pubUrl(bucket, path);
                }
            };

            MQ.el = function(tag, cls, html) {
                const el = document.createElement(tag);
                if (cls) el.className = cls;
                if (html !== undefined) el.innerHTML = html;
                return el;
            };

            MQ.$ = function(sel, ctx) {
                return (ctx || document).querySelector(sel);
            };

            MQ.$$ = function(sel, ctx) {
                return Array.from((ctx || document).querySelectorAll(sel));
            };

            MQ.debounce = function(fn, ms) {
                let t;
                return function() {
                    clearTimeout(t);
                    t = setTimeout(() => fn.apply(this, arguments), ms);
                };
            };

            // --- toast ---
            MQ.toast = function(text, type, duration) {
                type = type || 'info';
                duration = duration || 2500;
                const container = document.getElementById('mqToasts') || (function() {
                    const c = MQ.el('div', 'mq-toast-container');
                    c.id = 'mqToasts';
                    document.body.appendChild(c);
                    return c;
                })();
                const t = MQ.el('div', 'mq-toast mq-toast--' + type, text);
                container.appendChild(t);
                setTimeout(() => { t.style.opacity = '0';
                    t.style.transition = 'opacity .3s'; }, duration);
                setTimeout(() => t.remove(), duration + 400);
            };

            // --- modal ---
            MQ.modalNode = function(title, bodyNode, okText, onOk) {
                const overlay = MQ.el('div', 'mq-modal-overlay');
                const modal = MQ.el('div', 'mq-modal');
                modal.innerHTML = '<div class="mq-modal__title">' + MQ.esc(title) + '</div>';
                const bodyWrap = MQ.el('div', 'mq-modal__body');
                bodyWrap.appendChild(bodyNode);
                modal.appendChild(bodyWrap);
                const actions = MQ.el('div', 'mq-modal__actions');
                const cancel = MQ.el('button', 'mq-btn mq-btn--ghost', 'Отмена');
                cancel.onclick = () => { overlay.remove();
                    if (MQ._modalResolve) MQ._modalResolve(false); };
                const ok = MQ.el('button', 'mq-btn mq-btn--primary', okText || 'OK');
                ok.onclick = async () => {
                    if (onOk) {
                        await onOk(ok, () => overlay.remove());
                    } else {
                        overlay.remove();
                        if (MQ._modalResolve) MQ._modalResolve(true);
                    }
                };
                actions.appendChild(cancel);
                actions.appendChild(ok);
                modal.appendChild(actions);
                overlay.appendChild(modal);
                document.body.appendChild(overlay);
                return overlay;
            };

            MQ.modal = function(title, html, okText, onOk) {
                const body = MQ.el('div', '', html);
                return MQ.modalNode(title, body, okText, onOk);
            };

            MQ.alertBox = function(text, title) {
                return new Promise((resolve) => {
                    MQ.modal(title || 'iMath', '<p>' + MQ.esc(text) + '</p>', 'Понятно', (btn, close) => {
                        close();
                        resolve(true);
                    });
                });
            };

            MQ.confirmBox = function(text, title) {
                return new Promise((resolve) => {
                    const body = MQ.el('div', '', '<p>' + MQ.esc(text) + '</p>');
                    const overlay = MQ.modalNode(title || 'Подтверждение', body, 'Да', async (btn, close) => {
                        close();
                        resolve(true);
                    });
                    const cancel = overlay.querySelector('.mq-btn--ghost');
                    if (cancel) {
                        cancel.onclick = () => { overlay.remove();
                            resolve(false); };
                    }
                });
            };

            MQ.promptBox = function(text, value, title) {
                return new Promise((resolve) => {
                    const body = MQ.el('div', 'mq-stack',
                        '<p>' + MQ.esc(text) + '</p>' +
                        '<input class="mq-input" id="mqPromptInput" value="' + MQ.esc(value || '') + '">');
                    const overlay = MQ.modalNode(title || 'Ввод', body, 'OK', (btn, close) => {
                        const val = MQ.$('#mqPromptInput', body).value;
                        close();
                        resolve(val);
                    });
                    const cancel = overlay.querySelector('.mq-btn--ghost');
                    if (cancel) {
                        cancel.onclick = () => { overlay.remove();
                            resolve(null); };
                    }
                    setTimeout(() => { const inp = MQ.$('#mqPromptInput', body); if (inp) inp.focus(); },
                    100);
                });
            };

            // --- confetti ---
            MQ.confetti = function(count) {
                count = count || 30;
                const container = MQ.el('div', 'mq-confetti-container');
                document.body.appendChild(container);
                const colors = ['#6c5ce7', '#00b894', '#fdcb6e', '#e17055', '#0984e3', '#fd79a8', '#fdcb6e'];
                for (let i = 0; i < count; i++) {
                    const piece = MQ.el('div', 'mq-confetti-piece');
                    const size = 6 + Math.random() * 8;
                    piece.style.width = size + 'px';
                    piece.style.height = size * 0.6 + 'px';
                    piece.style.background = colors[Math.floor(Math.random() * colors.length)];
                    piece.style.left = Math.random() * 100 + '%';
                    piece.style.animationDuration = 1.5 + Math.random() * 2 + 's';
                    piece.style.animationDelay = Math.random() * 0.8 + 's';
                    piece.style.borderRadius = Math.random() > 0.5 ? '50%' : '2px';
                    container.appendChild(piece);
                }
                setTimeout(() => container.remove(), 4000);
            };

            // --- points pop ---
            MQ.pointsPop = function(points, anchor) {
                if (!anchor) return;
                const el = MQ.el('div', '', '+' + points + ' 🎉');
                el.style.cssText =
                    'position:absolute;font-size:22px;font-weight:700;color:var(--ok);pointer-events:none;transition:all .8s ease;opacity:1;top:0;left:50%;transform:translateX(-50%)';
                anchor.style.position = 'relative';
                anchor.appendChild(el);
                requestAnimationFrame(() => {
                    el.style.top = '-30px';
                    el.style.opacity = '0';
                });
                setTimeout(() => el.remove(), 900);
            };

            // --- math render ---
            MQ.math = function(node) {
                if (window.renderMathInElement) {
                    try {
                        window.renderMathInElement(node, {
                            delimiters: [
                                { left: '\\(', right: '\\)', display: false },
                                { left: '\\[', right: '\\]', display: true }
                            ]
                        });
                    } catch (e) {}
                }
            };

            // --- empty state ---
            MQ.empty = function(text, icon) {
                return MQ.el('div', 'mq-card',
                    '<div style="text-align:center;padding:20px 0">' + MQ.icon(icon || 'book', { size: 48 }) +
                    '<p style="margin-top:8px;color:var(--muted)">' + MQ.esc(text) + '</p></div>');
            };

            // --- dropzone ---
            MQ.dropzone = function(opts) {
                opts = opts || {};
                const root = MQ.el('div', 'mq-stack');
                const title = opts.title || 'Загрузите файлы';
                const hint = opts.hint || 'Перетащите или нажмите для выбора';
                const max = opts.max || 10;
                const files = [];
                const drop = MQ.el('div', 'mq-dropzone',
                    '<div class="mq-dropzone__icon">' + MQ.icon('upload', { size: 40 }) + '</div>' +
                    '<div style="font-weight:500;margin-top:4px">' + MQ.esc(title) + '</div>' +
                    '<div class="mq-dropzone__hint">' + MQ.esc(hint) + '</div>');
                const input = MQ.el('input', '', '');
                input.type = 'file';
                input.multiple = true;
                input.style.display = 'none';
                drop.appendChild(input);

                const list = MQ.el('div', 'mq-files');
                const paint = () => {
                    list.innerHTML = '';
                    files.forEach((f, i) => {
                        const row = MQ.el('div', 'mq-file',
                            MQ.icon((f.type || '').startsWith('image') ? 'image' : 'file', { size: 17 }) +
                            '<span class="mq-file__name">' + MQ.esc(f.name) + '</span>' +
                            '<span class="mq-file__size">' + MQ.human(f.size) + '</span>' +
                            '<button class="mq-btn mq-btn--ghost mq-btn--sm" type="button">' +
                            MQ.icon('trash', { size: 14 }) + '</button>');
                        row.querySelector('button').onclick = () => {
                            files.splice(i, 1);
                            paint();
                        };
                        list.appendChild(row);
                    });
                };
                const add = (newFiles) => {
                    const arr = Array.from(newFiles || []);
                    for (const f of arr) {
                        if (files.length >= max) { MQ.toast('Максимум ' + max + ' файлов', 'warn'); break; }
                        if (f.size > 25 * 1024 * 1024) { MQ.toast(f.name + ' > 25 МБ', 'err'); continue; }
                        files.push(f);
                    }
                    paint();
                };
                drop.onclick = () => input.click();
                drop.onkeydown = e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault();
                        input.click(); } };
                input.onchange = () => { add(input.files);
                    input.value = ''; };
                ['dragenter', 'dragover'].forEach(ev => drop.addEventListener(ev, e => {
                    e.preventDefault();
                    drop.classList.add('is-over');
                }));
                ['dragleave', 'drop'].forEach(ev => drop.addEventListener(ev, e => {
                    e.preventDefault();
                    drop.classList.remove('is-over');
                    if (ev === 'drop' && e.dataTransfer) add(e.dataTransfer.files);
                }));
                root.appendChild(drop);
                root.appendChild(list);

                return {
                    node: root,
                    files,
                    clear() { files.length = 0;
                        paint(); },
                    async upload(bucket, prefix) {
                        const out = [];
                        const uploadFiles = opts.beforeUpload ? await opts.beforeUpload(files) : files;
                        for (const f of uploadFiles) {
                            const path = (prefix || MQ.user.id) + '/' + Date.now() + '-' + f.name.replace(/[^\w.\-]/g,
                                '_');
                            const { error } = await MQ.sb.storage.from(bucket || MQ.CFG.BUCKETS.hw).upload(path,
                            f);
                            if (error) { MQ.toast(f.name + ': ' + error.message, 'err'); continue; }
                            out.push({ path, name: f.name, size: f.size, type: f.type });
                        }
                        return out;
                    }
                };
            };

            // --- attach list ---
            function attachList(arr, bucket) {
                const files = Array.isArray(arr) ? arr : [];
                if (!files.length) return MQ.el('div');
                const box = MQ.el('div', 'mq-files');
                files.forEach(f => {
                    const row = MQ.el('div', 'mq-file',
                        MQ.icon((f.type || '').startsWith('image') ? 'image' : 'file', { size: 17 }) +
                        '<span class="mq-file__name">' + MQ.esc(f.name || 'файл') + '</span>' +
                        '<button class="mq-btn mq-btn--ghost mq-btn--sm" type="button">' +
                        MQ.icon('download', { size: 15 }) + 'Открыть</button>');
                    row.querySelector('button').onclick = async () => {
                        const url = await MQ.fileUrl(bucket || MQ.CFG.BUCKETS.hw, f.path);
                        if (url) window.open(url, '_blank', 'noopener');
                    };
                    box.appendChild(row);
                });
                return box;
            }

            // --- PDF converter for homework images ---
            async function homeworkFilesAsPdf(files) {
                const list = Array.from(files || []);
                const images = list.filter(f => (f.type || '').startsWith('image/'));
                const other = list.filter(f => !(f.type || '').startsWith('image/'));
                if (!images.length || !window.jspdf || !window.jspdf.jsPDF) return list;
                const pdf = new window.jspdf.jsPDF({ orientation: 'p', unit: 'mm', format: 'a4' });
                for (let i = 0; i < images.length; i++) {
                    const data = await new Promise((resolve, reject) => {
                        const r = new FileReader();
                        r.onload = () => resolve(r.result);
                        r.onerror = reject;
                        r.readAsDataURL(images[i]);
                    });
                    const img = await new Promise((resolve, reject) => {
                        const im = new Image();
                        im.onload = () => resolve(im);
                        im.onerror = reject;
                        im.src = data;
                    });
                    if (i) pdf.addPage();
                    const pageW = pdf.internal.pageSize.getWidth(),
                        pageH = pdf.internal.pageSize.getHeight();
                    const ratio = Math.min((pageW - 20) / img.width, (pageH - 20) / img.height);
                    const w = img.width * ratio,
                        h = img.height * ratio;
                    pdf.addImage(data, images[i].type.indexOf('png') > -1 ? 'PNG' : 'JPEG', (pageW - w) / 2, 10, w,
                    h);
                }
                const blob = pdf.output('blob');
                const file = new File([blob], 'homework-' + Date.now() + '.pdf', { type: 'application/pdf' });
                return [file].concat(other);
            }

            // --- helpers ---
            const fmtDate = d => { try { return new Date(d).toLocaleDateString('ru-RU', { day: 'numeric',
                        month: 'long' }); } catch (e) { return ''; } };
            const fmtTime = d => { try { return new Date(d).toLocaleTimeString('ru-RU', { hour: '2-digit',
                        minute: '2-digit' }); } catch (e) { return ''; } };
            const dayKey = d => { const x = new Date(d);
                return x.getFullYear() + '-' + String(x.getMonth() + 1).padStart(2, '0') + '-' + String(x.getDate())
                    .padStart(2, '0'); };

            function dayLabel(d) {
                const k = dayKey(d),
                    t = dayKey(new Date());
                const y = new Date();
                y.setDate(y.getDate() - 1);
                if (k === t) return 'Сегодня';
                if (k === dayKey(y)) return 'Вчера';
                return fmtDate(d);
            }

            MQ.CONTACT = {

                role: 'репетитор по математике',

                email: 'reginazabirova222@gmail.com'

            MQ.MAXIM = {

            Object.assign(MQ, {

                fmtDate,

                el: MQ.el,

                esc: MQ.esc,

                debounce: MQ.debounce,
                isTeacher() { return MQ.user && MQ.user.role === 'teacher'; },
                isAuthed() { return !!MQ.user; },
                go(view, params) {

                        window.scrollTo({ top: 0, behavior: 'smooth' });
                    }).catch(e => {

                        app.innerHTML = '<p>Ошибка загрузки</p>';

                },
                dressHeader() {

                },
                rpc(name, params) {
                    return MQ.sb.rpc(name, params);
                }
            });

            // --- init supabase ---
            const { createClient } = supabase;
            MQ.sb = createClient(SUPABASE_URL, SUPABASE_KEY);

            // --- auth ---
            async function initAuth() {
                const { data: { session }, error } = await MQ.sb.auth.getSession();
                if (error) { console.warn('auth error', error); return; }
                if (session) {
                    MQ.user = session.user;

                    MQ.user.role = MQ.profile.role || 'student';

                }
                MQ.dressHeader();
                MQ.render('home');
            }

            // --- views будут добавлены далее ---

            // Запуск
            initAuth();

            window.MQ = MQ;
        })();
