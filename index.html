      go.innerHTML = MQ.icon('refresh',{size:17,cls:'mq-spin'}) + 'Сохраняем...';
      const row = { student_id:studentId, teacher_id:MQ.user.id, value:picked,
        weight:Math.max(0.5, Math.min(5, parseFloat(MQ.$('#gdW', form).value) || 1)),
        kind:MQ.$('#gdK', form).value,
        topic:MQ.$('#gdT', form).value.trim() || null,
        comment:MQ.$('#gdC', form).value.trim() || null,
        given_on:MQ.$('#gdD', form).value || MQ.dayKey(new Date()) };
      const res = g.id ? await MQ.sb.from('grades').update(row).eq('id', g.id)
                       : await MQ.sb.from('grades').insert(row);
      if (res.error){ MQ.toast(res.error.message,'err'); go.disabled = false; return; }
      close(); MQ.toast('Оценка ' + picked + ' выставлена','ok'); MQ.render();
    });
};

async function summary(uid){
  const { data } = await MQ.rpc('grade_summary',{ p_student:uid });
  return (data && data[0]) || { total:0, avg_weighted:null, last_on:null, cnt5:0, cnt4:0, cnt3:0, cnt2:0 };
}
function summaryCard(s){
  const avg = s.avg_weighted != null ? Number(s.avg_weighted).toFixed(2) : '—';
  const bars = [[5,s.cnt5,'ok'],[4,s.cnt4,'brand'],[3,s.cnt3,'warn'],[2,s.cnt2,'err']];
  const max = Math.max(1, s.cnt5, s.cnt4, s.cnt3, s.cnt2);
  return MQ.el('div','mq-card mq-card--pad-lg',
    '<div class="mq-row mq-row--wrap" style="gap:22px">' +
      '<div style="text-align:center"><div style="font-size:40px;font-weight:800;line-height:1;color:var(--brand)">' +
      avg + '</div><div class="mq-muted" style="font-size:12.5px;margin-top:4px">средний балл</div></div>' +
      '<div style="flex:1;min-width:180px">' + bars.map(b =>
        '<div class="mq-gbar"><b style="width:14px">' + b[0] + '</b>' +
        '<div class="mq-gbar__t"><i style="width:' + (b[1]/max*100) + '%;background:var(--' + b[2] + ')"></i></div>' +
        '<span class="mq-muted" style="font-size:12.5px;width:22px;text-align:right">' + b[1] + '</span></div>'
      ).join('') + '</div>' +
      '<div style="text-align:center"><div style="font-size:24px;font-weight:800">' + s.total + '</div>' +
      '<div class="mq-muted" style="font-size:12.5px">всего оценок</div>' +
      (s.last_on ? '<div class="mq-muted" style="font-size:12px;margin-top:6px">последняя ' +
        MQ.fmtDate(s.last_on) + '</div>' : '') + '</div></div>');
}

async function gradeList(uid, canEdit, name){
  const box = MQ.el('div','mq-stack');
  const { data: rows, error } = await MQ.sb.from('grades').select('*')
    .eq('student_id', uid).order('given_on',{ ascending:false })
    .order('id',{ ascending:false }).limit(150);
  if (error) throw error;
  if (!rows || !rows.length){ box.appendChild(MQ.empty('Оценок пока нет','star')); return box; }
  const byMonth = {};
  rows.forEach(r => {
    const k = new Date(r.given_on).toLocaleDateString('ru-RU',{ month:'long', year:'numeric' });
    (byMonth[k] = byMonth[k] || []).push(r);
  });
  Object.keys(byMonth).forEach(m => {
    const list = byMonth[m];
    const sum = list.reduce((a,r) => a + r.value * Number(r.weight), 0);
    const w = list.reduce((a,r) => a + Number(r.weight), 0);
    const card = MQ.el('div','mq-card',
      '<div class="mq-card__head">' + MQ.iconBadge('calendar','info') +
      '<div style="flex:1"><h3 class="mq-card__title" style="text-transform:capitalize">' + m + '</h3>' +
      '<p class="mq-card__sub">' + list.length + ' оценок · средний ' +
      (w ? (sum/w).toFixed(2) : '—') + '</p></div></div>');
    list.forEach(r => {
      const row = MQ.el('div','mq-file',
        '<span class="mq-chip mq-chip--' + gColor(r.value) +
        '" style="font-size:16px;font-weight:800;min-width:34px;justify-content:center">' + r.value + '</span>' +
        '<span class="mq-file__name">' + MQ.esc(r.topic || kindName(r.kind)) +
        '<span class="mq-muted" style="font-weight:400;font-size:12.5px;display:block">' +
        kindName(r.kind) + (Number(r.weight) !== 1 ? ' · вес ' + r.weight : '') +
        ' · ' + MQ.fmtDate(r.given_on) + '</span></span>');
      if (r.comment){
        const i = MQ.el('button','mq-file__x', MQ.icon('lightbulb',{size:16}));
        i.title = 'Комментарий';
        i.onclick = () => MQ.alertBox(r.comment,'Комментарий преподавателя');
        row.appendChild(i);
      }
      if (canEdit){
        const e = MQ.el('button','mq-file__x', MQ.icon('edit',{size:15}));
        e.onclick = () => MQ.gradeDialog(uid, name || 'ученик', r);
        const d = MQ.el('button','mq-file__x', MQ.icon('trash',{size:15}));
        d.onclick = async () => {
          if (!await MQ.confirmBox('Удалить оценку ' + r.value + '?')) return;
          await MQ.sb.from('grades').delete().eq('id', r.id);
          MQ.toast('Удалено','ok'); MQ.render();
        };
        row.appendChild(e); row.appendChild(d);
      }
      card.appendChild(row);
    });
    box.appendChild(card);
  });
  return box;
}

MQ.views.journal = async function(){
  const role = MQ.role();
  const wrap = MQ.el('div','mq-stack mq-anim-in');

  if (role === 'student'){
    wrap.appendChild(MQ.el('h2','','Мои оценки'));
    wrap.appendChild(summaryCard(await summary(MQ.user.id)));
    wrap.appendChild(await gradeList(MQ.user.id, false));
    return wrap;
  }
  if (role === 'parent'){
    const { data: kids } = await MQ.sb.from('profiles')
      .select('id,full_name').eq('parent_id', MQ.user.id);
    if (!kids || !kids.length){
      wrap.appendChild(MQ.el('h2','','Оценки'));
      wrap.appendChild(MQ.empty('Аккаунт ребёнка ещё не привязан. Попросите преподавателя связать вас.','family'));
      return wrap;
    }
    const cur = MQ.params.uid || kids[0].id;
    const curName = (kids.filter(k => k.id === cur)[0] || kids[0]).full_name || 'Ученик';
    wrap.appendChild(MQ.el('h2','','Оценки · ' + MQ.esc(curName)));
    if (kids.length > 1){
      const tabs = MQ.el('div','mq-row mq-row--wrap');
      kids.forEach(k => {
        const b = MQ.el('button','mq-btn mq-btn--sm ' +
          (k.id === cur ? 'mq-btn--primary' : 'mq-btn--ghost'), MQ.esc(k.full_name || 'Ученик'));
        b.onclick = () => MQ.go('journal',{ uid:k.id });
        tabs.appendChild(b);
      });
      wrap.appendChild(tabs);
    }
    wrap.appendChild(summaryCard(await summary(cur)));
    wrap.appendChild(await gradeList(cur, false));
    return wrap;
  }

  const { data: studs } = await MQ.sb.from('profiles')
    .select('id,full_name').eq('role','student').order('full_name').limit(100);
  if (!studs || !studs.length){
    wrap.appendChild(MQ.el('h2','','Журнал'));
    wrap.appendChild(MQ.empty('Учеников пока нет','users'));
    return wrap;
  }
  const cur = MQ.params.uid || studs[0].id;
  const curName = (studs.filter(s => s.id === cur)[0] || studs[0]).full_name || 'Ученик';
  const head = MQ.el('div','mq-row mq-row--wrap','<h2 style="margin:0">Журнал</h2><div class="mq-spacer"></div>');
  const add = MQ.el('button','mq-btn mq-btn--primary', MQ.icon('plus',{size:17}) + 'Поставить оценку');
  add.onclick = () => MQ.gradeDialog(cur, curName, null);
  head.appendChild(add);
  wrap.appendChild(head);

  const sel = MQ.el('div','mq-card',
    '<label class="mq-field"><span class="mq-label">Ученик</span><select class="mq-select" id="jStu">' +
    studs.map(s => '<option value="' + s.id + '"' + (s.id === cur ? ' selected' : '') + '>' +
      MQ.esc(s.full_name || 'Без имени') + '</option>').join('') + '</select></label>');
  MQ.$('#jStu', sel).onchange = e => MQ.go('journal',{ uid:e.target.value });
  wrap.appendChild(sel);
  wrap.appendChild(summaryCard(await summary(cur)));
  wrap.appendChild(await gradeList(cur, true, curName));
  return wrap;
};
})();
</script>

<script>

(function(){

async function itemDialog(item){
  const it = item || {};
  const form = MQ.el('div','mq-stack',
    '<label class="mq-field"><span class="mq-label">Название</span>' +
    '<input class="mq-input" id="siT" value="' + MQ.esc(it.title || '') + '" placeholder="Набор наклеек"></label>' +
    '<label class="mq-field"><span class="mq-label">Описание</span>' +
    '<textarea class="mq-textarea" id="siD">' + MQ.esc(it.description || '') + '</textarea></label>' +
    '<div class="mq-row">' +
      '<label class="mq-field" style="flex:1"><span class="mq-label">Цена в баллах</span>' +
      '<input class="mq-input" id="siP" type="number" min="0" value="' + (it.price || 100) + '"></label>' +
      '<label class="mq-field" style="flex:1"><span class="mq-label">Количество</span>' +
      '<input class="mq-input" id="siS" type="number" min="0" placeholder="без лимита" value="' +
      (it.stock == null ? '' : it.stock) + '"></label></div>' +
    '<label class="mq-field"><span class="mq-label">Фото подарка</span>' +
    '<input class="mq-input" id="siF" type="file" accept="image/*"></label><div id="siPrev"></div>');
  if (it.image_path) MQ.$('#siPrev', form).innerHTML =
    '<img src="' + MQ.pubUrl('shop', it.image_path) + '" style="max-height:150px;border-radius:12px">';
  MQ.$('#siF', form).onchange = e => {
    const f = e.target.files[0];
    if (f) MQ.$('#siPrev', form).innerHTML =
      '<img src="' + URL.createObjectURL(f) + '" style="max-height:150px;border-radius:12px">';
  };
  MQ.modalNode(it.id ? 'Изменить подарок' : 'Новый подарок', form,
    it.id ? 'Сохранить' : 'Добавить', async (go, close) => {
      const title = MQ.$('#siT', form).value.trim();
      if (!title){ MQ.toast('Укажите название','warn'); return; }
      go.disabled = true;
      go.innerHTML = MQ.icon('refresh',{size:17,cls:'mq-spin'}) + 'Сохраняем...';
      let image_path = it.image_path || null;
      const f = MQ.$('#siF', form).files[0];
      if (f){
        const p = 'items/' + Date.now() + '-' + f.name.replace(/[^\w.\-]/g,'_');
        const { error } = await MQ.sb.storage.from('shop').upload(p, f);
        if (error){ MQ.toast(error.message,'err'); go.disabled = false; return; }
        image_path = p;
      }
      const st = MQ.$('#siS', form).value.trim();
      const row = { title, description:MQ.$('#siD', form).value.trim() || null,
        price:Math.max(0, parseInt(MQ.$('#siP', form).value,10) || 0),
        stock: st === '' ? null : Math.max(0, parseInt(st,10) || 0),
        image_path, author_id:MQ.user.id };
      const res = it.id ? await MQ.sb.from('shop_items').update(row).eq('id', it.id)
                        : await MQ.sb.from('shop_items').insert(row);
      if (res.error){ MQ.toast(res.error.message,'err'); go.disabled = false; return; }
      close(); MQ.toast('Готово','ok'); MQ.render();
    });
}

MQ.views.shop = async function(){
  const isT = MQ.isTeacher();
  const wrap = MQ.el('div','mq-stack mq-anim-in');
  const head = MQ.el('div','mq-row mq-row--wrap',
    '<div><h2 style="margin:0">Магазин</h2><p class="mq-muted" style="margin:2px 0 0;font-size:14px">' +
    (isT ? 'Подарки за баллы' : 'Ваши баллы: <b>' + ((MQ.profile && MQ.profile.points) || 0) + '</b>') +
    '</p></div><div class="mq-spacer"></div>');
  if (isT){
    const add = MQ.el('button','mq-btn mq-btn--primary', MQ.icon('plus',{size:17}) + 'Добавить подарок');
    add.onclick = () => itemDialog(null);
    head.appendChild(add);
  }
  wrap.appendChild(head);

  const { data: items, error } = await MQ.sb.from('shop_items').select('*').order('price').limit(60);
  if (error) throw error;
  if (!items || !items.length){
    wrap.appendChild(MQ.empty(isT ? 'Подарков нет — добавьте первый' : 'Пока пусто','gift'));
    return wrap;
  }
  const grid = MQ.el('div','mq-grid mq-grid--3');
  items.forEach(it => {
    const pts = (MQ.profile && MQ.profile.points) || 0;
    const out = it.stock != null && it.stock <= 0;
    const can = pts >= it.price && !out && it.is_active;
    const c = MQ.el('div','mq-card mq-card--hover',
      (it.image_path ? '<img class="mq-shop-img" src="' + MQ.pubUrl('shop', it.image_path) + '" alt="">'
        : '<div class="mq-shop-ph">' + MQ.icon('gift',{size:38}) + '</div>') +
      '<h3 style="margin:0 0 4px;font-size:16px">' + MQ.esc(it.title) + '</h3>' +
      (it.description ? '<p class="mq-muted" style="font-size:13.5px;margin:0 0 8px">' +
        MQ.esc(it.description) + '</p>' : '') +
      '<div class="mq-row mq-row--wrap" style="margin-bottom:10px">' +
        '<span class="mq-chip mq-chip--warn">' + MQ.icon('coin',{size:14}) + it.price + '</span>' +
        (it.stock != null ? '<span class="mq-chip">осталось ' + it.stock + '</span>' : '') +
        (!it.is_active ? '<span class="mq-chip mq-chip--err">скрыт</span>' : '') + '</div>');
    if (isT){
      const row = MQ.el('div','mq-row mq-row--wrap');
      const ed = MQ.el('button','mq-btn mq-btn--ghost mq-btn--sm', MQ.icon('edit',{size:15}) + 'Изменить');

        await MQ.sb.from('shop_items').update({ is_active: !it.is_active }).eq('id', it.id);

      const dl = MQ.el('button','mq-btn mq-btn--ghost mq-btn--sm', MQ.icon('trash',{size:15}));

        if (!await MQ.confirmBox('Удалить «' + it.title + '»?')) return;
        await MQ.sb.from('shop_items').delete().eq('id', it.id);
        MQ.toast('Удалено','ok'); MQ.render();

      const b = MQ.el('button','mq-btn mq-btn--block ' + (can ? 'mq-btn--primary' : 'mq-btn--ghost'),

      };

    grid.appendChild(c);

    const { data: my } = await MQ.sb.from('shop_orders').select('*')
      .eq('user_id', MQ.user.id).order('created_at',{ ascending:false }).limit(20);

        '<div><h3 class="mq-card__title">Мои обмены</h3></div></div>');
      my.forEach(o => box.appendChild(MQ.el('div','mq-file',
        MQ.icon('gift',{size:16}) + '<span class="mq-file__name">' + MQ.esc(o.title) + '</span>' +
        '<span class="mq-chip mq-chip--' + (o.status === 'done' ? 'ok' : 'warn') + '">' +
        (o.status === 'done' ? 'выдан' : o.status === 'cancelled' ? 'отменён' : 'ожидает') + '</span>')));
      wrap.appendChild(box);
    }
  }
  return wrap;
};

MQ.views.orders = async function(){
  const wrap = MQ.el('div','mq-stack mq-anim-in');
  wrap.appendChild(MQ.el('h2','','Заказы из магазина'));

      '<span class="mq-chip mq-chip--' + (o.status === 'done' ? 'ok' : 'warn') + '">' +
      (o.status === 'done' ? 'выдан' : o.status === 'cancelled' ? 'отменён' : 'ожидает') + '</span></div>');
    if (o.status === 'new'){
      const row = MQ.el('div','mq-row');
      const ok = MQ.el('button','mq-btn mq-btn--ok mq-btn--sm', MQ.icon('check',{size:15}) + 'Выдан');
      ok.onclick = async () => {
        await MQ.sb.from('shop_orders').update({ status:'done' }).eq('id', o.id);
        MQ.toast('Отмечено','ok'); MQ.render();
      };
      const no = MQ.el('button','mq-btn mq-btn--ghost mq-btn--sm', 'Отменить');
      no.onclick = async () => {
        await MQ.sb.from('shop_orders').update({ status:'cancelled' }).eq('id', o.id);
        MQ.toast('Отменено','info'); MQ.render();

      row.appendChild(ok); row.appendChild(no);
      c.appendChild(row);
    }
    wrap.appendChild(c);
  });
  return wrap;
};
})();

        '<option value="6">Очень крупный</option></select>' +
      '<button type="button" class="mq-ed-btn" data-c="bold" style="font-weight:800">Ж</button>' +
      '<button type="button" class="mq-ed-btn" data-c="italic" style="font-style:italic">К</button>' +
      '<button type="button" class="mq-ed-btn" data-c="underline" style="text-decoration:underline">Ч</button>' +
      '<button type="button" class="mq-ed-btn" data-c="superscript">x²</button>' +
      '<button type="button" class="mq-ed-btn" data-c="subscript">x₂</button>' +
      '<button type="button" class="mq-ed-btn" data-symbol="√(x)">√</button>' +
      '<button type="button" class="mq-ed-btn" data-symbol="a⁄b">a⁄b</button>' +
      '<button type="button" class="mq-ed-btn" data-symbol="sin(x)">sin</button>' +
      '<button type="button" class="mq-ed-btn" data-symbol="cos(x)">cos</button>' +
      '<button type="button" class="mq-ed-btn" data-c="insertUnorderedList">• список</button>' +
      '<button type="button" class="mq-ed-btn" data-tex>Формула</button>' +
      '<button type="button" class="mq-ed-btn" data-img>' + MQ.icon('image',{size:14}) + ' Фото</button>' +
      '<button type="button" class="mq-ed-btn" data-geometry>△ Геометрия</button>' +
      '<button type="button" class="mq-ed-btn" data-c="removeFormat">Сброс</button>' +
      '<input type="file" accept="image/*" hidden data-file></div>' +
    '<div class="mq-ed-body" contenteditable="true" data-body></div>' +
    '<div class="mq-hint" style="margin-top:6px">Степени и индексы — кнопки x² и x₂. ' +
    'Сложные формулы — «Формула» (LaTeX, например x^2+2x-3=0).</div>';
  const body = root.querySelector('[data-body]');
  body.innerHTML = initial || '';
  root.querySelectorAll('[data-c]').forEach(b => {
    b.onmousedown = e => e.preventDefault();
    b.onclick = () => { body.focus(); document.execCommand(b.dataset.c, false, null); };
  });
  root.querySelectorAll('[data-symbol]').forEach(b => b.onclick = () => {
    body.focus(); document.execCommand('insertText', false, b.dataset.symbol);
  });
  root.querySelector('[data-geometry]').onclick = () => {
    const box=MQ.el('div','mq-stack','<p class="mq-muted">Выберите фигуру — чертёж будет вставлен в материал.</p><div class="mq-row mq-row--wrap" data-shapes></div>');
    const shapes=[['Треугольник','△'],['Квадрат','□'],['Окружность','○'],['Трапеция','⏢'],['Угол','∠'],['Координаты','⌗']];
    shapes.forEach(x=>{const b=MQ.el('button','mq-btn mq-btn--ghost',x[1]+' '+x[0]);b.onclick=()=>{body.focus();document.execCommand('insertText',false,' '+x[1]+' ');document.querySelector('.mq-modal-back .mq-modal__x').click();};box.querySelector('[data-shapes]').appendChild(b);});
    MQ.modalNode('Конструктор геометрических фигур',box,'Готово',(_,close)=>close());
  };
  root.querySelectorAll('[data-cmd]').forEach(s => s.onchange = () => {
    if (!s.value) return;
    body.focus();
    document.execCommand(s.dataset.cmd, false, s.value);
    s.value = '';
  });
  root.querySelector('[data-tex]').onclick = async () => {
    const tex = await MQ.promptBox('Формула в LaTeX','x^2 + 2x - 3 = 0','Формула');
    if (!tex) return;
    body.focus();
    document.execCommand('insertText', false, ' \\(' + tex + '\\) ');
  };
  const fileIn = root.querySelector('[data-file]');
  root.querySelector('[data-img]').onclick = () => fileIn.click();
  fileIn.onchange = async () => {
    const f = fileIn.files[0];
    fileIn.value = '';
    if (!f) return;
    MQ.toast('Загружаю фото...','info',1600);
    const p = MQ.user.id + '/' + Date.now() + '-' + f.name.replace(/[^\w.\-]/g,'_');
    const { error } = await MQ.sb.storage.from('tasks').upload(p, f);
    if (error){ MQ.toast(error.message,'err'); return; }
    body.focus();
    document.execCommand('insertHTML', false,
      '<img src="' + MQ.pubUrl('tasks', p) + '" alt="">');
  };
  return { node:root, get html(){ return body.innerHTML.trim(); },
    get text(){ return body.textContent.trim(); } };
}

MQ.richEditor = editor;

// Обновлённый диалог создания/редактирования задачи
async function taskDialog(task){
  const t = task || {};
  const ed = editor(t.statement_html || (t.statement ? MQ.esc(t.statement) : ''));
  const solutionEd = editor(t.solution || '');
  const form = MQ.el('div','mq-stack',
    '<label class="mq-field"><span class="mq-label">Название / номер</span>' +
    '<input class="mq-input" id="tkT" value="' + MQ.esc(t.title || '') + '" placeholder="Задание 6"></label>' +
    '<div class="mq-row mq-row--wrap">' +
      '<label class="mq-field" style="flex:1;min-width:110px"><span class="mq-label">Экзамен</span>' +
      '<select class="mq-select" id="tkE"><option value="vpr"' + (t.exam === 'vpr' ? ' selected' : '') + '>ВПР</option>' +
      '<option value="oge"' + (t.exam === 'oge' ? ' selected' : '') + '>ОГЭ</option>' +
      '<option value="ege-profile"' + (t.exam === 'ege-profile' ? ' selected' : '') + '>ЕГЭ профиль</option>' +
      '<option value="ege-base"' + (t.exam === 'ege-base' ? ' selected' : '') + '>ЕГЭ база</option></select></label></div>' +
    '<label class="mq-field"><span class="mq-label">Изображение к задаче (необязательно)</span>' +
    '<input class="mq-input" id="tkImg" type="file" accept="image/*"></label>' +
    (t.image_path ? '<div id="tkImgPrev"><img src="' + MQ.pubUrl('tasks', t.image_path) + '" style="max-height:120px;border-radius:8px"></div>' : '<div id="tkImgPrev"></div>') +
    '<hr><span class="mq-label">Условие задачи (текст + формулы)</span>');
  form.appendChild(ed.node);
  form.appendChild(MQ.el('div','mq-stack',
    '<label class="mq-field"><span class="mq-label">Ответ</span>' +
    '<input class="mq-input" id="tkA" value="' + MQ.esc(t.answer || '') + '"></label>' +
    '<span class="mq-label">Решение (текст и LaTeX)</span>'));
  form.appendChild(solutionEd.node);
  form.appendChild(MQ.el('div','mq-stack',
    '<label class="mq-field"><span class="mq-label">Баллы за решение</span>' +
    '<input class="mq-input" id="tkReward" type="number" min="0" value="' + (t.reward_points || 0) + '"></label>'));

  const imgInput = MQ.$('#tkImg', form);
  const imgPrev = MQ.$('#tkImgPrev', form);
  imgInput.onchange = e => {
    const f = e.target.files[0];
    if (f) {
      imgPrev.innerHTML = '<img src="' + URL.createObjectURL(f) + '" style="max-height:120px;border-radius:8px">';
    }
  };

  MQ.modalNode(t.id ? 'Изменить задачу' : 'Новая задача', form,
    t.id ? 'Сохранить' : 'Добавить', async (go, close) => {
      if (!ed.html){ MQ.toast('Заполните условие','warn'); return; }
      go.disabled = true;
      go.innerHTML = MQ.icon('refresh',{size:17,cls:'mq-spin'}) + 'Сохраняем...';
      let image_path = t.image_path || null;
      const f = MQ.$('#tkImg', form).files[0];
      if (f){
        const p = 'tasks/' + Date.now() + '-' + f.name.replace(/[^\w.\-]/g,'_');
        const { error } = await MQ.sb.storage.from('tasks').upload(p, f);
        if (error){ MQ.toast(error.message,'err'); go.disabled = false; return; }
        image_path = p;
      }
      const row = {
        title: MQ.$('#tkT', form).value.trim() || null,
        statement_html: ed.html,
        statement: ed.text.slice(0,2000),
        section:'fipi', exam:MQ.$('#tkE', form).value, grade:null, difficulty:1,
        answer: MQ.$('#tkA', form).value.trim() || null,
        solution: solutionEd.html || null,
        image_path: image_path,
        reward_points: Math.max(0, parseInt(MQ.$('#tkReward', form).value,10) || 0),
        author_id: MQ.user.id
      };
      const res = t.id ? await MQ.sb.from('tasks').update(row).eq('id', t.id)
                       : await MQ.sb.from('tasks').insert(row);
      if (res.error){ MQ.toast(res.error.message,'err'); go.disabled = false; return; }
      close(); MQ.toast('Готово','ok'); MQ.render();
    });
}

function showTaskResult(task, title){
  const result = MQ.el('div','mq-stack',
    '<div class="mq-card"><b>Правильный ответ</b><div class="mq-task-body" style="margin-top:8px">' +
    MQ.esc(task.answer || 'Не указан') + '</div></div>' +
    '<div class="mq-card"><b>Решение</b><div class="mq-task-body" style="margin-top:8px">' +
    (task.solution || 'Решение пока не добавлено') + '</div></div>');
  MQ.modalNode(title || 'Ответ и решение', result, 'Закрыть', (_, done) => done());
  MQ.math(result);
}

// Ответ и решение становятся доступны ученику только после отправки своего ответа
async function solveTaskDialog(task) {
  const form = MQ.el('div','mq-stack');
  const body = MQ.el('div','mq-task-body');
  body.innerHTML = task.statement_html || MQ.esc(task.statement || '');
  form.appendChild(body);
  if (task.image_path) {
    const img = MQ.el('img','mq-task-img');
    img.src = MQ.pubUrl('tasks', task.image_path);
    form.appendChild(img);
  }
  form.appendChild(MQ.el('label','mq-field',
    '<span class="mq-label">Ваш ответ</span>' +
    '<input class="mq-input" id="solveAns" placeholder="Введите ответ">'
  ));
  if (task.reward_points > 0) {
    form.appendChild(MQ.el('div','mq-hint', 'За правильный ответ вы получите ' + task.reward_points + ' баллов.'));
  }

  MQ.modalNode('Решить задачу', form, 'Проверить', async (go, close) => {
    const answer = MQ.$('#solveAns', form).value.trim();
    if (!answer) { MQ.toast('Введите ответ','warn'); return; }
    go.disabled = true;
    go.innerHTML = MQ.icon('refresh',{size:17,cls:'mq-spin'}) + 'Проверка...';

    const correct = answer.toLowerCase() === (task.answer || '').toLowerCase();
    const { error } = await MQ.sb.from('task_solutions').insert({
      task_id: task.id,
      user_id: MQ.user.id,
      answer: answer,
      correct: correct
    });
    if (error) {
      MQ.toast(error.message, 'err');
      go.disabled = false;
      return;
    }

    if (correct && task.reward_points > 0) {
      const { data } = await MQ.rpc('add_points',{ p_amount: task.reward_points });
      if (data && data[0]) {
        MQ.profile.points = data[0].points;
        MQ.profile.streak = data[0].streak;
        MQ.dressHeader();
      }
      MQ.pointsPop(task.reward_points, MQ.$('#mqPts'));
      MQ.confetti(30);
      MQ.toast('Правильно! Вы получили ' + task.reward_points + ' баллов 🎉', 'ok', 4000);
    } else if (correct) {
      MQ.toast('Правильно!', 'ok');
    } else {
      MQ.toast('Ответ принят — сравните с решением', 'info');
    }
    close();
    showTaskResult(task, correct ? 'Верно!' : 'Проверьте решение');
  });
}

// Обновлённый вид банка задач
MQ.views.bank = async function(){
  const isT = MQ.isTeacher();
  const exam = MQ.params.exam || 'vpr';
  const wrap = MQ.el('div','mq-stack mq-anim-in');
  const head = MQ.el('div','mq-row mq-row--wrap','<h2 style="margin:0">Банк ФИПИ</h2><div class="mq-spacer"></div>');
  if (isT){
    const add = MQ.el('button','mq-btn mq-btn--primary', MQ.icon('plus',{size:17}) + 'Новая задача');
    add.onclick = () => taskDialog(null);
    head.appendChild(add);
  }
  wrap.appendChild(head);

  const tabs=MQ.el('div','mq-row mq-row--wrap');
  [['vpr','ВПР'],['oge','ОГЭ'],['ege-profile','ЕГЭ профиль'],['ege-base','ЕГЭ база']].forEach(x=>{
    const b=MQ.el('button','mq-btn mq-btn--sm '+(exam===x[0]?'mq-btn--primary':'mq-btn--ghost'),x[1]);
    b.onclick=()=>MQ.go('bank',{exam:x[0]}); tabs.appendChild(b);
  });
  wrap.appendChild(tabs);

  let q = MQ.sb.from('tasks').select('*').eq('exam',exam).order('created_at',{ ascending:false }).limit(80);
  const { data: tasks, error } = await q;
  if (error) throw error;

  if (!tasks || !tasks.length){
    wrap.appendChild(MQ.empty(isT ? 'Задач нет — добавьте первую' : 'По этим фильтрам задач нет','book'));
    return wrap;
  }

  let solvedIds = [];
  if (!isT && MQ.isAuthed()){
    const { data: sols } = await MQ.sb.from('task_solutions')
      .select('task_id').eq('user_id', MQ.user.id).eq('correct', true);
    if (sols) solvedIds = sols.map(s => s.task_id);
  }

  tasks.forEach(t => {
    const c = MQ.el('div','mq-card mq-card--hover');
    c.innerHTML = '<div class="mq-card__head">' + MQ.iconBadge('book') +
      '<div style="flex:1;min-width:0"><h3 class="mq-card__title">' +
      MQ.esc(t.title || 'Задача №' + t.id) + '</h3><p class="mq-card__sub">' +
      (t.exam ? ({vpr:'ВПР',oge:'ОГЭ','ege-profile':'ЕГЭ профиль','ege-base':'ЕГЭ база'}[t.exam] || t.exam.toUpperCase()) : '') +
      ' · источник: ФИПИ' +
      (t.reward_points > 0 ? ' · <b class="mq-chip mq-chip--ok" style="font-size:12px">+' + t.reward_points + ' баллов</b>' : '') +
      '</p></div>' +
      (isT ? '<span class="mq-chip">' + (solvedIds.length || 0) + ' решили</span>' : '') +
      '</div>';

    if (t.image_path) {
      const img = MQ.el('img','mq-task-img');
      img.src = MQ.pubUrl('tasks', t.image_path);
      c.prepend(img);
    }
    const body = MQ.el('div','mq-task-body');
    body.innerHTML = t.statement_html || MQ.esc(t.statement || '');
    c.appendChild(body);

    const row = MQ.el('div','mq-row mq-row--wrap');
    row.style.marginTop = '12px';
    if (isT && t.answer){
      const sh = MQ.el('button','mq-btn mq-btn--ghost mq-btn--sm', MQ.icon('eye',{size:15}) + 'Ответ');
      const ans = MQ.el('span','mq-chip mq-chip--ok mq-hide', MQ.esc(t.answer));
      sh.onclick = () => ans.classList.toggle('mq-hide');
      row.appendChild(sh); row.appendChild(ans);
    }
    if (isT && t.solution){
      const sl = MQ.el('button','mq-btn mq-btn--ghost mq-btn--sm', MQ.icon('lightbulb',{size:15}) + 'Решение');
      sl.onclick = () => { const n=MQ.el('div','mq-task-body',t.solution); MQ.modalNode('Решение',n,'Закрыть',(_,done)=>done()); MQ.math(n); };
      row.appendChild(sl);
    }
    if (isT){
      const ed = MQ.el('button','mq-btn mq-btn--ghost mq-btn--sm', MQ.icon('edit',{size:15}) + 'Изменить');
      ed.onclick = () => taskDialog(t);
      const dl = MQ.el('button','mq-btn mq-btn--ghost mq-btn--sm', MQ.icon('trash',{size:15}));
      dl.onclick = async () => {
        if (!await MQ.confirmBox('Удалить задачу?')) return;
        await MQ.sb.from('tasks').delete().eq('id', t.id);
        MQ.toast('Удалено','ok'); MQ.render();
      };
      row.appendChild(ed); row.appendChild(dl);
    } else {
      const alreadySolved = solvedIds.includes(t.id);
      const btn = MQ.el('button','mq-btn ' + (alreadySolved ? 'mq-btn--ok' : 'mq-btn--primary') + ' mq-btn--sm',
        alreadySolved ? 'Решено ✓' : (t.reward_points > 0 ? 'Решить (+' + t.reward_points + ')' : 'Решить')
      );
      if (!alreadySolved) {
        btn.onclick = () => solveTaskDialog(t);
      } else {
        btn.onclick = () => showTaskResult(t);
      }
      row.appendChild(btn);
    }
    c.appendChild(row);
    wrap.appendChild(c);
  });
  return wrap;
};

})();
</script>
<script>


/* =====================================================================
   B9.1 — ТЕМЫ: ТЕОРИЯ И ЗАДАЧИ (синхронизация через Supabase)
   ===================================================================== */
(function(){
'use strict';
const MQ = window.MQ;
const grades = [5,6,7,8,9,10,11];
const subjects = g => g <= 6 ? ['Математика'] : ['Алгебра','Геометрия','Теория вероятностей и статистика'];

async function loadTopics(grade, subject){
  if (!MQ.sb) return [];
  const { data, error } = await MQ.sb
    .from('topics')
    .select('*')
    .eq('grade', grade)
    .eq('subject', subject)
    .order('created_at', { ascending: false });
  if (error) {
    console.warn('[topics] load error:', error);
    return [];
  }
  return data || [];
}

async function saveTopic(row){
  if (!MQ.sb) throw new Error('Supabase не инициализирован');
  if (row.id) {
    const { error } = await MQ.sb
      .from('topics')
      .update({
        grade: row.grade,
        subject: row.subject,
        title: row.title,
        theory: row.theory,
        task: row.task,
        answer: row.answer,
        solution: row.solution,
        points: row.points || 0,
        image: row.image || null
      })
      .eq('id', row.id);
    if (error) throw error;
  } else {
    const { error } = await MQ.sb
      .from('topics')
      .insert({
        grade: row.grade,
        subject: row.subject,
        title: row.title,
        theory: row.theory,
        task: row.task,
        answer: row.answer,
        solution: row.solution,
        points: row.points || 0,
        image: row.image || null,
        author_id: MQ.user.id
      });
    if (error) throw error;
  }
}

async function deleteTopic(id){
  if (!MQ.sb) throw new Error('Supabase не инициализирован');
  const { error } = await MQ.sb
    .from('topics')
    .delete()
    .eq('id', id);
  if (error) throw error;
}

function topicDialog(old){
  const t = old || {};
  const theory = MQ.richEditor(t.theory || '');
  const task = MQ.richEditor(t.task || '');
  const form = MQ.el('div','mq-stack');
  form.innerHTML = `
    <div class="mq-row mq-row--wrap">
      <label class="mq-field" style="flex:1">
        <span class="mq-label">Класс</span>
        <select class="mq-select" id="tpG">
          ${grades.map(g => `<option ${t.grade == g ? 'selected' : ''} value="${g}">${g} класс</option>`).join('')}
        </select>
      </label>
      <label class="mq-field" style="flex:1">
        <span class="mq-label">Раздел</span>
        <select class="mq-select" id="tpS"></select>
      </label>
    </div>
    <label class="mq-field">
      <span class="mq-label">Название темы</span>
      <input class="mq-input" id="tpT" value="${MQ.esc(t.title||'')}" placeholder="Квадратные уравнения">
    </label>
    <b>Теоретический материал</b>
  `;
  form.appendChild(theory.node);
  form.appendChild(MQ.el('b','','Задача к теме'));
  form.appendChild(task.node);
  form.appendChild(MQ.el('div','mq-stack',`
    <label class="mq-field"><span class="mq-label">Рисунок к задаче</span>
      <input class="mq-input" id="tpImg" type="file" accept="image/*">
    </label>
    <div class="mq-row mq-row--wrap">
      <label class="mq-field" style="flex:1"><span class="mq-label">Ответ</span>
        <input class="mq-input" id="tpA" value="${MQ.esc(t.answer||'')}">
      </label>
      <label class="mq-field" style="flex:1"><span class="mq-label">Баллы</span>
        <input class="mq-input" id="tpP" type="number" min="0" value="${t.points||0}">
      </label>
    </div>
    <label class="mq-field"><span class="mq-label">Решение</span>
      <textarea class="mq-textarea" id="tpSol">${MQ.esc(t.solution||'')}</textarea>
    </label>
  `));

  const g = form.querySelector('#tpG');
  const sub = form.querySelector('#tpS');
  function paintSubjects(){
    sub.innerHTML = subjects(+g.value).map(x =>
      `<option ${t.subject === x ? 'selected' : ''}>${x}</option>`
    ).join('');
  }
  g.onchange = paintSubjects;
  paintSubjects();

  const imgInput = form.querySelector('#tpImg');
  const imgPrev = MQ.el('div');
  if (t.image) {
    imgPrev.innerHTML = `<img src="${t.image}" style="max-height:120px;border-radius:8px">`;
  }
  form.appendChild(imgPrev);
  imgInput.onchange = e => {
    const f = e.target.files[0];
    if (f) {
      const reader = new FileReader();
      reader.onload = ev => {
        imgPrev.innerHTML = `<img src="${ev.target.result}" style="max-height:120px;border-radius:8px">`;
      };
      reader.readAsDataURL(f);

  MQ.modalNode(t.id ? 'Изменить тему' : 'Новая тема', form, 'Сохранить', async (go, close) => {
    const title = form.querySelector('#tpT').value.trim();
    if (!title || !theory.html) {
      MQ.toast('Добавьте название и теорию', 'warn');

    go.disabled = true;
    go.innerHTML = MQ.icon('refresh',{size:17,cls:'mq-spin'}) + 'Сохраняем...';

    let image = t.image || null;

      if (error) {
        MQ.toast('Ошибка загрузки картинки: ' + error.message, 'err');
        go.disabled = false;

    }

    const row = {
      id: t.id || null,
      grade: +form.querySelector('#tpG').value,
      subject: form.querySelector('#tpS').value,
      title: title,
      theory: theory.html,
      task: task.html || '',
      answer: form.querySelector('#tpA').value.trim(),
      solution: form.querySelector('#tpSol').value.trim(),
      points: +form.querySelector('#tpP').value || 0,
      image: image
    };

    try {
      await saveTopic(row);
      close();
      MQ.toast('Тема сохранена', 'ok');
      MQ.render();
    } catch (e) {
      MQ.toast(e.message, 'err');
    } finally {
      go.disabled = false;
    }
  });
}

    const add = MQ.el('button','mq-btn mq-btn--primary', MQ.icon('plus',{size:17}) + 'Добавить тему');
    add.onclick = () => topicDialog();
    head.appendChild(add);

  wrap.appendChild(head);

  const bar = MQ.el('div','mq-card mq-row mq-row--wrap');

    </select>
    <select class="mq-select" id="ts" style="max-width:300px"></select>
  `;
  wrap.appendChild(bar);

  const gs = bar.querySelector('#tg');
  const ss = bar.querySelector('#ts');
  function paintSubjects(){
    ss.innerHTML = subjects(+gs.value).map(x =>
      `<option ${f.subject === x ? 'selected' : ''}>${x}</option>`
    ).join('');
  }
  paintSubjects();

  const goFilter = () => MQ.go('topics', { topicFilter: { grade: +gs.value, subject: ss.value } });
  gs.onchange = () => { paintSubjects(); goFilter(); };
  ss.onchange = goFilter;

  const rows = await loadTopics(f.grade, f.subject);
  if (!rows.length) {
    wrap.appendChild(MQ.empty(isT ? 'Добавьте первую тему в этот раздел' : 'Материалы скоро появятся', 'book'));
    return wrap;
  }

  rows.forEach(t => {
    const c = MQ.el('article','mq-card');
    c.innerHTML = `<h3>${MQ.esc(t.title)}</h3>
      <div class="mq-chip mq-chip--brand">${t.grade} класс · ${MQ.esc(t.subject)}</div>
      <h4 style="margin-top:18px">Теория</h4>
      <div class="mq-task-body">${t.theory}</div>`;
    if (t.task) {
      const taskDiv = MQ.el('div','mq-card');
      taskDiv.innerHTML = `<h4>Задача</h4><div class="mq-task-body">${t.task}</div>`;
      if (t.image) {
        const img = MQ.el('img','mq-task-img');
        img.src = t.image;
        taskDiv.appendChild(img);
      }
      const row = MQ.el('div','mq-row mq-row--wrap');
      row.style.marginTop = '10px';
      row.innerHTML = `
        <span class="mq-chip mq-chip--ok">${t.points} баллов</span>
        <button class="mq-btn mq-btn--ghost mq-btn--sm" data-answer>Ответ</button>
        <button class="mq-btn mq-btn--ghost mq-btn--sm" data-solution>Решение</button>
      `;
      row.querySelector('[data-answer]').onclick = () => MQ.alertBox(t.answer || 'Ответ пока не добавлен', 'Ответ');
      row.querySelector('[data-solution]').onclick = () => MQ.alertBox(t.solution || 'Решение пока не добавлено', 'Решение');
      taskDiv.appendChild(row);
      c.appendChild(taskDiv);
    }
    if (isT) {
      const editBtn = MQ.el('button','mq-btn mq-btn--ghost mq-btn--sm', 'Изменить');
      editBtn.style.marginTop = '12px';
      editBtn.onclick = () => topicDialog(t);
      const delBtn = MQ.el('button','mq-btn mq-btn--danger mq-btn--sm', MQ.icon('trash',{size:15}) + ' Удалить');
      delBtn.style.marginTop = '12px';
      delBtn.style.marginLeft = '8px';
      delBtn.onclick = async () => {
        if (!await MQ.confirmBox('Удалить тему «' + t.title + '»?')) return;
        try {
          await deleteTopic(t.id);
          MQ.toast('Тема удалена', 'ok');
          MQ.render();
        } catch(e) {
          MQ.toast(e.message, 'err');
        }
      };
      c.appendChild(editBtn);
      c.appendChild(delBtn);
    }
    wrap.appendChild(c);
  });

  MQ.math(wrap);
  return wrap;
};

(function(){
'use strict';
const MQ = window.MQ;
const EXAMS = [['vpr','ВПР','target'],['oge','ОГЭ','trophy'],['ege-profile','ЕГЭ профиль','chart'],['ege-base','ЕГЭ база','sigma']];
const GRADES = [4,5,6,7,8,9,10,11];
const examName = k => (EXAMS.filter(e => e[0] === k)[0] || ['','—',''])[1];
const examIcon = k => (EXAMS.filter(e => e[0] === k)[0] || ['','','target'])[2];

async function paperDialog(){
  const dz = MQ.dropzone({ title:'Файлы пробника', hint:'Вариант, ответы, критерии · до 25 МБ каждый', max:12 });
  const form = MQ.el('div','mq-stack',
    '<label class="mq-field"><span class="mq-label">Название</span>' +
    '<input class="mq-input" id="epT" placeholder="ОГЭ, вариант 12"></label>' +
    '<div class="mq-row mq-row--wrap">' +
      '<label class="mq-field" style="flex:1;min-width:110px"><span class="mq-label">Экзамен</span>' +
      '<select class="mq-select" id="epE">' +
      EXAMS.map(e => '<option value="' + e[0] + '">' + e[1] + '</option>').join('') + '</select></label></div>');
  form.appendChild(dz.node);

  MQ.modalNode('Загрузить пробник', form, 'Загрузить', async (go, close) => {
    const title = MQ.$('#epT', form).value.trim();
    if (!title){ MQ.toast('Укажите название','warn'); return; }
    if (!dz.files.length){ MQ.toast('Прикрепите хотя бы один файл','warn'); return; }
    go.disabled = true;
    go.innerHTML = MQ.icon('refresh',{size:17,cls:'mq-spin'}) + 'Загрузка...';
    const files = await dz.upload('exams','papers');
    const { error } = await MQ.sb.from('exam_papers').insert({
      title, exam:MQ.$('#epE', form).value,
      grade:null, variant:null,
      files, author_id:MQ.user.id });
    if (error){ MQ.toast(error.message,'err'); go.disabled = false; return; }
    close(); MQ.toast('Пробник загружен','ok'); MQ.render();
  });
}

MQ.views.exams = async function(){
  const isT = MQ.isTeacher();
  const cur = MQ.params.exam || 'vpr';
  const wrap = MQ.el('div','mq-stack mq-anim-in');
  const head = MQ.el('div','mq-row mq-row--wrap',
    '<h2 style="margin:0">ВПР · ОГЭ · ЕГЭ</h2><div class="mq-spacer"></div>');
  if (isT){
    const add = MQ.el('button','mq-btn mq-btn--primary', MQ.icon('upload',{size:17}) + 'Загрузить пробник');
    add.onclick = paperDialog;
    head.appendChild(add);
  }
  wrap.appendChild(head);

  const tabs = MQ.el('div','mq-row mq-row--wrap');
  EXAMS.map(e => [e[0], e[1]]).forEach(t => {
    const b = MQ.el('button','mq-btn mq-btn--sm ' +
      (cur === t[0] ? 'mq-btn--primary' : 'mq-btn--ghost'), t[1]);
    b.onclick = () => MQ.go('exams',{ exam:t[0] });
    tabs.appendChild(b);
  });
  wrap.appendChild(tabs);

  let q = MQ.sb.from('exam_papers').select('*').order('created_at',{ ascending:false }).limit(60);
  if (cur) q = q.eq('exam', cur);
  const { data: papers, error } = await q;
  if (error) throw error;

  if (!papers || !papers.length){
    wrap.appendChild(MQ.empty(isT ? 'Пробников нет — загрузите первый' : 'Пробников пока нет','target'));
    return wrap;
  }
  papers.forEach(p => {
    const meta = examName(p.exam) + (p.grade ? ' · ' + p.grade + ' класс' : '') +
      (p.variant ? ' · вариант ' + p.variant : '');
    const c = MQ.el('div','mq-card mq-card--hover',
      '<div class="mq-card__head">' +
      MQ.iconBadge(examIcon(p.exam), p.exam === 'ege' ? 'info' : p.exam === 'oge' ? 'ok' : 'warn') +
      '<div style="flex:1;min-width:0"><h3 class="mq-card__title">' + MQ.esc(p.title) + '</h3>' +
      '<p class="mq-card__sub">' + MQ.esc(meta) + ' · ' + MQ.fmtDate(p.created_at) + '</p></div></div>');
    const box = MQ.el('div','mq-files');
    (Array.isArray(p.files) ? p.files : []).forEach(f => {
      const row = MQ.el('div','mq-file',
        MQ.icon((f.type||'').startsWith('image') ? 'image' : 'file',{size:17}) +
        '<span class="mq-file__name">' + MQ.esc(f.name) + '</span>' +
        '<span class="mq-file__size">' + MQ.human(f.size) + '</span>' +
        '<button class="mq-btn mq-btn--ghost mq-btn--sm" type="button">' +
        MQ.icon('download',{size:15}) + 'Открыть</button>');
      row.querySelector('button').onclick = async () => {
        const url = await MQ.fileUrl('exams', f.path);
        if (url) window.open(url,'_blank','noopener');
      };
      box.appendChild(row);
    });
    c.appendChild(box);
    if (isT){
      const dl = MQ.el('button','mq-btn mq-btn--ghost mq-btn--sm', MQ.icon('trash',{size:15}) + 'Удалить');
      dl.style.marginTop = '10px';
      dl.onclick = async () => {
        if (!await MQ.confirmBox('Удалить «' + p.title + '»?')) return;
        await MQ.sb.from('exam_papers').delete().eq('id', p.id);
        MQ.toast('Удалено','ok'); MQ.render();
      };
      c.appendChild(dl);
    }
    wrap.appendChild(c);
  });
  return wrap;
};
})();
</script>
